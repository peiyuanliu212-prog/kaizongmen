  _hash(ix, iy, seed){ let h = (ix * 374761393 + iy * 668265263 + seed * 974711) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177); return (h ^ (h >>> 16)) >>> 0; },
  _mosaic(g, names, x, y, w, h, size, step, seed, shade){
    const tiles = names.map(n => this._softTile(n, size, shade)).filter(Boolean);
    if (!tiles.length) return;
    const x0 = Math.floor(x / step) * step, y0 = Math.floor(y / step) * step;
    for (let cy = y0; cy < y + h; cy += step) for (let cx = x0; cx < x + w; cx += step){
      const hh = this._hash(Math.round(cx / step), Math.round(cy / step), seed || 0);
      g.save(); g.translate(cx + size / 2, cy + size / 2);
      if (hh & 2) g.scale(-1, 1);
      if (hh & 4) g.scale(1, -1);
      g.drawImage(tiles[hh % tiles.length], -size / 2, -size / 2);
      g.restore();
    }
  },
  /* 池岸过渡条：源图自上而下＝水线/石岸/草。n 岸（草在北）上下翻转、e 岸（水在西）逆时针旋 90°、s 岸原样 */
  _shore(g, x, y, w, h, ori){
    const f = Art.F['gnd_shore_v1.png']; if (!f) return;
    const vert = (ori === 'e' || ori === 'w');
    const t = document.createElement('canvas'); t.width = vert ? h : w; t.height = vert ? w : h;
    const tg = t.getContext('2d');
    tg.translate(t.width / 2, t.height / 2);
    if (ori === 'n') tg.scale(1, -1);
    else if (ori === 'e') tg.rotate(-Math.PI / 2);
    else if (ori === 'w') tg.rotate(Math.PI / 2);
    tg.drawImage(f.img, f.x, f.y, f.w, f.h, -w / 2, -h / 2, w, h);
    g.drawImage(t, x, y);
  },
  /* 矩形四边羽化绘制（石阶压边用） */
  _featherDraw(g, name, x, y, w, h, feather){
    const f = Art.F[name]; if (!f) return;
    const t = document.createElement('canvas'); t.width = w; t.height = h;
    const tg = t.getContext('2d');
    tg.drawImage(f.img, f.x, f.y, f.w, f.h, 0, 0, w, h);
    tg.globalCompositeOperation = 'destination-out';
    const edge = (x0, y0, x1, y1, rx, ry, rw, rh) => { const gr = tg.createLinearGradient(x0, y0, x1, y1);
      gr.addColorStop(0, 'rgba(0,0,0,1)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
      tg.fillStyle = gr; tg.fillRect(rx, ry, rw, rh); };
    edge(0, 0, 0, feather, 0, 0, w, feather);
    edge(0, h, 0, h - feather, 0, h - feather, w, feather);
    edge(0, 0, feather, 0, 0, 0, feather, h);
    edge(w, 0, w - feather, 0, w - feather, 0, feather, h);
    g.drawImage(t, x, y);
  },
  /* 地面分区（自下而上）：草地打底 → 矿区岩面 → 土路动线 → 石板前坪 → 池塘三岸 → 药圃土基 → 大殿石阶 */
  _paintGroundTextured(g){
    const W = CONFIG.world.w, H = CONFIG.world.h;
    this._mosaic(g, ['gnd_grass_a_v1.png', 'gnd_grass_b_v1.png'], -40, -40, W + 80, H + 80, 168, 116, 7);
    if (Art.F['gnd_rock_v1.png']) this._mosaic(g, ['gnd_rock_v1.png'], 1240, 40, 328, 280, 150, 104, 61);   // 美术批二：矿区岩地真贴图（羽化平铺同 M3.5 法）
    else { g.fillStyle = '#8d8272'; g.fillRect(1240, 40, 328, 280);
      g.fillStyle = '#7e7362'; for (let i = 0; i < 14; i++) g.fillRect(1256 + (i * 89) % 290, 60 + (i * 67) % 230, 18, 10); }
    const dirt = ['gnd_dirt_v1.png'];
    this._mosaic(g, dirt, 756, 240, 88, 920, 132, 94, 21);
    this._mosaic(g, dirt, 120, 812, 1330, 64, 132, 94, 22);
    this._mosaic(g, dirt, 410, 560, 60, 260, 132, 94, 23);
    this._mosaic(g, dirt, 756, 1064, 560, 40, 132, 94, 24);
    const stone = ['gnd_stone_v1.png'];
    this._mosaic(g, stone, 596, 96, 408, 252, 148, 106, 31);    // 大殿前坪
    this._mosaic(g, stone, 364, 116, 312, 240, 148, 106, 32);   // 弟子居舍前坪
    this._mosaic(g, stone, 1052, 286, 356, 282, 148, 106, 33);  // 淬炼坊前坪
    this._mosaic(g, stone, 984, 624, 316, 244, 148, 106, 34);   // 出货台前坪
    this._mosaic(g, stone, 528, 924, 544, 276, 148, 106, 35);   // 山门广场
    this._mosaic(g, ['gnd_water_v1.png'], -10, 492, 232, 180, 140, 100, 41);
    this._shore(g, 6, 466, 210, 42, 'n');
    this._shore(g, 6, 648, 210, 42, 's');
    this._shore(g, 202, 494, 176, 40, 'e');
    const f = CONFIG.farm;
    this._mosaic(g, dirt, f.originX - 14, f.originY - 14, f.cols * (f.plotW + f.gap) + 16, f.rows * (f.plotH + f.gap) + 16, 120, 88, 51, 0.66);
    this._featherDraw(g, 'gnd_steps_v1.png', 742, 230, 116, 106, 16);
  },
  _prerenderStatic(){
    /* fix16：静态层渲染倍率钳 2——像素模式下静态层不直接上屏（只作 pixelLayer 的 ÷1 基底源，
       2× 采样已足），钳住免 dpr3 时 4800×3600 画布白吃内存；HD 模式 VIEW.dpr 本就 ≤2、行为不变。 */
    const dpr = Math.min(VIEW.dpr || 1, 2), W = CONFIG.world.w, H = CONFIG.world.h;
    const c = document.createElement('canvas'); c.width = W * dpr; c.height = H * dpr;
    const g = c.getContext('2d'); g.scale(dpr, dpr); g.imageSmoothingEnabled = false;   // 追加批1：静态层按 DPR 预渲染、关平滑防地面发糊
    if (typeof Art !== 'undefined' && Art.ready && Art.F['gnd_grass_a_v1.png']) this._paintGroundTextured(g);
    else {
      g.fillStyle = '#7d9b5e'; g.fillRect(0, 0, W, H);
      g.fillStyle = '#75915a';
      for (let x = 0; x < W; x += 64) for (let y = 0; y < H; y += 64)
        if ((x + y) % 128 === 0) g.fillRect(x, y, 64, 64);
      g.fillStyle = '#87a668';
      for (let i = 0; i < 90; i++) g.fillRect((i * 173) % W, (i * 271) % H, 24, 8);
      // 后山矿口地面（灰褐）
      g.fillStyle = '#8d8272'; g.fillRect(1240, 40, 328, 280);
      g.fillStyle = '#7e7362'; for (let i = 0; i < 14; i++) g.fillRect(1256 + (i * 89) % 290, 60 + (i * 67) % 230, 18, 10);
      // 土路（方格像素风）
      g.fillStyle = '#c9b088';
      g.fillRect(756, 240, 88, 920);
      g.fillRect(120, 812, 1330, 64);
      g.fillRect(410, 560, 60, 260);
      g.fillRect(756, 1064, 560, 40);
      // 药圃土基
      const f = CONFIG.farm;
      g.fillStyle = '#77572f';
      g.fillRect(f.originX - 14, f.originY - 14, f.cols * (f.plotW + f.gap) + 16, f.rows * (f.plotH + f.gap) + 16);
    }
    // 矿口围栏（木栅，两路径共用）
    g.fillStyle = '#5a4632';
    g.fillRect(1240, 40, 328, 14); g.fillRect(1240, 40, 14, 280); g.fillRect(1554, 40, 14, 280);
    g.fillRect(1240, 306, 140, 14); g.fillRect(1420, 306, 148, 14);
    if (this.isLocked('mineZone')){ g.fillStyle = '#8c2f22'; g.fillRect(1380, 300, 40, 26); }
    this.staticLayer = c;
    if (typeof CONFIG !== 'undefined' && CONFIG.art && CONFIG.art.pixelSample) this._buildPixelLayer();
    else this.pixelLayer = null;
  },
  /* 真机三问题批③：像素样板地面——静态层 ÷3 降采样（平滑开＝面积平均近似）→逐像素锁 18 色 D 调色板。
     一次性构建（静态层重绘时跟随重建），绘制时以最近邻放大回世界尺寸。file:// 下读像素被污染则只降采样不锁色。 */
  pixelLayer: null,
  /* 像素样板基底（真机三问题批③原法）：静态层 ÷3 降采样（平滑开＝面积平均近似）→逐像素锁 18 色 D 调色板。
     file:// 下读像素被污染则只降采样不锁色。试点层以此为兜底基底（石板坪/岩面等无原生贴图区沿用它）。 */
  _pixelBaseCanvas(){
    const src = this.staticLayer; if (!src) return null;
    const F = 1, w = Math.floor(CONFIG.world.w / F), h = Math.floor(CONFIG.world.h / F);   // fix15：÷1，地面 texel＝1 世界px（fix14 的 ÷2 仍偏粗，主人复否后改最高密度）
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d'); g.imageSmoothingEnabled = true;
    g.drawImage(src, 0, 0, w, h);
    try {
      const pal = CONFIG.art.paletteD.map(hx => [parseInt(hx.slice(1, 3), 16), parseInt(hx.slice(3, 5), 16), parseInt(hx.slice(5, 7), 16)]);
      const id = g.getImageData(0, 0, w, h), d = id.data;
      for (let i = 0; i < d.length; i += 4){
        let bi = 0, bd = Infinity;
        for (let j = 0; j < pal.length; j++){ const dr = d[i] - pal[j][0], dg = d[i + 1] - pal[j][1], db = d[i + 2] - pal[j][2];
          const dd = dr * dr + dg * dg + db * db; if (dd < bd){ bd = dd; bi = j; } }
        d[i] = pal[bi][0]; d[i + 1] = pal[bi][1]; d[i + 2] = pal[bi][2]; d[i + 3] = 255;
      }
      g.putImageData(id, 0, 0);
    } catch (e) { /* 画布污染降级：保留降采样版 */ }
    return c;
  },
  _buildPixelLayer(){
    if (typeof Art !== 'undefined' && Art.readyPxp){ this._buildPixelLayerNative(); if (this.pixelLayer) return; }
    this.pixelLayer = this._pixelBaseCanvas();
  },
  /* 像素地面层（全量批 v2）：布局与 _paintGroundTextured 逐项同构，贴图源全换原生像素——
     草地 pxp 草 A＋pxf 草 B（S7 带花）双贴图马赛克 → 土路动线 → 药圃田基 → 池塘水面＋S7 岸线三向
     → 矿区岩面（S7）→ 石板前坪×5 与大殿石阶（S7 台阶格，石板/台阶共用此格——生图侧清单本就同格）。
     pxf 地面帧未就绪才回退试点口径（石板/矿区/石阶从样板基底裁回）。构建在 ÷1 层上（fix15 由 ÷2 改，贴图 1:1 采样），最近邻出图。 */
  _buildPixelLayerNative(){
    const base = this._pixelBaseCanvas(); if (!base){ this.pixelLayer = null; return; }
    if (!Art.F['pxp_gnd_grass_v1.png'] || !Art.F['pxp_gnd_dirt_v1.png'] || !Art.F['pxp_gnd_field_v1.png'] || !Art.F['pxp_gnd_water_v1.png']){ this.pixelLayer = null; return; }
    const F = 1, W = CONFIG.world.w, H = CONFIG.world.h;   // fix15：÷1（与 _pixelBaseCanvas 同步）
    const c = document.createElement('canvas'); c.width = base.width; c.height = base.height;
    const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
    g.drawImage(base, 0, 0);
    this._tileSoft = 0.9;   // fix14：像素层贴块羽化带收窄（接缝仍由 28+ 单位重叠盖住），构建完恢复
    g.save(); g.scale(1 / F, 1 / F);
    const full = !!Art.F['pxf_gnd_rock.png'];
    const grassSet = full ? ['pxp_gnd_grass_v1.png', 'pxf_gnd_grassb.png'] : ['pxp_gnd_grass_v1.png'];
    /* fix14：贴图尺寸统一 144＝地面帧原生边长（处理后逻辑格 72），层内采样恰为逻辑格 1:1，不再二次重采样糊化 */
    this._mosaic(g, grassSet, -40, -40, W + 80, H + 80, 144, 116, 7);
    const dirt = ['pxp_gnd_dirt_v1.png'];
    this._mosaic(g, dirt, 756, 240, 88, 920, 144, 94, 21);
    this._mosaic(g, dirt, 120, 812, 1330, 64, 144, 94, 22);
    this._mosaic(g, dirt, 410, 560, 60, 260, 144, 94, 23);
    this._mosaic(g, dirt, 756, 1064, 560, 40, 144, 94, 24);
    const f = CONFIG.farm;
    this._mosaic(g, ['pxp_gnd_field_v1.png'], f.originX - 14, f.originY - 14, f.cols * (f.plotW + f.gap) + 16, f.rows * (f.plotH + f.gap) + 16, 144, 88, 51);
    /* 水面硬裁切：_softTile 贴块带羽化、视觉外溢约半块会压到药圃西列地块下（田块如浮水面）；
       按池塘实占（碰撞西段 0..140）裁切收边，矩形范围同裁切口径（初版无裁切＋宽 232 双重溢出，fix12 田池对照实证） */
    g.save(); g.beginPath(); g.rect(-10, 492, 160, 180); g.clip();
    this._mosaic(g, ['pxp_gnd_water_v1.png'], -10, 492, 160, 180, 144, 100, 41);
    g.restore();
    const dr = (n, x, y, w, h) => { const fr = Art.F[n]; if (fr) g.drawImage(fr.img, fr.x, fr.y, fr.w, fr.h, x, y, w, h); };
    if (full){
      /* 岸线三向（矩形口径同 HD _shore：n/s 为横带、e 为竖带；S7 岸格上→下＝草/土/水，
         n 原样、s 上下翻、e 顺时针 90°，三变体已离线产出入册） */
      dr('pxf_gnd_shore.png', 6, 466, 210, 42);
      dr('pxf_gnd_shore_s.png', 6, 648, 210, 42);
      dr('pxf_gnd_shore_e.png', 202, 494, 40, 176);
      /* 矿区岩面 */
      g.save(); g.beginPath(); g.rect(1240, 40, 328, 292); g.clip();
      this._mosaic(g, ['pxf_gnd_rock.png'], 1240, 40, 328, 292, 144, 116, 61);
      g.restore();
      /* 石板前坪 ×5（裁切内马赛克）＋大殿石阶（整格拉伸） */
      const plazas = [[596, 96, 408, 252], [364, 116, 312, 240], [1052, 286, 356, 282], [984, 624, 316, 244], [528, 924, 544, 276]];
      plazas.forEach(([x, y, kw, kh], i) => {
        g.save(); g.beginPath(); g.rect(x, y, kw, kh); g.clip();
        this._mosaic(g, ['pxf_gnd_steps.png'], x, y, kw, kh, 144, 116, 71 + i);
        g.restore();
      });
      dr('pxf_gnd_steps.png', 742, 230, 116, 106);
    }
    g.restore();
    if (!full){
      const keep = [[596, 96, 408, 252], [364, 116, 312, 240], [1052, 286, 356, 282], [984, 624, 316, 244],
                    [528, 924, 544, 276], [1240, 40, 328, 292], [742, 230, 116, 106]];
      for (const [x, y, kw, kh] of keep)
        g.drawImage(base, x / F, y / F, kw / F, kh / F, x / F, y / F, kw / F, kh / F);
    }
    this._tileSoft = 0.72;   // fix14：羽化口径恢复 HD 默认
    this.pixelLayer = c;
  },
};

/* ================================================================
 * 模块：角色与动画 actor（掌门本尊；外观为像素占位精灵，接口不变）
 * ================================================================ */
const Actor = {
  player: { id: 'player', x: 800, y: 330, r: CONFIG.player.radius, facing: 1, walk: 0, moving: false,
    moveState: 'idle', animState: 'idle', appearanceId: 'zhangmen_red', actionUntil: 0,
    flyH: 0, lastMoveAt: 0, _trailAcc: 0 },
  spawnPlayer(anchorId){
    const a = Scene.getAnchor(anchorId || CONFIG.player.spawnAnchor);
    this.player.x = a.x; this.player.y = a.y + 30;
    if (S.player && S.player.x){ this.player.x = S.player.x; this.player.y = S.player.y; }
    this.player.flyH = 0; this.player.lastMoveAt = 0;
    Scene.setCameraTarget('player'); Scene.snapCamera();
  },
  setMoveIntent(vec, dt){
    const p = this.player, now0 = nowMs();
    if (now0 < p.actionUntil) vec = { x: 0, y: 0 };   // 追加批5：动作执行期间锁定——人物不位移、动作帧完整播完一轮
    const m = Math.hypot(vec.x, vec.y);
    p.moving = m > 0.12;
    if (p.moving){
      const s = CONFIG.player.speed * Math.min(1, m);
      p.x += vec.x / (m || 1) * s * dt / 1000; p.y += vec.y / (m || 1) * s * dt / 1000;
      if (Math.abs(vec.x) > 0.05) p.facing = vec.x >= 0 ? 1 : -1;
      p.walk += dt * 0.014; p.moveState = 'walk'; p.animState = 'walk';
      Scene.collide(p);
    } else { p.moveState = 'idle'; if (nowMs() > p.actionUntil) p.animState = 'idle'; }
    /* 修复批①：主角御剑——移动升空、静止落地。「飘」自此是设定：脚下飞剑见 Render._drawSword。
       升降按 riseMs 平滑趋近，落地判定用 lastMoveAt 与真实时间，不吃帧率。 */
    const now = nowMs();
    if (p.moving) p.lastMoveAt = now;
    /* fix14：田区内 flyTarget 恒 0——耕地时移动不再升空（飞入田区也按 riseMs 平滑落地衔接） */
    const flyTarget = (!this.inFarmArea(p) && now - p.lastMoveAt < CONFIG.flight.landDelayMs) ? CONFIG.flight.height : 0;
    p.flyH += (flyTarget - p.flyH) * Math.min(1, dt / (CONFIG.flight.riseMs / 3));
    if (Math.abs(flyTarget - p.flyH) < 0.1) p.flyH = flyTarget;
    if (flyTarget > 0 && p.flyH > CONFIG.flight.height * 0.6 && !p._sndAir){ p._sndAir = true; Sfx.play('sword'); }
    if (flyTarget === 0 && p.flyH < 1) p._sndAir = false;
    if (p.moving && p.flyH > 6){ // 剑光拖尾（高清真机反馈批②改程序光带：旧环件 fx2_trail 每 70ms 离散落一粒、寿命内叠成同心波纹，主人否决）
      p._trailAcc += dt;
      if (p._trailAcc >= CONFIG.flight.trailSampleMs){ p._trailAcc = 0;
        Fx.pushSwordTrail(p.x, p.y - p.flyH + 6); }
    }
    S.player.x = p.x; S.player.y = p.y; S.player.facing = p.facing;
  },
  playAction(name){ this.player.animState = 'action:' + name; this.player.actionUntil = nowMs() + 450; },   // 追加批5：450ms＝3 帧×150ms 完整一轮
  /* fix14：灵田强制地面判定——田区＝地块阵列外扩 groundMargin 的矩形（站在地块南/侧边互动的
     站位也落在区内）。区内移动不起飞（行走帧）、劳作动画不被御剑打断；离开田区恢复移动即御剑。
     用矩形而非逐地块邻近：判定 O(1)、边界稳定不抖动。弟子无 flyH 机制、不受影响。 */
  inFarmArea(p){
    const f = CONFIG.farm, m = f.groundMargin || 0;
    const w = f.cols * (f.plotW + f.gap) - f.gap, h = f.rows * (f.plotH + f.gap) - f.gap;
    return p.x > f.originX - m && p.x < f.originX + w + m && p.y > f.originY - m && p.y < f.originY + h + m;
  },
  getPlayerPos(){ return { x: this.player.x, y: this.player.y }; },
};

/* ================================================================
 * 模块：种植 farming（五状态机；时间戳结算，不靠逐帧累计）
 * 接口：getPlotAction / applyPlotAction / settlePlots / collectPlot
 * ================================================================ */
const Farming = {
  init(){
    if (S.plots && S.plots.length) return;
    const f = CONFIG.farm; S.plots = [];
    for (let r = 0; r < f.rows; r++) for (let c = 0; c < f.cols; c++)
      S.plots.push({ id: 'plot_' + (r * f.cols + c), zoneId: 'herbZone',
        x: f.originX + c * (f.plotW + f.gap), y: f.originY + r * (f.plotH + f.gap),
        cropId: null, tier: 0, state: 'empty', stageStartedAt: 0, readyAt: 0, actorId: null, reservedBy: null });
  },
  plotById(id){ return S.plots.find(p => p.id === id); },
  center(p){ return { x: p.x + CONFIG.farm.plotW / 2, y: p.y + CONFIG.farm.plotH / 2 }; },
  tierDuration(tier){ const t = CONFIG.tiers.find(t => t.tier === tier); return t ? t.durationMs : CONFIG.tiers[0].durationMs; },
  getPlotAction(plot, actor){
    const label = { empty: '锄地', tilled: '播种', seeded: '浇水', growing: '催熟中', mature: '收获' }[plot.state];
    const cost = { empty: CONFIG.stamina.costs.hoe, tilled: CONFIG.stamina.costs.seed,
      seeded: CONFIG.stamina.costs.water, growing: 0, mature: CONFIG.stamina.costs.harvest }[plot.state];
    return { action: plot.state, label, cost, enabled: plot.state !== 'growing' };
  },
  applyPlotAction(plotId, actor){ // actor: { type:'player'|'disciple', id }
    const p = this.plotById(plotId); if (!p) return false;
    const isPlayer = actor.type === 'player';
    const cost = this.getPlotAction(p, actor).cost;
    if (isPlayer && cost > 0 && !Day.spendStamina(cost, 'farm_' + p.state)){
      UI.hint('体力不够了，回屋睡觉恢复'); Sfx.play('fail'); return false; }
    const c = this.center(p);
    if (p.state === 'empty'){ p.state = 'tilled';
      if (isPlayer){ Fx.burst(c.x, c.y, { sprites: ['mote'], n: 12, speed: 1.6, life: 550 }); Sfx.play('hoe'); } }
    else if (p.state === 'tilled'){
      const cropId = isPlayer ? (S.farmMode || CONFIG.farm.defaultCrop) : CONFIG.farm.defaultCrop;
      const crop = CONFIG.crops[cropId] || CONFIG.crops[CONFIG.farm.defaultCrop];
      const inCost = crop.inputs || {};
      if (Object.keys(inCost).length){ // 高档作物播种消耗下级产物（互锁），走账本原子事务
        const neg = {}; for (const k in inCost) neg[k] = -inCost[k];
        if (!Ledger.transact({ reason: 'seed_' + cropId, items: neg })){
          if (isPlayer) Sfx.play('fail');
          if (isPlayer) UI.hint('播种' + crop.name + '需要 ' +
            Object.keys(inCost).map(k => CONFIG.items[k].name + '×' + inCost[k]).join('、')); return false; }
      }
      p.state = 'seeded'; p.cropId = cropId; p.tier = crop.tier;
      if (isPlayer) Fx.burst(c.x, c.y, { sprites: ['mote'], n: 8, speed: 1.2, life: 480 }); }
    else if (p.state === 'seeded'){ p.state = 'growing'; p.stageStartedAt = nowMs();
      p.readyAt = p.stageStartedAt + this.tierDuration(p.tier); p.actorId = actor.id;
      if (isPlayer){ Fx.burst(c.x, c.y, { sprites: ['drop'], n: 16, speed: 1.8, life: 620 }); Sfx.play('water'); } }
    else if (p.state === 'growing'){ if (isPlayer) UI.hint('还没长好，再等等'); return false; }
    else if (p.state === 'mature'){ return this.collectPlot(plotId, actor); }
    if (p.reservedBy && p.reservedBy !== actor.id){ Npc.releaseTarget(p.reservedBy); p.reservedBy = null; }
    Save.save('farm'); UI.syncHud();
    return true;
  },
  collectPlot(plotId, actor){
    const p = this.plotById(plotId); if (!p || p.state !== 'mature') return false;
    const crop = CONFIG.crops[p.cropId || CONFIG.farm.defaultCrop];
    const c = this.center(p);
    p.state = 'empty'; p.cropId = null; p.tier = 0; p.stageStartedAt = 0; p.readyAt = 0; p.reservedBy = null;
    // 隐藏精通：累计达阈值后单次产出 +1（不展示，口径见一页纸 4.1）
    const mBefore = S.mastery[crop.itemId] || 0;
    const qty = crop.yieldQty + (mBefore >= CONFIG.mastery.bonusAt ? CONFIG.mastery.bonusQty : 0);
    Ledger.addItem(crop.itemId, qty, 'harvest');
    if (actor && actor.type === 'player') Sfx.play('harvest');   // UI声音批：玩家亲手收/一键收发声，执事代收（disciple）静默
    S.mastery[crop.itemId] = mBefore + crop.yieldQty;
    Events.markRoutine('harvest');
    Fx.burst(c.x, c.y, { sprites: ['leaf', 'mote'], n: 30, speed: 2.6, life: 900 });
    const chip = $('herb').getBoundingClientRect();
    Fx.flyTo(c.x, c.y, chip.left + chip.width / 2, chip.top + chip.height / 2, { n: 5, sprite: 'leaf' });
    Fx.floatText(c.x, c.y - 16, crop.name + ' +' + qty);
    Save.save('harvest'); UI.syncHud();
    return true;
  },
  settlePlots(now){
    for (const p of S.plots) if (p.state === 'growing' && now >= p.readyAt){
      p.state = 'mature'; const c = this.center(p);
      Fx.burst(c.x, c.y, { sprites: ['mote', 'leaf'], n: 10, speed: 1.4, life: 600 }); }
  },
  growthStage(p){ // 可视阶段 ≥3 段：0 种子点 / 1 芽 / 2 苗 / 3 成株（另 mature 独立表现）
    if (p.state === 'seeded') return 0;
    if (p.state === 'growing'){ const k = clamp((nowMs() - p.stageStartedAt) / Math.max(1, p.readyAt - p.stageStartedAt), 0, 1);
      return k < 0.34 ? 1 : k < 0.7 ? 2 : 3; }
    if (p.state === 'mature') return 4;
    return -1;
  },
};

/* ================================================================
 * 模块：弟子招募与命格 disciples（M2 实装：随机三件套生成/招募/派工/22h 派遣）
 * 接口：recruit / generateDisciple / assignJob / startDispatch / claimDispatch / getDisciple
 * ================================================================ */
const Disciples = {
  JOB_LABEL: { water: '浇水', carry: '搬运', patrol: '巡场' },
  JOB_CYCLE: ['water', 'carry', 'patrol'],
  init(){
    if (S.disciples && S.disciples.length) return;
    S.disciples = [
      this._mk('d1', '陈禾', '#5b7fa6', 'water',  '山下柳溪村人，曾在药行当过学徒，手脚勤快。', { x: 330, y: 560 }),
      this._mk('d2', '陆青', '#8a6d4f', 'carry',  '力气大，话不多，搬运记账从不出错。', { x: 1120, y: 610 }),
      this._mk('d3', '沈砚', '#6a8a5f', 'water',  '爱在药圃边读书，浇水比谁都仔细。', { x: 560, y: 330 }),
    ];
    for (const d of S.disciples){ d.quality = '良好'; d.attrs = { '悟性': 55, '根骨': 52, '手艺': 58 };
      d.fates = [CONFIG.discipleGen.fates[d.id === 'd2' ? 3 : 0]]; }
  },
  _mk(id, name, robe, job, origin, pos){
    return { id, name, appearanceSeed: robe, attrs: {}, fates: [], personality: '踏实', quality: '寻常',
      originId: origin, quirk: '', rankState: '外门', assignment: job, scenePresence: 'scene',
      dispatch: null, autoDispatch: null, homePos: pos };
  },
  _pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; },
  generateDisciple(){ // A1：品质/资质/命格/性格/来历全随机（种子参数预留给月更池版本）
    const G = CONFIG.discipleGen;
    let name = this._pick(G.surnames) + this._pick(G.givenNames);
    if (S.disciples.some(d => d.name === name)) name += '·' + this._pick(['小','阿']) + name.slice(-1);
    let roll = Math.random() * G.qualities.reduce((s, q) => s + q.w, 0), quality = G.qualities[0];
    for (const q of G.qualities){ roll -= q.w; if (roll <= 0){ quality = q; break; } }
    const attrs = {};
    for (const a of G.attrNames) attrs[a] = quality.min + Math.floor(Math.random() * (quality.max - quality.min + 1));
    const fates = [this._pick(G.fates)];
    if (Math.random() < 0.3){ const f2 = this._pick(G.fates); if (f2.name !== fates[0].name) fates.push(f2); }
    // C1：来历＝出身段×桥段×结尾段模板拼接（24 段模板、数百种组合，逐条原创过词库）
    const origin = this._pick(G.originOpenings) + '，' + this._pick(G.originBridges) + '，' + this._pick(G.originEndings) + '。';
    // C2：低概率反差标签＋专属一句吐槽（只作梗，不涉敏感身份）
    let quirk = '';
    if (Math.random() < G.contrastChance)
      quirk = '别看此人' + this._pick(G.contrastBodies) + '，偏偏' + this._pick(G.contrastTraits) + '，全宗门都拿这事打趣。';
    const gate = Scene.getAnchor('gate');
    const d = this._mk('d' + nowMs().toString(36) + Math.floor(Math.random() * 999), name,
      this._pick(G.robes), 'patrol', origin,
      { x: gate.x + (Math.random() * 80 - 40), y: gate.y - 60 });
    d.quality = quality.name; d.attrs = attrs; d.fates = fates;
    d.personality = this._pick(G.personalities); d.quirk = quirk;
    return d;
  },
  recruit(){ // 山门招募：扣灵石走账本，成功即入场
    const G = CONFIG.discipleGen;
    if (S.disciples.length >= G.rosterCap){ UI.hint('名册已满（' + G.rosterCap + ' 人），先扩建弟子居舍再说'); return null; }
    if (!Ledger.transact({ reason: 'recruit', currency: { coin: -G.recruitCost } })){
      UI.hint('招募需要 ' + G.recruitCost + ' 灵石，家底还不够'); return null; }
    const d = this.generateDisciple();
    S.disciples.push(d);
    Npc.syncRoster();
    const a = Npc.agentOf(d.id);
    if (a){ const g = Scene.getAnchor('gate'); a.x = g.x; a.y = g.y - 10; }
    Fx.burst(d.homePos.x, d.homePos.y - 10, { sprites: ['mote'], n: 16, speed: 1.8, life: 700 });
    Save.save('recruit');
    return d;
  },
  assignJob(id, job){ const d = this.getDisciple(id);
    if (d && d.scenePresence === 'scene'){ d.assignment = job;
      const a = Npc.agentOf(id); if (a) Npc.releaseTarget(a);
      Save.save('assign'); } },
  cycleJob(id){ const d = this.getDisciple(id); if (!d) return;
    const i = this.JOB_CYCLE.indexOf(d.assignment);
    this.assignJob(id, this.JOB_CYCLE[(i + 1) % this.JOB_CYCLE.length]); },
  fateMul(d, kind){ // 命格效果：对应工种/移动的速度系数（NPC 行为层读取）
    let m = 1;
    for (const f of (d.fates || [])) if (f.job === kind) m = Math.max(m, f.mul || 1);
    return m;
  },
  startDispatch(id, destId, hosted){ // 22h 派遣：离场，独立节拍（档5 时长）；托管趟时长×cycleFactor
    const d = this.getDisciple(id);
    const dest = CONFIG.dispatch.dests.find(x => x.id === destId);
    if (!d || !dest || d.scenePresence !== 'scene') return false;
    if (hosted && !d.autoDispatch && this.hostedCount() >= CONFIG.dispatch.hosting.maxTeams){
      UI.hint('托管名额已满（' + CONFIG.dispatch.hosting.maxTeams + ' 队），先关掉一队再说'); return false; }
    const a = Npc.agentOf(id); if (a) Npc.releaseTarget(a);
    if (hosted) d.autoDispatch = destId;
    d.scenePresence = 'dispatched';
    const dur = Farming.tierDuration(5) * (d.autoDispatch === destId ? CONFIG.dispatch.hosting.cycleFactor : 1);
    d.dispatch = { destId, startedAt: nowMs(), endsAt: nowMs() + dur, hosted: d.autoDispatch === destId };
    Npc.syncRoster();
    Save.save('dispatch_start');
    return true;
  },
  /* ---- 历练队托管（新功能批1）：开关/名额；托管状态存弟子 autoDispatch（目的地 id 或 null） ---- */
  hostedCount(exceptId){ return S.disciples.filter(d => d.autoDispatch && d.id !== exceptId).length; },
  setHosting(id, on){ // 开：须有当前趟或待派目的地（以当前 dispatch 为准）；关：当前趟跑完落 atGate 不再续
    const d = this.getDisciple(id); if (!d) return false;
    if (!on){ if (d.autoDispatch){ d.autoDispatch = null; Save.save('hosting_off'); } return true; }
    if (d.autoDispatch) return true;
    if (!d.dispatch){ UI.hint('先派出这队历练，再开托管续派'); return false; }
    if (this.hostedCount(id) >= CONFIG.dispatch.hosting.maxTeams){
      UI.hint('托管名额已满（' + CONFIG.dispatch.hosting.maxTeams + ' 队），先关掉一队再说'); return false; }
    d.autoDispatch = d.dispatch.destId;
    Save.save('hosting_on');
    return true;
  },
  settleDispatches(now){ // 到期：托管队自动交接＋同目的地续派；普通队回山门待交接
    let changed = false;
    for (const d of S.disciples){
      if (d.scenePresence !== 'dispatched' || !d.dispatch || now < d.dispatch.endsAt) continue;
      const dest = CONFIG.dispatch.dests.find(x => x.id === d.dispatch.destId);
      if (d.autoDispatch === d.dispatch.destId && dest){ // 托管：账本交接→原地续派（弟子不回场）
        Ledger.addItem(dest.item, dest.qty, 'dispatch_claim');
        Events.markRoutine('dispatch');
        const dur = Farming.tierDuration(5) * CONFIG.dispatch.hosting.cycleFactor;
        d.dispatch = { destId: dest.id, startedAt: now, endsAt: now + dur, hosted: true };
        changed = true; continue; }
      d.scenePresence = 'atGate';
      const g = Scene.getAnchor('gate');
      d.homePos = { x: g.x + (Math.random() * 90 - 45), y: g.y - 56 };
      changed = true; }
    if (changed){ Npc.syncRoster();
      for (const d of S.disciples) if (d.scenePresence === 'atGate'){
        const a = Npc.agentOf(d.id); if (a){ a.x = d.homePos.x; a.y = d.homePos.y; } }
      Save.save('dispatch_return'); }
  },
  claimDispatch(id){ // 山门交接：产物 sellable=false 入库存（账本层红线）
    const d = this.getDisciple(id);
    if (!d || d.scenePresence !== 'atGate' || !d.dispatch) return false;
    const dest = CONFIG.dispatch.dests.find(x => x.id === d.dispatch.destId);
    if (!dest) return false;
    Ledger.addItem(dest.item, dest.qty, 'dispatch_claim');
    Fx.floatText(d.homePos.x, d.homePos.y - 40, CONFIG.items[dest.item].name + ' +' + dest.qty, '#ffcf5e');
    Events.markRoutine('dispatch');
    if (d.autoDispatch === dest.id){ // 托管兜底：旧档托管弟子落在山门时，交接后立即按托管节拍续派
      const dur = Farming.tierDuration(5) * CONFIG.dispatch.hosting.cycleFactor;
      d.scenePresence = 'dispatched';
      d.dispatch = { destId: dest.id, startedAt: nowMs(), endsAt: nowMs() + dur, hosted: true };
      Npc.syncRoster(); Save.save('dispatch_claim'); return true; }
    d.scenePresence = 'scene'; d.dispatch = null;
    const home = Scene.getAnchor('discipleHome');
    d.homePos = { x: home.x + (Math.random() * 120 - 60), y: home.y + (Math.random() * 60 - 30) };
    Npc.syncRoster();
    Save.save('dispatch_claim');
    return true;
  },
  getDisciple(id){ return S.disciples.find(d => d.id === id); },
  /* 美术批二：头像分配——按弟子 id 哈希稳定落位（偶→男池 0-2、奇→女池 3-5），
     分配序号 avatarIdx 随弟子存档持久化，存档只记序号不存图 */
  avatarOf(d){
    if (!d) return 0;
    if (typeof d.avatarIdx !== 'number'){
      let h = 0; const s = String(d.id || d.name || '');
      for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
      h = Math.abs(h); d.avatarIdx = (h % 2) * 3 + (Math.floor(h / 2) % 3);
    }
    return d.avatarIdx;
  },
  talkLines: ['掌门早，药圃我照看着呢。', '昨日那株灵芝长势很好。', '山下集市的药价又涨了些。', '活干完了，我再去巡一圈。'],
};

/* ================================================================
 * 模块：执事 steward（新功能批1：B2 一键收/代收落地）
 * 职责：执事指定（1 名、在场弟子）、代收任务源、玩家一键收。
 * 口径：代收/一键收只搬运已产出物（熟田/完工工单），逐件走 Farming/Production
 * 既有接口落账本，不创造资源、不扣玩家体力；执事跑腿复用 Npc 状态机（nextTask
 * 供 requestTask 优先取用），无代收活时回落自身派工（吞吐按 dutyFactor 打折）。
 * 接口：getSteward / setSteward / clearSteward / nextTask / collectAll
 * ================================================================ */
const Steward = {
  getSteward(){ return S.stewardId ? Disciples.getDisciple(S.stewardId) || null : null; },
  isSteward(id){ return !!id && S.stewardId === id; },
  setSteward(id){ // 指定/更换：目标须在场；旧执事先释放其预留目标，防双占
    const d = Disciples.getDisciple(id);
    if (!d || d.scenePresence !== 'scene'){ UI.hint('只能指定在山上的弟子任执事'); return false; }
    const old = this.getSteward();
    if (old && old.id !== id){ const a = Npc.agentOf(old.id); if (a) Npc.releaseTarget(a); }
    S.stewardId = id;
    Save.save('steward_set');
    return true;
  },
  clearSteward(){
    const old = this.getSteward();
    if (old){ const a = Npc.agentOf(old.id); if (a){ Npc.releaseTarget(a); a.stewardTask = false; } }
    S.stewardId = null;
    Save.save('steward_clear');
    return true;
  },
  /* 代收任务源（Npc.requestTask 执事分支调用）：熟田 > 完工工单 > 待浇地；返回 true 表示已派活 */
  nextTask(agent){
    const mp = S.plots.find(p => p.state === 'mature' && (!p.reservedBy || p.reservedBy === agent.discipleId));
    if (mp && Npc.reserveTarget(agent, mp.id)){
      const c = Farming.center(mp);
      agent.targetId = mp.id; agent.goal = { x: c.x, y: c.y + 36 };
      agent.navState = 'walkTo'; agent.stewardTask = true; return true; }
    const job = S.jobs.find(j => j.state === 'ready' && !j.claimedBy);
    if (job){ job.claimedBy = agent.discipleId; agent.jobId = job.id;
      const st = CONFIG.stations[job.stationId];
      const anch = Scene.getAnchor(st.anchor);
      agent.goal = { x: anch.x, y: anch.y + 16 };
      agent.navState = 'walkTo'; agent.stewardTask = true; return true; }
    const sp = S.plots.find(p => p.state === 'seeded' && (!p.reservedBy || p.reservedBy === agent.discipleId));
    if (sp && Npc.reserveTarget(agent, sp.id)){
      const c = Farming.center(sp);
      agent.targetId = sp.id; agent.goal = { x: c.x, y: c.y + 36 };
      agent.navState = 'walkTo'; agent.stewardTask = true; return true; }
    return false;
  },
  /* 一键收：玩家手动触发的全量收取（与代收同通道同口径，不扣体力）；返回汇总供播报 */
  collectAll(){
    const before = Ledger.snapshotBalances();
    let plots = 0, jobs = 0;
    for (const p of [...S.plots]) if (p.state === 'mature' && Farming.collectPlot(p.id, { type: 'player', id: 'player' })) plots++;
    for (const j of [...S.jobs]) if (j.state === 'ready' && Production.collectJob(j.id, { type: 'player', id: 'player' })) jobs++;
    const gained = {};
    for (const k in S.inventory){ const d = (S.inventory[k] || 0) - (before.inventory[k] || 0); if (d > 0) gained[k] = d; }
    if (plots || jobs) Save.save('collect_all');
    return { plots, jobs, gained };
  },
};

/* ================================================================
 * 模块：NPC 行为 npc（通用状态机 idle/walkTo/work/return/sleep）
 * 工种可配置（water/carry/patrol）；目标预留防抢；软避让不堵路；卡死回收。
 * 接口：tick / syncRoster / requestTask / reserveTarget / releaseTarget / forceRecover
 * ================================================================ */
const Npc = {
  agents: [],
  syncRoster(){
    const keep = {};
    for (const a of this.agents) keep[a.discipleId] = a;
    this.agents = [];
    for (const d of S.disciples){
      if (d.scenePresence !== 'scene') continue;
      const old = keep[d.id];
      this.agents.push(old || { discipleId: d.id, x: d.homePos.x, y: d.homePos.y, r: 12,
        facing: 1, walk: 0, moving: false, navState: 'idle', goal: null, targetId: null,
        reservedTargetId: null, waitUntil: 0, stuckMs: 0, lastX: d.homePos.x, lastY: d.homePos.y,
        carryLeg: 0, phase: Math.random() * 7 });
    }
  },
  agentOf(id){ return this.agents.find(a => a.discipleId === id); },
  reserveTarget(agent, plotId){
    const p = Farming.plotById(plotId);
    if (!p || (p.reservedBy && p.reservedBy !== agent.discipleId)) return false;
    p.reservedBy = agent.discipleId; agent.reservedTargetId = plotId; return true;
  },
  releaseTarget(agentOrId){
    const id = typeof agentOrId === 'string' ? agentOrId : agentOrId.discipleId;
    for (const p of S.plots) if (p.reservedBy === id) p.reservedBy = null;
    for (const j of S.jobs) if (j.claimedBy === id) j.claimedBy = null;
    const a = this.agentOf(id);
    if (a){ a.reservedTargetId = null; if (a.targetId) a.targetId = null; a.jobId = null; a.stewardTask = false;
      if (a.navState === 'walkTo' || a.navState === 'work') a.navState = 'idle'; }
  },
  forceRecover(agent){
    console.warn('[npc] forceRecover', agent.discipleId);
    this.releaseTarget(agent);
    const home = Scene.getAnchor('discipleHome');
    agent.x = home.x + (Math.random() * 60 - 30); agent.y = home.y + (Math.random() * 40 - 20);
    agent.navState = 'idle'; agent.goal = null; agent.stuckMs = 0;
  },
  onNewDay(){ for (const a of this.agents){ this.releaseTarget(a);
    const d = Disciples.getDisciple(a.discipleId);
    if (d){ a.x = d.homePos.x; a.y = d.homePos.y; } a.navState = 'idle'; a.goal = null; } },
  requestTask(agent){
    const d = Disciples.getDisciple(agent.discipleId); if (!d) return;
    // 执事优先代收（新功能批1）：有代收活先跑代收，无活回落自身派工（吞吐按 dutyFactor 打折，见 tick）
    if (Steward.isSteward(agent.discipleId) && Steward.nextTask(agent)) return;
    agent.stewardTask = false;
    const job = d.assignment;
    if (job === 'water'){
      const p = S.plots.find(p => p.state === 'seeded' && (!p.reservedBy || p.reservedBy === agent.discipleId));
      if (p && this.reserveTarget(agent, p.id)){
        const c = Farming.center(p);
        agent.targetId = p.id; agent.goal = { x: c.x, y: c.y + 36 }; agent.navState = 'walkTo'; return; }
      this._wander(agent); return;
    }
    if (job === 'carry'){ // 搬运＝收取已到期工单并入库（只搬运，不创造资源）
      const job2 = S.jobs.find(j => j.state === 'ready' && !j.claimedBy);
      if (job2){ job2.claimedBy = agent.discipleId; agent.jobId = job2.id;
        const st = CONFIG.stations[job2.stationId];
        const anch = Scene.getAnchor(st.anchor);
        agent.goal = { x: anch.x, y: anch.y + 16 }; agent.navState = 'walkTo'; return; }
      this._wander(agent); return;
    }
    this._wander(agent); // patrol 及其余工种：巡场游走
  },
  _wander(agent){
    const pts = [{ x: 300, y: 560 }, { x: 470, y: 780 }, { x: 700, y: 700 }, { x: 540, y: 420 }, { x: 900, y: 640 }, { x: 640, y: 1000 }];
    const w = pts[Math.floor(Math.random() * pts.length)];
    agent.goal = { x: w.x, y: w.y }; agent.navState = 'walkTo'; agent.idleWander = true;
  },
  _moveToward(a, dt, speed){
    const dx = a.goal.x - a.x, dy = a.goal.y - a.y, d = Math.hypot(dx, dy);
    if (d < 5) return true;
    a.x += dx / d * speed * dt / 1000; a.y += dy / d * speed * dt / 1000;
    a.facing = dx >= 0 ? 1 : -1; a.walk += dt * 0.012; a.moving = true;
    Scene.collide(a);
    return false;
  },
  tick(dt){
    const player = Actor.player;
    for (const a of this.agents){
      a.moving = false;
      const d = Disciples.getDisciple(a.discipleId); if (!d) continue;
      // 卡死检测：walkTo 期间位移过小累计，超时回收
      if (a.navState === 'walkTo'){
        if (Math.hypot(a.x - a.lastX, a.y - a.lastY) < 0.4) a.stuckMs += dt; else a.stuckMs = 0;
        if (a.stuckMs > CONFIG.npc.stuckLimitMs){ this.forceRecover(a); continue; }
      }
      a.lastX = a.x; a.lastY = a.y;
      if (a.navState === 'idle'){
        if (nowMs() >= a.waitUntil) this.requestTask(a);
      } else if (a.navState === 'walkTo' && a.goal){
        // 给玩家让路：玩家贴近时 NPC 本帧停步侧让
        const dp = dist(a, player);
        if (dp >= CONFIG.npc.avoidRadius){
          let speed = (d.assignment === 'carry' ? CONFIG.npc.carrySpeed
            : d.assignment === 'patrol' ? CONFIG.npc.patrolSpeed : CONFIG.npc.walkSpeed)
            * Disciples.fateMul(d, d.assignment) * Disciples.fateMul(d, 'move');
          // 执事回落原岗位打折（新功能批1）：执事队列任务全速，原岗位移速×dutyFactor、工时÷dutyFactor
          const dutyOff = Steward.isSteward(a.discipleId) && !a.stewardTask;
          if (dutyOff) speed *= CONFIG.steward.dutyFactor;
          if (this._moveToward(a, dt, speed)){ a.navState = 'work';
            a.waitUntil = nowMs() + CONFIG.npc.workMs / (dutyOff ? CONFIG.steward.dutyFactor : 1); }
        }
      } else if (a.navState === 'work'){
        if (nowMs() >= a.waitUntil){
          if (a.targetId){ // 地块活：浇水（seeded）/执事代收（mature→collectPlot），走 farming 模块，不扣玩家体力
            const p = Farming.plotById(a.targetId);
            if (p && (p.state === 'seeded' || p.state === 'mature'))
              Farming.applyPlotAction(p.id, { type: 'disciple', id: a.discipleId });
            if (p && p.reservedBy === a.discipleId) p.reservedBy = null;
            a.targetId = null; a.reservedTargetId = null;
          } else if (a.jobId){ // 持有工单即收取（搬运工种/执事代收共用；claimedBy 已在派活时占用）
            Production.collectJob(a.jobId, { type: 'disciple', id: a.discipleId });
            a.jobId = null;
          }
          a.stewardTask = false;
          a.idleWander = false;
          a.navState = 'idle'; a.waitUntil = nowMs() + 400 + Math.random() * 900;
        }
      } else if (a.navState === 'return' || a.navState === 'sleep'){
        const home = (Disciples.getDisciple(a.discipleId) || {}).homePos || Scene.getAnchor('discipleHome');
        a.goal = { x: home.x, y: home.y };
        if (this._moveToward(a, dt, CONFIG.npc.walkSpeed)) a.navState = 'idle';
      }
      // 软避让：与玩家/同伴保持间距（只推 NPC，不推玩家）
      for (const other of [player, ...this.agents]){
        if (other === a) continue;
        const dd = dist(a, other), min = CONFIG.npc.separationRadius;
        if (dd > 0.01 && dd < min){ a.x += (a.x - other.x) / dd * (min - dd) * 0.5;
          a.y += (a.y - other.y) / dd * (min - dd) * 0.5; Scene.collide(a); }
      }
    }
  },
};

/* ================================================================
 * 模块：图鉴 codex（最低成本版：列表打勾；转生 prestigeCount 只埋点不开放）
 * ================================================================ */
const Codex = {
  markSeen(itemId){ if (CONFIG.items[itemId] && !S.codex.seen[itemId]){ S.codex.seen[itemId] = true; } },
  init(){ for (const k in S.inventory) if ((S.inventory[k] || 0) > 0) this.markSeen(k); },
  list(){ return Object.keys(CONFIG.items).filter(id => !CONFIG.items[id].currency)
    .map(id => ({ id, name: CONFIG.items[id].name, seen: !!S.codex.seen[id], qty: S.inventory[id] || 0,
      sellable: Ledger.isSellable(id) })); },
};

/* ================================================================
 * 模块：生产链 production（M2 实装：三链配方/工单/五档周期/隐藏精通）
 * 接口：listRecipes / startJob / settleJobs / collectJob / getMastery
 * ================================================================ */
const Production = {
  init(){
    if (!S.workstations || !S.workstations.length)
      S.workstations = Object.keys(CONFIG.stations).map(id => ({ id, level: 1, queue: [], activeJobId: null }));
  },
  recipe(id){ return CONFIG.recipes.find(r => r.id === id); },
  stationUnlocked(stationId){ const st = CONFIG.stations[stationId];
    return !st.needZone || S.unlockedZones.includes(st.needZone); },
  listRecipes(workstationId){ return CONFIG.recipes.filter(r => r.station === workstationId); },
  validateChains(){ // 经济红线断言：每档产物必须是下一档输入或订单原料；派遣产物不可出售
    const inputs = new Set(), orderNeeds = new Set();
    for (const c of Object.values(CONFIG.crops)) for (const k in c.inputs) inputs.add(k);
    for (const r of CONFIG.recipes){ for (const k in r.inputs) inputs.add(k);
      for (const k in r.outputs) if (!Ledger.isSellable(k)) return 'recipe_output_unsellable:' + r.id; }
    for (const pool of Object.values(CONFIG.orders.pools)) for (const o of pool)
      for (const k in o.needs){ orderNeeds.add(k); if (!Ledger.isSellable(k)) return 'order_needs_unsellable:' + k; }
    const produced = new Set();
    for (const c of Object.values(CONFIG.crops)) produced.add(c.itemId);
    for (const r of CONFIG.recipes) for (const k in r.outputs) produced.add(k);
    for (const item of produced) if (!inputs.has(item) && !orderNeeds.has(item)) return 'isolated_output:' + item;
    for (const dest of CONFIG.dispatch.dests) if (Ledger.isSellable(dest.item)) return 'dispatch_sellable:' + dest.item;
    return null;
  },
  startJob(recipeId, actor){ // 校验工位解锁/并发上限→账本扣输入→落工单（时间戳结算）
    const r = this.recipe(recipeId); if (!r) return null;
    if (!this.stationUnlocked(r.station)){ UI.hint('工位尚未开放'); return null; }
    const running = S.jobs.filter(j => j.stationId === r.station && j.state === 'running').length;
    if (running >= CONFIG.stations[r.station].maxRunning){ UI.hint('工位忙不过来了，等一单完工'); return null; }
    const neg = {}; for (const k in r.inputs) neg[k] = -r.inputs[k];
    if (!Ledger.transact({ reason: 'job_start_' + r.id, items: neg })){
      if (actor.type === 'player') UI.hint('原料不足：' +
        Object.keys(r.inputs).map(k => CONFIG.items[k].name + '×' + r.inputs[k]).join('、'));
      return null; }
    const job = { id: 'job_' + nowMs().toString(36) + Math.floor(Math.random() * 999), recipeId: r.id,
      stationId: r.station, tier: r.tier, startedAt: nowMs(),
      readyAt: nowMs() + Farming.tierDuration(r.tier), actorType: actor.type, actorId: actor.id,
      state: 'running', claimedBy: null };
    S.jobs.push(job);
    const anch = Scene.getAnchor(CONFIG.stations[r.station].anchor);
    Fx.burst(anch.x, anch.y - 16, { sprites: ['spark'], n: 14, speed: 1.8, life: 650 });
    Save.save('job_start');
    return job;
  },
  settleJobs(now){
    for (const j of S.jobs) if (j.state === 'running' && now >= j.readyAt){
      j.state = 'ready';
      const anch = Scene.getAnchor(CONFIG.stations[j.stationId].anchor);
      Fx.burst(anch.x, anch.y - 20, { sprites: ['mote'], n: 10, speed: 1.4, life: 600 }); }
  },
  collectJob(jobId, actor){
    const j = S.jobs.find(x => x.id === jobId); if (!j || j.state !== 'ready') return false;
    const r = this.recipe(j.recipeId); if (!r) return false;
    j.state = 'done'; j.claimedBy = null;
    const outs = {};
    for (const k in r.outputs){
      const mBefore = S.mastery[k] || 0;
      outs[k] = r.outputs[k] + (mBefore >= CONFIG.mastery.bonusAt ? CONFIG.mastery.bonusQty : 0);
      S.mastery[k] = mBefore + r.outputs[k]; }
    Ledger.transact({ reason: 'job_collect_' + r.id, items: outs });
    const anch = Scene.getAnchor(CONFIG.stations[j.stationId].anchor);
    Fx.burst(anch.x, anch.y - 14, { sprites: ['leaf', 'mote'], n: 18, speed: 2, life: 750 });
    Fx.floatText(anch.x, anch.y - 40,
      Object.keys(outs).map(k => CONFIG.items[k].name + ' +' + outs[k]).join(' '));
    Save.save('job_collect');
    return true;
  },
  getMastery(itemId){ return S.mastery[itemId] || 0; },
};

/* ================================================================
 * 模块：订单 orders（M2 实装：三节奏生成/交付/刷新；交付走账本同事务）
 * 接口：listOrders / deliverOrder / refreshOrders / settleOrderTimers
 * ================================================================ */
const Orders = {
  _seq: 0,
  _gen(kind){
    const pool = CONFIG.orders.pools[kind];
    const t = pool[Math.floor(Math.random() * pool.length)];
    const now = nowMs();
    return { id: 'ord_' + now.toString(36) + (this._seq++), kind,
      needs: { ...t.needs }, reward: t.reward, createdAt: now,
      expiresAt: kind === 'rush' ? now + CONFIG.orders.rushAliveMs : 0, state: 'open' };
  },
  generateDaily(force){
    const key = Day.getDailyKey();
    if (!force && S.ordersMeta.dailyKey === key) return;
    S.orders = S.orders.filter(o => !(o.kind === 'daily' && o.state === 'open'));
    for (let i = 0; i < CONFIG.orders.dailyCount; i++) S.orders.push(this._gen('daily'));
    S.ordersMeta.dailyKey = key;
  },
  init(){ this.generateDaily(false);
    if (!S.ordersMeta.timedBatchAt) S.ordersMeta.timedBatchAt = nowMs() + CONFIG.orders.timedBatchMs;
    if (!S.ordersMeta.nextRushAt) S.ordersMeta.nextRushAt = nowMs() + 30000;
    if (!S.orders.some(o => o.kind === 'timed' && o.state === 'open'))
      for (let i = 0; i < CONFIG.orders.timedCount; i++) S.orders.push(this._gen('timed'));
  },
  listOrders(){ return S.orders.filter(o => o.state === 'open')
    .sort((a, b) => ({ rush: 0, daily: 1, timed: 2 }[a.kind] - { rush: 0, daily: 1, timed: 2 }[b.kind])); },
  canDeliver(o){ for (const k in o.needs) if ((S.inventory[k] || 0) < o.needs[k]) return false; return true; },
  deliverOrder(orderId){ // 校验库存（含 sellable 红线）→同一事务扣货发奖
    const o = S.orders.find(x => x.id === orderId);
    if (!o || o.state !== 'open') return false;
    for (const k in o.needs) if (!Ledger.isSellable(k)) return false;   // 派遣产物禁止被订单吞掉变相出售
    if (!this.canDeliver(o)){ UI.hint('库存不足，先去生产'); return false; }
    const neg = {}; for (const k in o.needs) neg[k] = -o.needs[k];
    if (!Ledger.transact({ reason: 'order_' + o.kind, items: neg, currency: { coin: o.reward } })) return false;
    o.state = 'done';
    const anch = Scene.getAnchor('orderPoint');
    const chip = $('coin').getBoundingClientRect();
    Fx.flyTo(anch.x, anch.y - 16, chip.left + chip.width / 2, chip.top + chip.height / 2,
      { n: 8, sprite: 'coin', onArrive: () => Fx.shake(0.1) });
    Fx.floatText(anch.x, anch.y - 44, '灵石 +' + o.reward, '#ffcf5e');
    Events.markRoutine('order');
    Voice.group('order');   // UI声音批：订单完成人声
    Sfx.play('success');
    Events.checkFaceEvents();
    Save.save('order_deliver');
    return true;
  },
  refreshOrders(source){ // source: 'free' 每日免费 1 次（只刷日常单）/ 'ad' 广告刷新（日常+定时）
    if (source === 'free'){
      if (S.ordersMeta.freeRefreshLeft <= 0){ UI.hint('今日免费刷新已用完'); return false; }
      S.ordersMeta.freeRefreshLeft--;
      S.orders = S.orders.filter(o => !(o.kind === 'daily' && o.state === 'open'));
      for (let i = 0; i < CONFIG.orders.dailyCount; i++) S.orders.push(this._gen('daily'));
    } else if (source === 'ad'){
      S.orders = S.orders.filter(o => !(o.state === 'open' && o.kind !== 'rush'));
      for (let i = 0; i < CONFIG.orders.dailyCount; i++) S.orders.push(this._gen('daily'));
      for (let i = 0; i < CONFIG.orders.timedCount; i++) S.orders.push(this._gen('timed'));
    } else return false;
    Save.save('order_refresh');
    return true;
  },
  settleOrderTimers(now){
    let dirty = false;
    for (const o of S.orders)
      if (o.state === 'open' && o.kind === 'rush' && o.expiresAt && now >= o.expiresAt){
        o.state = 'expired'; S.ordersMeta.nextRushAt = now + CONFIG.orders.rushRespawnMs; dirty = true; }
    if (!S.orders.some(o => o.kind === 'rush' && o.state === 'open') && now >= (S.ordersMeta.nextRushAt || 0)){
      S.orders.push(this._gen('rush')); S.ordersMeta.nextRushAt = now + CONFIG.orders.rushRespawnMs; dirty = true; }
    if (now >= (S.ordersMeta.timedBatchAt || 0)){ // 定时单整批换新（未交付的到期作废）
      for (const o of S.orders) if (o.kind === 'timed' && o.state === 'open') o.state = 'expired';
      for (let i = 0; i < CONFIG.orders.timedCount; i++) S.orders.push(this._gen('timed'));
      let next = S.ordersMeta.timedBatchAt + CONFIG.orders.timedBatchMs;
      while (next <= now) next += CONFIG.orders.timedBatchMs;
      S.ordersMeta.timedBatchAt = next; dirty = true; }
    if (dirty) Save.save('order_timers');
  },
};

/* ================================================================
 * 模块：事件与日常 events/routine（M2 实装：签到/周挑战/每日清单/打脸线/传闻）
 * 接口：getDailyChecklist / markRoutine / rollEvent / claimSignIn / getRumor
 * ================================================================ */
const Events = {
  CHECKLIST: [
    { kind: 'settle', name: '领取离线结算' }, { kind: 'dispatch', name: '完成一次派遣交接' },
    { kind: 'order', name: '交付一笔订单' }, { kind: 'signin', name: '领取今日签到' },
    { kind: 'harvest', name: '收获一次作物' },
  ],
  ensureDaily(){ const key = Day.getDailyKey();
    if (S.routine.daily.key !== key) S.routine.daily = { key, done: {} }; },
  ensureWeekly(){ const wk = Day.weekKey();
    if (S.routine.weekly.weekKey !== wk) S.routine.weekly = { weekKey: wk, progress: {}, claimed: [] }; },
  markRoutine(kind){ // 日界/周界先对齐（真实日期口径，睡觉不触发）
    this.ensureDaily(); this.ensureWeekly();
    S.routine.daily.done[kind] = true;
    if (['order', 'harvest', 'dispatch'].includes(kind))
      S.routine.weekly.progress[kind] = (S.routine.weekly.progress[kind] || 0) + 1;
  },
  getDailyChecklist(){ this.ensureDaily();
    return this.CHECKLIST.map(c => ({ ...c, done: !!S.routine.daily.done[c.kind] })); },
  claimSignIn(){ // 累计型：断签只停滞不清零；同日重复领取拒绝
    const key = Day.getDailyKey();
    if (S.routine.signIn.lastDate === key) return false;
    const y = new Date(); y.setDate(y.getDate() - 1);
    const streak = S.routine.signIn.lastDate === Day.getDailyKey(y) ? S.routine.signIn.streak + 1 : 1;
    S.routine.signIn = { streak, lastDate: key };
    const reward = CONFIG.routine.signInRewards[(streak - 1) % CONFIG.routine.signInRewards.length];
    Ledger.transact({ reason: 'signin', currency: { coin: reward } });
    this.markRoutine('signin');
    Save.save('signin');
    Sfx.play('success');
    return reward;
  },
  claimWeekly(idx){
    this.ensureWeekly();
    const c = CONFIG.routine.weeklyChallenges[idx]; if (!c) return false;
    if (S.routine.weekly.claimed.includes(idx)) return false;
    if ((S.routine.weekly.progress[c.kind] || 0) < c.need) return false;
    S.routine.weekly.claimed.push(idx);
    Ledger.transact({ reason: 'weekly_' + c.kind, currency: { coin: c.reward } });
    Save.save('weekly_claim');
    return true;
  },
  rollEvent(context){ return null; },   // 完整权重事件导演为二期（A8）；MVP 只有打脸脚本线
  checkFaceEvents(){ // C5 打脸线：按游戏日与真实累计入账触发，一日最多一次，面板由玩家点收下才发奖
    if (S.facePending) return;
    if ($('panelWrap').classList.contains('open')) return;   // 不打断玩家正在看的面板
    if (S.faceLastAt && Day.getDailyKey() === S.faceLastDay) return;
    for (const ev of CONFIG.faceEvents){
      if (S.events[ev.id]) continue;
      if (S.day.dayIndex >= ev.day && (S.stats.earnedCoin || 0) >= ev.needEarned){
        S.facePending = ev.id; Sfx.play('knock'); Voice.group('visitor'); UI.openFacePanel(ev); return; } }
  },
  claimFaceEvent(){
    const id = S.facePending; if (!id) return false;
    const ev = CONFIG.faceEvents.find(e => e.id === id); if (!ev) return false;
    S.events[id] = { state: 'done', at: nowMs() };
    S.faceLastDay = Day.getDailyKey(); S.faceLastAt = nowMs(); S.facePending = null;
    Ledger.transact({ reason: 'face_' + id, currency: { coin: ev.reward } });
    Save.save('face_event');
    return true;
  },
  getRumor(){ // C3：双弟子名＋模板拼接
    if (S.disciples.length < 2) return '';
    const a = S.disciples[Math.floor(Math.random() * S.disciples.length)];
    let b = S.disciples[Math.floor(Math.random() * S.disciples.length)];
    if (b === a) b = S.disciples[(S.disciples.indexOf(a) + 1) % S.disciples.length];
    return CONFIG.rumors[Math.floor(Math.random() * CONFIG.rumors.length)]
      .replaceAll('{a}', a.name).replaceAll('{b}', b.name);
  },
};

/* ================================================================
 * 模块：广告 ads（M2 本地模拟适配层；接口与真实 SDK 对齐，替换点已标注）
 * P0 预埋：未落定标记带时限（pendingTtlMs）与核对次数上限（maxChecks）；
 * 查询失败保留标记；落定按「预期×倍率 − 已发」差量补发；每笔 id 幂等只发一次。
 * 奖励序号按真实日期统一记账（睡觉不重置）：1–6 次满额 / 7–8 次 50% / 9 次起 0。
 * ================================================================ */
const Ads = {
  _seq: 0,
  multiplierFor(seq){ return seq <= CONFIG.ads.fullSeq ? 1 : seq <= CONFIG.ads.halfSeq ? 0.5 : 0; },
  getRewardMultiplier(){ return this.multiplierFor((S.adsDaily.rewardSeq || 0) + 1); },
  // 【替换点】真实 SDK 接入时，本函数改为拉起平台广告并监听其关闭/完成回调，签名不变
  _mockWatch(entry){
    return new Promise(resolve => setTimeout(() => {
      if (!S.pendingAdRewards.includes(entry)){ resolve({ ok: false, reason: 'gone' }); return; }
      entry.state = 'completed'; entry.completedAt = nowMs();
      Save.save('ad_completed');
      resolve({ ok: true });
    }, CONFIG.ads.mockWatchMs));
  },
  async requestReward(point, context){ // 返回 { ok, id, multiplier }；multiplier 为本笔落定倍率
    if (!CONFIG.ads.points[point]) return { ok: false, reason: 'bad_point' };
    if (S.adsDaily.date !== Day.getDailyKey()){ S.adsDaily = { date: Day.getDailyKey(), rewardSeq: 0, byPoint: {} }; }
    const entry = { id: 'ad_' + nowMs().toString(36) + (this._seq++), point,
      context: context || {}, state: 'watching', createdAt: nowMs(), checks: 0,
      granted: 0, plan: null };
    S.pendingAdRewards.push(entry);
    Save.save('ad_pending');
    const r = await this._mockWatch(entry);
    if (!r.ok) return { ok: false, reason: r.reason };
    return { ok: true, id: entry.id, multiplier: this.getRewardMultiplier() };
  },
  // 落定发放：调用方给出本笔满额预期 apply(mult) 或金额；已发部分按差量补足，幂等
  settleReward(id, fullAmount, reason){
    const entry = S.pendingAdRewards.find(e => e.id === id);
    if (!entry || entry.state !== 'completed') return 0;
    if (S.adsApplied.includes(id)){ this._drop(entry); return 0; }        // 幂等防双发
    const seq = (S.adsDaily.rewardSeq || 0) + 1;
    const mult = this.multiplierFor(seq);
    const due = Math.floor(fullAmount * mult);
    const delta = Math.max(0, due - (entry.granted || 0));               // 余额差量补发口径
    if (delta > 0) Ledger.transact({ reason: reason || ('ad_' + entry.point), currency: { coin: delta } });
    entry.granted = due;
    S.adsDaily.rewardSeq = seq;
    S.adsDaily.byPoint[entry.point] = (S.adsDaily.byPoint[entry.point] || 0) + 1;
    S.adsApplied.push(id);
    this._drop(entry);
    Save.save('ad_settled');
    return delta;
  },
  // 效果型奖励（加速/刷新/补体力）：无金额，按倍率由调用方决定效果强度，同样走序号记账与幂等
  settleEffect(id){
    const entry = S.pendingAdRewards.find(e => e.id === id);
    if (!entry || entry.state !== 'completed' || S.adsApplied.includes(id)) return null;
    const seq = (S.adsDaily.rewardSeq || 0) + 1;
    const mult = this.multiplierFor(seq);
    S.adsDaily.rewardSeq = seq;
    S.adsDaily.byPoint[entry.point] = (S.adsDaily.byPoint[entry.point] || 0) + 1;
    S.adsApplied.push(id);
    this._drop(entry);
    Save.save('ad_effect');
    return mult;
  },
  _drop(entry){ S.pendingAdRewards = S.pendingAdRewards.filter(e => e !== entry); },
  verifyPending(){ this.resumeChecks(); },
  resumeChecks(){ // 重载/回前台时核对未落定标记：完成未领→保留待落定（差量补发）；未落定先判时限、再判核对次数
    const now = nowMs(); let dirty = false;
    for (const e of [...S.pendingAdRewards]){
      if (e.state === 'watching'){
        if (now - e.createdAt > CONFIG.ads.pendingTtlMs){ this._drop(e); dirty = true; continue; }  // 超时未落定：作废
        e.checks = (e.checks || 0) + 1;
        if (e.checks > CONFIG.ads.maxChecks){ this._drop(e); dirty = true; continue; }              // 核对超限：作废
        if (now - e.createdAt >= CONFIG.ads.mockWatchMs){
          e.state = 'completed'; e.completedAt = now; dirty = true;   // 模拟查询：已看完则补记完成（查询成功）
        } // 否则保留标记，下次再核（查询失败保留口径）
      } }
    if (dirty) Save.save('ad_resume');
  },
};

/* ================================================================
 * 模块：输入与互动 input/interaction
 * 接口：getMoveVector / resolveTarget / performAction / openContextPanel
 * ================================================================ */
const Input = {
  joy: { dx: 0, dy: 0, id: null }, keys: {},
  getMoveVector(){
    let mx = this.joy.dx, my = this.joy.dy;
    if (this.keys['a'] || this.keys['arrowleft']) mx -= 1;
    if (this.keys['d'] || this.keys['arrowright']) mx += 1;
    if (this.keys['w'] || this.keys['arrowup']) my -= 1;
    if (this.keys['s'] || this.keys['arrowdown']) my += 1;
    return { x: mx, y: my };
  },
  init(){
    const joyEl = $('joy'), knob = $('knob');
    const set = (e) => { const r = joyEl.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      let dx = e.clientX - cx, dy = e.clientY - cy; const d = Math.hypot(dx, dy), max = 40;
      if (d > max){ dx *= max / d; dy *= max / d; }
      knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
      this.joy.dx = dx / max; this.joy.dy = dy / max; };
    joyEl.addEventListener('pointerdown', e => { this.joy.id = e.pointerId; joyEl.setPointerCapture(e.pointerId); set(e); });
    joyEl.addEventListener('pointermove', e => { if (e.pointerId === this.joy.id) set(e); });
    const end = (e) => { if (e.pointerId === this.joy.id){ this.joy.id = null; this.joy.dx = this.joy.dy = 0;
      knob.style.transform = 'translate(-50%,-50%)'; } };
    joyEl.addEventListener('pointerup', end); joyEl.addEventListener('pointercancel', end);
    addEventListener('keydown', e => { this.keys[e.key.toLowerCase()] = true;
      if (e.key === ' '){ e.preventDefault(); Interaction.performAction(); } });
    addEventListener('keyup', e => this.keys[e.key.toLowerCase()] = false);
    $('act').addEventListener('pointerdown', e => { e.preventDefault(); Interaction.performAction(); });
    /* 修复批②：拖动巡视——手指/鼠标在场景空白区（画布本体）拖动临时移镜，松手平滑回主角。
       摇杆/互动键/HUD 按钮均为画布之上的独立元素，指针事件不会落到画布，天然不冲突；
       面板/功能页打开时其遮罩在画布之上，同样不会误触。 */
    const cv = $('game');
    let drag = null;
    cv.addEventListener('pointerdown', e => {
      drag = { id: e.pointerId, sx: e.clientX, sy: e.clientY, lx: Scene.look.x, ly: Scene.look.y };
      Scene.dragging = true;
      try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    });
    cv.addEventListener('pointermove', e => {
      if (!drag || e.pointerId !== drag.id) return;
      const M = CONFIG.camera.lookMax;
      Scene.look.x = clamp(drag.lx + (drag.sx - e.clientX), -M, M);
      Scene.look.y = clamp(drag.ly + (drag.sy - e.clientY), -M, M);
    });
    const dend = e => { if (drag && e.pointerId === drag.id){ drag = null; Scene.dragging = false; } };
    cv.addEventListener('pointerup', dend); cv.addEventListener('pointercancel', dend);
  },
};
const Interaction = {
  target: null, _stable: null, _stableKey: null, _cand: null,
  /* 追加批5：目标判定滞回——新目标须持续胜出 150ms 才切换，根治田边按钮在
     收获/锄地/播种间高频乱跳；当前目标失效（无目标）立即清空不滞留。 */
  resolveTarget(pos){
    const raw = this._resolveRaw(pos), now = nowMs();
    const key = raw ? raw.kind + '|' + (raw.id || '') + '|' + raw.label : null;
    if (!raw){ this._stable = null; this._stableKey = null; this._cand = null; return null; }
    if (this._stableKey === key){ this._cand = null; this._stable = raw; return raw; }
    if (this._stable){
      /* 稳定目标已不在身边（走开/被移除）→ 立即让位，不等滞回（防交替候选把失效目标永久锁死在按钮上） */
      if (!this._stillValid(this._stable, pos)){ this._stable = raw; this._stableKey = key; this._cand = null; return raw; }
      if (!this._cand || this._cand.key !== key){ this._cand = { key, since: now }; return this._stable; }
      if (now - this._cand.since >= 150){ this._stable = raw; this._stableKey = key; this._cand = null; return raw; }
      return this._stable;
    }
    this._stable = raw; this._stableKey = key; return raw;
  },
  _stillValid(t, pos){
    if (!t) return false;
    if (t.kind === 'plot'){ const p = Farming.plotById(t.id);
      return !!p && dist(pos, Farming.center(p)) < CONFIG.interaction.plotRadius + 8; }
    if (t.kind === 'talk'){ const a = Npc.agentOf(t.id);
      return !!a && dist(pos, a) < CONFIG.interaction.talkRadius + 10; }
    const A = Scene.anchors, R = Math.max(CONFIG.interaction.anchorRadius + 12, 68);
    const anchorOf = { settlement: 'homeDoor', promote: 'homeDoor', enterHall: 'homeDoor', forge: 'forge',
      orders: 'orderPoint', quarters: 'discipleHome', wheel: 'wheelDoor', recruit: 'recruitPoint',
      dispatchClaim: 'gate', mine: 'mineGate' }[t.kind];
    return !!(anchorOf && A[anchorOf]) && dist(pos, A[anchorOf]) < R;
  },
  _resolveRaw(pos){
    let best = null, bd = CONFIG.interaction.plotRadius;
    for (const p of S.plots){ const d = dist(pos, Farming.center(p));
      if (d < bd){ bd = d; const a = Farming.getPlotAction(p);
        best = { kind: 'plot', id: p.id, label: a.label, enabled: a.enabled }; } }
    const A = Scene.anchors, R = CONFIG.interaction.anchorRadius;
    if (S.pendingSettlement && dist(pos, A.homeDoor) < R) best = { kind: 'settlement', label: '领结算', enabled: true };
    else if (Sect.canPromote() && dist(pos, A.homeDoor) < 56) best = { kind: 'promote', label: '晋阶', enabled: true };
    else if (dist(pos, A.homeDoor) < 56) best = { kind: 'enterHall', label: '进入·宗门大殿', enabled: true };
    else if (dist(pos, A.forge) < R) best = { kind: 'forge', label: '进入·淬炼坊', enabled: true };
    else if (dist(pos, A.orderPoint) < 56) best = { kind: 'orders', label: '进入·出货台', enabled: true };
    else if (dist(pos, A.discipleHome) < 56 && (S.buildings.find(b => b.id === 'quarters') || {}).level >= 1)
      best = { kind: 'quarters', label: '进入·弟子居舍', enabled: true };
    else if (dist(pos, A.wheelDoor) < R) best = { kind: 'wheel', label: '进入·水车', enabled: true };
    else if (dist(pos, A.recruitPoint) < 56) best = { kind: 'recruit', label: '招募', enabled: true };
    else if (S.disciples.some(d => d.scenePresence === 'atGate') && dist(pos, A.gate) < R)
      best = { kind: 'dispatchClaim', label: '领派遣', enabled: true };
    else if (dist(pos, A.mineGate) < R) best = Scene.isLocked('mineZone')
      ? { kind: 'mine', label: '扩建', enabled: true } : { kind: 'mine', label: '进入·后山矿口', enabled: true };
    if (best) return best;
    for (const a of Npc.agents) if (dist(pos, a) < CONFIG.interaction.talkRadius)
      return { kind: 'talk', id: a.discipleId, label: '聊聊', enabled: true };
    return null;
  },
  performAction(){
    if (nowMs() < Actor.player.actionUntil) return;   // 追加批5：动作锁定期间不接受新动作（目标与按钮一并锁定）
    UI.armClickGuard();   // 急修：本次点按若打开页/面，护盾吞掉同一手势穿透进新页的 click（见 UI.armClickGuard）
    const t = this._resolveRaw(Actor.getPlayerPos()); if (!t) return;   // 执行走即时解析：滞回只管按钮显示，误触旧目标比按钮慢 150ms 更糟
    this.target = t;
    if (t.kind === 'plot'){ const p = Farming.plotById(t.id);
      Actor.playAction(!p ? 'hoe' : p.state === 'empty' ? 'hoe' : p.state === 'tilled' ? 'seed'
        : p.state === 'seeded' ? 'water' : p.state === 'mature' ? 'harvest' : 'hoe');
      Farming.applyPlotAction(t.id, { type: 'player', id: 'player' }); }
    else if (t.kind === 'settlement') UI.openSettlementPanel();
    else if (t.kind === 'promote') UI.openPromotePanel();
    /* 急修：删除原 `t.kind === 'sleep'` 直达 Day.sleep 的死分支——_resolveRaw 从不产出 sleep 目标，
       留着它等于在「进入」分发链里埋了一条一点即睡的雷；睡觉只许从大殿页内按钮两段确认触发。 */
    else if (t.kind === 'enterHall') UI.openBuildingPage('hall');
    else if (t.kind === 'forge') UI.openBuildingPage('forge');
    else if (t.kind === 'orders') UI.openBuildingPage('stall');
    else if (t.kind === 'quarters') UI.openBuildingPage('quarters');
    else if (t.kind === 'wheel') UI.openBuildingPage('wheel');
    else if (t.kind === 'recruit') UI.openRecruitPanel();
    else if (t.kind === 'dispatchClaim'){ let n = 0;
      for (const d of [...S.disciples]) if (Disciples.claimDispatch(d.id)) n++;
      UI.hint(n ? '派遣交接完成，产物已入库（不可出售，只作生产原料）' : '暂无待交接的派遣'); }
    else if (t.kind === 'mine') UI.openBuildingPage('mine');
    else if (t.kind === 'talk'){ const a = Npc.agentOf(t.id);
      if (a){ Fx.floatText(a.x, a.y - 46, Disciples.talkLines[Math.floor(Math.random() * Disciples.talkLines.length)], '#ffffff');
        Voice.group('greet', t.id); } }
  },
  openContextPanel(target){ this.performAction(); },
  refreshButton(){
    const pos = Actor.getPlayerPos();
    const t = this.resolveTarget(pos), el = $('act');
    const ICN = { sleep: 'sleep', settlement: 'coin', promote: 'promote', orders: 'order', recruit: 'recruit', dispatchClaim: 'dispatch',
      enterHall: 'promote', forge: 'build', quarters: 'disciple', wheel: 'stamina', mine: 'dispatch' };
    if (!t){ el.textContent = '…'; el.classList.add('off'); }
    else { el.innerHTML = (ICN[t.kind] ? '<span class="icn icn-' + ICN[t.kind] + '"></span>' : '') + t.label;
      el.classList.toggle('off', !t.enabled); }
    this.target = t;
    // 种子切换键：只在药圃附近出现（种高档作物需消耗下级产物，见 crops.inputs）
    const sb = $('seedBtn');
    const nearPlot = S.plots.some(p => dist(pos, Farming.center(p)) < 118);
    sb.style.display = nearPlot ? '' : 'none';
    if (nearPlot) sb.textContent = '种：' + (CONFIG.crops[S.farmMode] || CONFIG.crops.lingzhi).name;
  },
};

  /* M3.5：图集图标（atlas_ground 精灵，CSS .icn 16px / .icnL 24px 两档尺寸） */
  _icnMap: { coin: 'coin', lingzhi: 'lingzhi', ninglu: 'ninglu', xuanyu: 'xuanyu' },

  /* 美术批二：弟子头像（atlas_art2 精灵）；图未就绪时返回空串、回退纯文字行 */
  avatarHtml(d){
    if (typeof Art === 'undefined' || !Art.ready2 || typeof Disciples === 'undefined') return '';
    const st = Art.avaStyle(Disciples.avatarOf(d)); if (!st) return '';
    return '<span class="ava" style="' + st + '"></span>';
  },
  itemIcn(itemId){ const n = this._icnMap[itemId]; return n ? this.icn(n) : ''; },
  costText(cost, withIcn){ const parts = [];
    if (cost.coin) parts.push((withIcn ? this.icn('coin') : '') + '灵石×' + cost.coin);
    for (const k in (cost.items || {})) parts.push((withIcn ? this.itemIcn(k) : '') + CONFIG.items[k].name + '×' + cost.items[k]);
    return parts.join('、') || '免费'; },
  fmtDur(ms){ if (ms <= 0) return '已到期';
    const s = Math.ceil(ms / 1000);
    if (s < 60) return s + ' 秒';
    if (s < 3600) return Math.ceil(s / 60) + ' 分钟';

  needsText(needs, withIcn){ return Object.keys(needs).map(k =>

  /* ---- 回归结算（E1 逐项播报＋B1 一键领取＋双倍广告同屏可选） ---- */

      if (Offline.claimSettlement(s.id)){
        const bonus = Ads.settleReward(r.id, s.track1.amount, 'ad_offline_double');

  /* ---- 工位面板（淬炼坊/矿脉共用）：配方开工＋工单收取＋广告加速 ---- */
  openStationPanel(stationId){
    const st = CONFIG.stations[stationId];
    const jobs = S.jobs.filter(j => j.stationId === stationId && j.state !== 'done');
    let rows = Production.listRecipes(stationId).map(r =>
      '<div class="row"><span>' + r.name + '（档' + r.tier + ' · ' + this.fmtDur(Farming.tierDuration(r.tier)) + '）<br>' +
      '<span class="mini">入：' + this.needsText(r.inputs, true) + ' → 出：' +
      Object.keys(r.outputs).map(k => this.itemIcn(k) + CONFIG.items[k].name + '×' + r.outputs[k]).join('、') + '</span></span>' +
      '<button class="act2" data-recipe="' + r.id + '">开工</button></div>').join('');
    rows += jobs.map(j => { const r = Production.recipe(j.recipeId);
      const left = j.readyAt - nowMs();

          : '<button class="act2 ghost2" data-speed="' + j.id + '">广告加速</button>') + '</div>'; }).join('');
    if (!jobs.length && !rows) rows = '<div class="row"><span>暂无配方</span></div>';

      if ($('panelWrap').classList.contains('open') && $('lbList')) this._renderBoard(this._lbKind, !!(res && res.ok));

  async _renderBoard(kind, fresh){
    const listEl = $('lbList'), st = $('lbStatus'), mineEl = $('lbMine');
    if (!listEl) return;
    const entries = Leaderboard.getBoard(kind);
    const unit = kind === 'scale' ? '建设度 ' : '日均入账 ';
    const medal = r => r === 1 ? '🥇' : r === 2 ? '🥈' : r === 3 ? '🥉' : r;
    const rowHTML = r =>
      '<div class="lb-row' + (r.isCurrent ? ' me' : '') + (r.rank <= 3 ? ' top' + r.rank : '') + '">' +
      '<span class="lb-rank">' + medal(r.rank) + '</span>' +
      (r.avatar ? '<img class="lb-ava" src="' + this.lbEsc(r.avatar) + '" alt="" loading="lazy">'
        : '<span class="lb-ava ph">' + this.lbEsc(String(r.displayName || '客').slice(0, 1)) + '</span>') +
      '<span class="lb-name">' + this.lbEsc(r.displayName || '虎扑用户') + (r.isCurrent ? '（我）' : '') + '</span>' +
      '<span class="lb-val">' + unit + (r.score || 0) + '</span></div>';
    listEl.innerHTML = entries.length ? entries.map(rowHTML).join('')
      : '<div class="row"><span>暂无数据，先把宗门经营起来再开榜。</span></div>';
    if (st) st.textContent = CONFIG.leaderboard.apiBase
      ? (fresh ? '全服数据已更新。' : '先看上次同步的数据，正在刷新…')
      : '当前为本地榜单（与同道种子数据同榜）；平台榜单接入后自动切换全服数据。';
    const me = await Leaderboard.myRank(kind);
    if (!mineEl || !$('panelWrap').classList.contains('open')) return;
    const cur = Leaderboard.metrics()[kind];
    if (me && me.rank) mineEl.textContent = '我的名次：第 ' + me.rank + ' 名 · 当前' + unit + cur +
      (me.rank === 1 ? ' · 暂居榜首' : '');
    else mineEl.textContent = '我还没上榜——' + (kind === 'scale' ? '扩建建筑涨建设度即可上榜。' : '交付订单积累经营入账即可上榜。');
    this._placeDeco();   // 真机三问题批①：填行后 sheet 长高，描框立即重贴（ResizeObserver 兜底异步布局）
  },
  /* 两段确认：首击变「确认？」，限时内再击才执行（保存覆盖/读取/删除共用） */
  _armConfirm(btn, fn){
    btn.onclick = () => {
      if (btn.dataset.armed){ delete btn.dataset.armed; fn(); return; }
      btn.dataset.armed = '1'; const old = btn.textContent; btn.textContent = '确认？';
      this._skinBtn(btn);   // UI声音批：待确认态换金边确认钮素材
      setTimeout(() => { if (btn.isConnected && btn.dataset.armed){ delete btn.dataset.armed; btn.textContent = old; this._skinBtn(btn); } }, 2600);
    };
  },

    rows += '<div class="row"><span>' + this.icn('stamina') + '体力 ' + Math.floor(S.day.stamina) + ' / ' + CONFIG.stamina.max + '（' + this.icn('sleep') + '睡觉/离线可恢复）</span>' +
      '<button class="act2 ghost2" id="btnStamAd">广告补体力</button></div>';
    const canSign = S.routine.signIn.lastDate !== Day.getDailyKey();
    rows += '<div class="row"><span>' + this.icn('signin') + '每日签到（连签 ' + S.routine.signIn.streak + ' 天，断签不清零）</span>' +
      (canSign ? '<button class="act2" id="btnSign">签到</button>' : '<span class="tag">今日已签</span>') + '</div>';
    Events.ensureWeekly();
    rows += CONFIG.routine.weeklyChallenges.map((c, i) => {
      const p = S.routine.weekly.progress[c.kind] || 0, claimed = S.routine.weekly.claimed.includes(i);
      return '<div class="row"><span>周挑战：' + c.name + ' ' + Math.min(p, c.need) + '/' + c.need + '</span>' +
        (claimed ? '<span class="tag">已领奖</span>'
          : p >= c.need ? '<button class="act2" data-week="' + i + '">领 ' + this.icn('coin') + '灵石+' + c.reward + '</button>'
          : '<span class="tag grey">进行中</span>') + '</div>'; }).join('');
    this.openPanel(this.icn('signin', true) + '日常', '每日短清单 5 项、十分钟毕业；签到与周挑战都是填充，不逼肝', rows, '');
    const bs = $('btnSign');
    if (bs) bs.onclick = () => { const rw = Events.claimSignIn();
      if (rw){ this.hint('签到到账：灵石 +' + rw); this.openRoutinePanel(); } };
    $('btnStamAd').onclick = async (ev) => {
      ev.target.disabled = true;
      const r = await Ads.requestReward('stamina_refill', {});
      if (!r.ok){ this.hint('广告未完成'); this.openRoutinePanel(); return; }
      const mult = Ads.settleEffect(r.id);
      if (mult === null || mult === 0){ this.hint('今日广告收益已达上限，体力未补充'); }
      else { Day.restoreStamina(Math.floor(CONFIG.ads.staminaRefill * mult), 'ad');
        this.hint('体力 +' + Math.floor(CONFIG.ads.staminaRefill * mult)); }
      this.openRoutinePanel(); };
    document.querySelectorAll('[data-week]').forEach(b => b.onclick = () => {
      if (Events.claimWeekly(+b.dataset.week)) this.openRoutinePanel(); });
  },
  /* ---- 图鉴（最低成本版） ---- */
  openCodexPanel(){
    const list = Codex.list();
    const rows = list.map(it => '<div class="row"><span>' + (it.seen ? this.itemIcn(it.id) + it.name : '？？？') +
      (it.seen && !it.sellable ? ' <span class="tag grey">不可出售</span>' : '') + '</span>' +
      '<b>' + (it.seen ? '库存 ' + it.qty : '未获得') + '</b></div>').join('');
    this.openPanel(this.icn('bag', true) + '图鉴', '收集进度 ' + list.filter(i => i.seen).length + ' / ' + list.length + '（不可出售的为派遣带回的启动材料）', rows, '');
  },
  /* ---- 打脸事件面板（C5：数字读账本，点收下才发奖） ---- */
  openFacePanel(ev){
    const text = ev.text.replace('{earned}', String(S.stats.earnedCoin || 0));
    this.openPanel('山门来客', '宗门声名在外，来客带着贺礼', 
      '<div class="row"><span style="line-height:1.7">' + text + '</span></div>' +
      '<div class="row"><span>贺礼</span><b>' + this.icn('coin') + '灵石 +' + ev.reward + '</b></div>',
      '<button class="pbtn" id="btnFace">收下贺礼</button>');
    $('btnFace').onclick = () => { if (Events.claimFaceEvent()){ this.closePanel(); this.hint('贺礼已入库'); } };
  },
};

      } else if (e.moving){
        if (isPlayer){
          if (st.dir === 'front') pn = cycP(['pxp_master_walk_f1_v1.png', 'pxp_master_walk_f2_v1.png', 'pxp_master_walk_f3_v1.png']);
          else if (st.dir === 'back') pn = cycP(['pxp_master_walk_b1_v1.png', 'pxp_master_walk_b2_v1.png', 'pxp_master_walk_b3_v1.png']);
          else if (st.face > 0) pn = cycP(['pxp_master_walk_sr1_v1.png', 'pxp_master_walk_sr2_v1.png', 'pxp_master_walk_sr3_v1.png']);
          else pn = cycP(['pxp_master_walk_sl1_v1.png', 'pxp_master_walk_sl2_v1.png', 'pxp_master_walk_sl3_v1.png']);
        } else if (st.dir === 'front') pn = cycP(['pxf_' + set + '_stand_f.png', 'pxf_' + set + '_walk_f1.png', 'pxf_' + set + '_walk_f2.png', 'pxf_' + set + '_walk_f3.png']);
        else if (st.dir === 'back') pn = set === 'female'
          ? cycP(['pxf_female_stand_b.png', 'pxf_female_walk_b1.png', 'pxf_female_walk_b2.png', 'pxf_female_walk_b1.png'])
          : cycP(['pxf_male_stand_b.png', 'pxf_male_walk_b1.png', 'pxf_male_walk_b2.png', 'pxf_male_walk_b3.png']);
        else if (st.face > 0) pn = cycP(['pxf_' + set + '_stand_sr.png', 'pxf_' + set + '_walk_sr1.png', 'pxf_' + set + '_walk_sr2.png', 'pxf_' + set + '_walk_sr3.png']);
        else pn = cycP(['pxf_' + set + '_stand_sl.png', 'pxf_' + set + '_walk_sl1.png', 'pxf_' + set + '_walk_sl2.png', 'pxf_' + set + '_walk_sl3.png']);
      } else pn = isPlayer ? 'pxp_master_stand_' + dk + '_v1.png' : 'pxf_' + set + '_stand_' + dk + '.png';
      if (pn && Art.F[pn]){ name = pn; flip = pflip; tint = null; pxSample = true; pxNative = true; }
      else if (Art.readyPxb && !act && !flying){ /* 像素全量·程二：主帧缺失时的三视回退（S3，防御层，正常路径不触发） */
        const tn = 'pxf_tri_' + (isPlayer ? 'master' : set) + '_' + (dk === 'f' ? 'front' : dk === 'b' ? 'back' : 'side') + '.png';
        if (Art.F[tn]){ name = tn; flip = (dk === 'sl'); tint = null; pxSample = true; pxNative = true; }
      }
    }
    if (!pxNative && CONFIG.art.pixelSample && Art.readyPx && !act && !e.moving && !flying && name){
      if (isPlayer && st.dir === 'back' && Art.F['px_master_back_v1.png']){ name = 'px_master_back_v1.png'; pxSample = true; }
      else if (isPlayer && st.dir === 'side' && Art.F['px_master_side_v1.png']){ name = 'px_master_side_v1.png'; pxSample = true; }
      else if (isPlayer && Art.F['px_master_front_v1.png']){ name = 'px_master_front_v1.png'; pxSample = true; }
      else if (!isPlayer && disciple && st.dir === 'front' && Art.F['px_disciple_front_v1.png']){ name = 'px_disciple_front_v1.png'; pxSample = true; }
    }
    /* 修复三批④：劳作帧优先用调色版 frm3（袍色已离线映射回 frm2 色系，运行时同种子色染色结果与待机帧一致）；
       fix3 图集未就绪时自动回退原帧。覆盖弟子 water/carry/harvest（主角自高清真机反馈批①起 harvest 走本尊帧、不再经此覆盖）。 */
    if (name && Art.ready3 && Art.F['frm3_' + name] && /^frm_male_(water|carry|harvest)_/.test(name)) name = 'frm3_' + name;
    /* 高清真机反馈批③＋主人 13:00 追加令：全向御剑改「去剑身体层＋单体飞剑」。
       烘焙剑与行进方向的关系逐向像素实测全错：正/背姿是横剑（上下飞剑不跟向）；侧姿柄在行进侧、剑尖背向行进方向。
       故剑身统一由单体件 frm2_sword（尖端朝 +x）按行进方向角绘制：右 0／下 +90°／左 180°／上 −90°，剑尖恒随向；
       st.swordAng 以 90°/swordSqMs 走最短弧转向（转向/起落过渡无跳变）；竖向长度与锚定见 _drawFlySword（沉淀打磨批①透视缩短口径）。
       分层/单体件缺失自动回退整幅烘焙姿。 */
    let flyBody = null;
    if (isPlayer && usedFlyPose){
      if (st.dir === 'front' || st.dir === 'back'){
        const base = name.slice(0, -7);
        if (Art.F[base + '_bd_v1.png'] && Art.F['frm2_sword_v1.png']) flyBody = base + '_bd_v1.png';
      } else if (/_bd_v1\.png$/.test(name) && Art.F['frm2_sword_v1.png']) flyBody = name;
    }
    const aDt = Math.max(0, Math.min(64, now - (st.aAt || now))); st.aAt = now;
    let swordAng = null;
    if (flyBody){
      const tgt = st.dir === 'front' ? Math.PI / 2 : st.dir === 'back' ? -Math.PI / 2 : (st.face > 0 ? 0 : Math.PI);
      if (st.swordAng === undefined) st.swordAng = tgt;
      let dA = tgt - st.swordAng;
      while (dA > Math.PI) dA -= Math.PI * 2;
      while (dA < -Math.PI) dA += Math.PI * 2;
      const stepA = (Math.PI / 2) / CONFIG.flight.swordSqMs * aDt;
      st.swordAng += Math.abs(dA) <= stepA ? dA : Math.sign(dA) * stepA;
      swordAng = st.swordAng;
    }
    /* bob 锁步帧相位：起伏峰值与落脚同相，不再各走各的墙钟；御剑时为悬停微浮。 */
    const bob = flying ? Math.sin(now / 520) * 1.3
      : e.moving ? Math.abs(Math.sin(st.phase)) * 2.1
      : (CONFIG.idle.bobEnabled ? Math.sin(now / CONFIG.idle.bobPeriodMs + (e.phase || 0)) * CONFIG.idle.bobAmpPx : 0); // 真机三问题批②：待机呼吸默认关（CONFIG.idle）——旧版恒开经取整成 ±1px 阶梯跳变＝抽搐共犯
    const lift = isPlayer ? (e.flyH || 0) : 0;
    /* 落脚微尘：相位每过一个步点（π）触发一粒，只在贴地行走时 */
    if (e.moving && !flying){
      const stepIdx = Math.floor(st.phase / Math.PI);
      if (stepIdx !== st.lastStep){ st.lastStep = stepIdx;
        const sx = e.x - cam.x, sy = e.y - cam.y;
        if (sx > -30 && sx < innerWidth + 30 && sy > -30 && sy < innerHeight + 30)
          Fx.burst(e.x, e.y + 2, { sprites: ['mote'], n: 1, speed: 0.5, life: 360 }); }
    }
    /* 正/背面行走的横向摆幅（补无行走帧朝向的步点感），同样锁相位 */
    const sway = (e.moving && !flying && st.dir !== 'side') ? Math.sin(st.phase) * 1.4 : 0;
    /* 修复四批①：固定倍率制（废止三批③逐帧身体高归一——弯腰/盘坐帧身体高天然更小，逐帧归一等于逐帧换倍率：
       锄地/搬运 ×1.06、御剑正/侧 ×1.1667 而背向 ×1.0，姿态一切换尺寸就跳，主人 2026-11-07 10:53 录屏实证）。
       现行：倍率只由角色决定（SCALE4，站立帧一次性标定），御剑族乘一次性标定常量 flyK；
       锚点仍按帧取 BODY3 的脚底行/中心列（那是位置对齐、不是缩放）。无表项帧回退同倍率口径。 */
    const K4 = (isPlayer ? SCALE4.master : SCALE4.disciple) * (usedFlyPose ? SCALE4.flyK : 1);
    const B3 = (typeof BODY3 !== 'undefined' && name) ? BODY3[name] : null;
    let fW = Art.F[name] ? Art.F[name].w : 96, fH = Art.F[name] ? Art.F[name].h : 144;
    if (pxSample && !pxNative){ fW = 96; fH = 144; }   // 样板帧几何冒充：锚点/倍率按母版口径，源图 32×48 最近邻放大出颗粒
    let dwP, dhP, dx, dy;
    if (pxNative && B3){
      /* 像素试点几何：不用 HD 的 (fW/96) 宽度口径（那是为 96×144 母版标定的），按帧原生宽高比出图——
         高度与 HD 同为 DH（内容高占比同归一），宽度随帧宽高比，锚点按 BODY3 帧内实测行列对位。
         fix14：整数倍率绘制——倍率按目标高取整（64px 帧→×2、dhP=128），dw/dh 恒为源帧整数倍；
         旧口径 dhP=125 对 64px 帧＝1.953 分数倍率，逐 texel 采样宽窄不均＝真机发糊主因之一，现废止。 */
      const kPx = Math.max(1, Math.round(DH * K4 / fH));
      dhP = fH * kPx; dwP = fW * kPx;
      dx = e.x - cam.x - (B3[2] / fW) * dwP + sway;
      dy = e.y - cam.y - (B3[1] / fH) * dhP - bob - lift;
    } else if (B3){
      dhP = DH * K4; dwP = DW * (fW / 96) * K4;
      dx = e.x - cam.x - (B3[2] / fW) * dwP + sway;
      dy = e.y - cam.y - (B3[1] / fH) * dhP - bob - lift;
    } else {
      dwP = (usedFlyPose ? Math.round(DW * fW / 96) : DW) * K4; dhP = DH * K4;
      dx = e.x - cam.x - dwP / 2 + sway; dy = e.y - cam.y - FEET - bob - lift;
    }
    /* 修复三批④：帧族切换 120ms 下沉回弹过渡（切换后先下沉 2px 再回弹，压平硬切感；同族换帧不触发） */
    const famK = name ? name.replace(/_\d\d_v1\.png$/, '') : '';
    if (st.famK !== undefined && st.famK !== famK) st.famAt = now;
    st.famK = famK;
    const dipT = st.famAt ? (now - st.famAt) / 120 : 1;
    const dip = dipT < 1 ? Math.sin(Math.PI * Math.max(0, dipT)) * 2 : 0;
    st._dipY = dip; dy += dip;
    /* 影子恒在地面：升空后影子变小变淡，人与影的间距即高度感 */
    const shW = flying ? 26 : 36, shA = flying ? 0.10 : 0.18;
    g.fillStyle = 'rgba(0,0,0,' + shA + ')';
    g.fillRect(Math.round(e.x - cam.x - shW / 2), Math.round(e.y - cam.y + 1), shW, 6);
    if (isPlayer && lift > 0.5 && !usedFlyPose) this._drawSword(e, st, cam, lift);   // 程序飞剑降为 art2 未就绪兜底（SWORD-ART-TODO 已由姿态整图销账）
    /* 高清真机反馈批③：分层路径先画单体飞剑（按行进角旋转、尖端随向）、再画去剑身体层盖住剑身中段
       （绘制顺序兼顾 fix5 选帧钩子取末帧＝身体层的契约） */
    const drawMain = () => {
      if (flyBody){
        this._drawFlySword(g, swordAng, dx + (B3 ? B3[2] / fW : 0.5) * dwP, dy + 134 / 144 * dhP, dwP, dhP);
        Art.draw(g, flyBody, dx, dy, dwP, dhP, flip);
      }
      else if (tint) Art.drawTinted(g, name, tint, dx, dy, dwP, dhP, flip);
      else Art.draw(g, name, dx, dy, dwP, dhP, flip);
    };
    if (isPlayer && flying){ // 御剑身体微倾：绕脚底基点按横向速度倾斜
      st.tilt += (clamp(st.vx * 0.05, -0.15, 0.15) - st.tilt) * 0.25;
      g.save();
      g.translate(e.x - cam.x + sway, e.y - cam.y - lift);
      g.rotate(st.tilt);
