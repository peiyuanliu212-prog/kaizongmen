          g.strokeStyle = p.reservedBy ? 'rgba(255,207,94,.9)'
            : 'rgba(255,233,168,' + (0.55 + 0.35 * Math.sin(performance.now() / 300 + p.x)).toFixed(2) + ')';
          g.lineWidth = 2; g.beginPath();
          g.moveTo(c.x, c.y - 22); g.lineTo(c.x + 46, c.y + 2); g.lineTo(c.x, c.y + 26); g.lineTo(c.x - 46, c.y + 2);
          g.closePath(); g.stroke(); g.lineWidth = 1; }
        continue;
      }

      g.fillStyle = p.state === 'empty' ? '#8a6a3e' : '#6e5327'; g.fillRect(p.x, p.y, CONFIG.farm.plotW, CONFIG.farm.plotH);
      g.strokeStyle = p.reservedBy ? 'rgba(255,207,94,.85)' : 'rgba(0,0,0,.18)';
      g.strokeRect(p.x + .5, p.y + .5, CONFIG.farm.plotW - 1, CONFIG.farm.plotH - 1);
      if (p.state === 'tilled'){ g.strokeStyle = 'rgba(0,0,0,.25)';
        for (let i = 1; i < 4; i++){ g.beginPath(); g.moveTo(p.x + 4, p.y + i * 10); g.lineTo(p.x + CONFIG.farm.plotW - 4, p.y + i * 10); g.stroke(); } }
      const st = Farming.growthStage(p);
      if (st >= 0){
        const hgt = [4, 7, 12, 17, 17][st];
        g.fillStyle = st === 4 ? '#7fae5c' : '#5c8a46';
        for (let i = 0; i < 6; i++){ const px = p.x + 9 + (i % 3) * 17, py = p.y + 12 + Math.floor(i / 3) * 17;
          g.fillRect(px - 3, py - hgt, 6, hgt); g.fillRect(px - 5, py - hgt, 10, 3); }
        if (st === 4){ g.fillStyle = '#ffe9a8';
          for (let i = 0; i < 6; i++){ const px = p.x + 9 + (i % 3) * 17, py = p.y + 8 + Math.floor(i / 3) * 17;
            g.fillRect(px - 2, py - 2, 4, 4); }
          if (Math.sin(performance.now() / 300 + p.x) > 0.55){ g.strokeStyle = 'rgba(255,233,168,.9)'; g.lineWidth = 2;
            g.strokeRect(p.x - 2, p.y - 2, CONFIG.farm.plotW + 4, CONFIG.farm.plotH + 4); g.lineWidth = 1; } }
      }
    }
    g.restore();
    // Y 排序实体
    const ents = [];
    if (Art.ready){ // M3：建筑单体图（位置对位现有 solids/anchors，碰撞盒不随图变）
      /* 追加批3：Y 排序键逐栋复核＝建筑接地线（solid 底边），旧键最大偏 16px（居舍 330 vs 接地 314）致人物在屋前被屋身盖住 */
      ents.push({ y: 246, f: () => Art.draw(g, 'bld_hall_v1.png', 640 - cam.x, 17 - cam.y, 320, 235) });
      ents.push({ y: 528, f: () => Art.draw(g, 'bld_forge_v1.png', 1109 - cam.x, 303 - cam.y, 250, 231) });
      ents.push({ y: 816, f: () => Art.draw(g, 'bld_stall_v1.png', 1020 - cam.x, 667 - cam.y, 210, 155) });
      ents.push({ y: 820, f: () => Art.draw(g, 'prop_scale_v1.png', 1150 - cam.x, 726 - cam.y, 58, 67) }); // M3.5：出货台吊秤识别件
      ents.push({ y: 1142, f: () => Art.draw(g, 'bld_gate_v1.png', 650 - cam.x, 954 - cam.y, 300, 202) });
      ents.push({ y: 594, f: () => { Art.draw(g, 'bld_waterwheel_v1.png', 16 - cam.x, 430 - cam.y, 180, 170);
        this._drawWheelOverlay(g, cam); } });
      const qb = (S.buildings || []).find(b => b.id === 'quarters');
      if (qb && qb.level >= 1)
        ents.push({ y: 314, f: () => Art.draw(g, 'bld_quarters_v1.png', 400 - cam.x, 137 - cam.y, 240, 193) });
      if (Art.ready2){ // 美术批二：矿洞口＋场景装饰（纯装饰、不进碰撞盒，y-sort＝底边；布点见集成报告）
        ents.push({ y: 200, f: () => Art.draw(g, 'prop_minegate_v1.png', 1295 - cam.x, 51 - cam.y, 210, 149) });
        ents.push({ y: 296, f: () => Art.draw(g, 'prop_crystal_v1.png', 1258 - cam.x, 230 - cam.y, 84, 66) });
        ents.push({ y: 296, f: () => Art.draw(g, 'prop_cart_v1.png', 1466 - cam.x, 222 - cam.y, 104, 74) });
        ents.push({ y: 326, f: () => Art.draw(g, 'prop_bush_v1.png', 652 - cam.x, 268 - cam.y, 76, 58) });
        ents.push({ y: 648, f: () => Art.draw(g, 'prop_bush_v1.png', 990 - cam.x, 590 - cam.y, 76, 58) });
        ents.push({ y: 296, f: () => Art.draw(g, 'prop_flower_v1.png', 958 - cam.x, 240 - cam.y, 72, 56) });
        ents.push({ y: 946, f: () => Art.draw(g, 'prop_fence_v1.png', 300 - cam.x, 884 - cam.y, 120, 62) });
        ents.push({ y: 946, f: () => Art.draw(g, 'prop_fence_v1.png', 1180 - cam.x, 884 - cam.y, 120, 62) });
        ents.push({ y: 1062, f: () => Art.draw(g, 'prop_lantern_v1.png', 618 - cam.x, 1006 - cam.y, 40, 56) });
        ents.push({ y: 1062, f: () => Art.draw(g, 'prop_lantern_v1.png', 950 - cam.x, 1006 - cam.y, 40, 56) });
        ents.push({ y: 1058, f: () => Art.draw(g, 'prop_flower_v1.png', 980 - cam.x, 1002 - cam.y, 72, 56) });
        /* 追加批3：M1 程序占位树（方块树冠）全部拔除，原树位以灌木/花丛替代（原树干碰撞保留） */
        ents.push({ y: 154, f: () => Art.draw(g, 'prop_bush_v1.png', 48 - cam.x, 68 - cam.y, 116, 86) });
        ents.push({ y: 774, f: () => Art.draw(g, 'prop_bush_v1.png', 1318 - cam.x, 690 - cam.y, 116, 84) });
        ents.push({ y: 1030, f: () => Art.draw(g, 'prop_flower_v1.png', 112 - cam.x, 954 - cam.y, 104, 76) });
        ents.push({ y: 1054, f: () => Art.draw(g, 'prop_bush_v1.png', 1438 - cam.x, 968 - cam.y, 116, 86) });
      }
    } else {

    ents.push({ y: 246, f: () => this.drawBuilding(680, 120, 240, 118, '掌门居') });
    ents.push({ y: 528, f: () => { this.drawBuilding(1150, 420, 168, 104, '淬炼坊');
      const fl = 8 + Math.sin(performance.now() / 160) * 2;
      g.fillStyle = '#3d3d3d'; g.fillRect(1224, 486, 20, 20);
      g.fillStyle = '#ff9c4a'; g.fillRect(1230, 494 - fl / 2, 8, fl); } });
    ents.push({ y: 816, f: () => { const x = 1088 - cam.x, y = 760 - cam.y;
      g.fillStyle = '#8a6d4f'; g.fillRect(x, y + 14, 74, 42); g.fillStyle = '#6e5638'; g.fillRect(x, y + 4, 74, 14);
      g.fillStyle = '#f2ead8'; g.font = '12px sans-serif'; g.textAlign = 'center'; g.fillText('订单点', x + 37, y - 4); } });
    ents.push({ y: 1142, f: () => { const x = -cam.x, y = -cam.y;
      g.fillStyle = '#5a4632'; g.fillRect(x + 736, y + 1064, 14, 86); g.fillRect(x + 850, y + 1064, 14, 86);
      g.fillStyle = '#37474f'; g.fillRect(x + 720, y + 1048, 160, 16);
      g.fillStyle = '#f2ead8'; g.font = '700 13px sans-serif'; g.textAlign = 'center'; g.fillText('青 云 宗', x + 800, y + 1061); } });
    ents.push({ y: 352, f: () => { const x = 1400 - cam.x, y = 306 - cam.y;
      g.fillStyle = '#e8dcc3'; g.fillRect(x - 44, y + 22, 88, 24);
      g.fillStyle = '#8c2f22'; g.font = '700 12px sans-serif'; g.textAlign = 'center';
      g.fillText(Scene.isLocked('mineZone') ? '后山矿口 · 未开放' : '后山矿口', x, y + 38); } });
    }
    /* 追加批3：M1 程序占位树已全部拔除（原树位由 prop_bush/prop_flower 替代，见 Art.ready 分支装饰段） */
    for (const a of Npc.agents){ const d = Disciples.getDisciple(a.discipleId);
      ents.push({ y: a.y, f: () => this.drawPerson(a, d, false) }); }
    ents.push({ y: Actor.player.y, f: () => this.drawPerson(Actor.player, null, true) });
    ents.sort((m, n) => m.y - n.y);
    for (const e of ents) e.f();
    this._drawPlates();
  },
  drawBuilding(x0, y0, w, h, name){
    const g = this.ctx, x = x0 - Scene.camera.x, y = y0 - Scene.camera.y;
    g.fillStyle = '#e8dcc3'; g.fillRect(x, y + 44, w, h - 44);
    g.fillStyle = '#4a5d6b';
    g.beginPath(); g.moveTo(x - 12, y + 50); g.lineTo(x + w / 2, y - 4); g.lineTo(x + w + 12, y + 50); g.closePath(); g.fill();
    g.fillStyle = '#6e5638'; g.fillRect(x + w / 2 - 17, y + h - 42, 34, 42);
    g.fillStyle = '#f5eeda'; g.fillRect(x + 24, y + 60, 32, 24); g.fillRect(x + w - 56, y + 60, 32, 24);
    g.fillStyle = '#8c2f22'; g.font = '700 14px sans-serif'; g.textAlign = 'center'; g.fillText(name, x + w / 2, y + 28);
  },
};

/* ================================================================
 * 主循环与启动
 * ================================================================ */
const Game = {
  last: 0, running: false, saveTimer: 0,
  loop(t){
    if (!this.running) return;
    requestAnimationFrame(this.loop.bind(this));
    const frameMs = this.last ? t - this.last : 16;
    const dt = clamp(frameMs, 0, 50); this.last = t;
    Actor.setMoveIntent(Input.getMoveVector(), dt);
    Scene.updateCamera(dt);
    Farming.settlePlots(nowMs());
    Production.settleJobs(nowMs()); Orders.settleOrderTimers(nowMs());
    Disciples.settleDispatches(nowMs());
    this.slowTimer = (this.slowTimer || 0) + dt;
    if (this.slowTimer > 2000){ this.slowTimer = 0; Day.checkRollover(); Events.checkFaceEvents(); Leaderboard.reportScore(); }
    Npc.tick(dt);
    Interaction.refreshButton();
    Render.draw();
    Fx.tick(clamp(frameMs, 0, CONFIG.fx.dtClampMs), frameMs);
    this.saveTimer += dt;
    if (this.saveTimer > CONFIG.save.autosaveMs){ this.saveTimer = 0; Save.save('autosave'); }
  },
  boot(){
    Art.load();
    Save.load();
    Sect.recomputeBuildDegree();
    Farming.init(); Disciples.init(); Production.init(); Orders.init(); Codex.init();
    Events.ensureWeekly(); Ads.resumeChecks();
    Day.init();
    Scene.loadMap('kaizongmen_main');
    Actor.spawnPlayer();
    Npc.syncRoster();
    Offline.settleOnReturn(nowMs());
    Render.init(); Fx.init(); Input.init();
    if (Art.ready2) Fx.attachSwordTrail();   // 美术批二：图集先行就绪时补注册剑光（后就绪由 Art._build2 调用，幂等）
    // 环境活气：淬炼坊烟气 stream＋大殿前光尘 stream（降级时自动关停）
    Fx.stream(1239, 314, { rate: 4, sprites: ['spark'], vy: -0.8, spread: 6, life: 1100, size: 2.6 }); // M3：新图烟囱口（约 1239,314），图内静态烟已在，动态 stream 减弱保留活气
    Fx.stream(800, 210, { rate: 4, sprites: ['mote'], vy: -0.28, spread: 70, life: 1700, size: 2.6 });
    $('btnDisciples').onclick = () => { UI._mode = 'panel'; UI.openDisciplesPanel(); };
    $('btnOrders').onclick = () => { UI._mode = 'panel'; UI.openOrdersPanel(); };
    $('btnRoutine').onclick = () => { UI._mode = 'panel'; UI.openRoutinePanel(); };
    $('btnCodex').onclick = () => { UI._mode = 'panel'; UI.openCodexPanel(); };
    $('btnSect').onclick = () => { UI._mode = 'panel'; UI.openSectPanel(); };
    $('btnBoard').onclick = () => { UI._mode = 'panel'; UI.openBoardPanel(); };
    $('seedBtn').onclick = () => { const keys = Object.keys(CONFIG.crops);
      const i = keys.indexOf(S.farmMode || CONFIG.farm.defaultCrop);
      S.farmMode = keys[(i + 1) % keys.length];
      UI.hint('下次播种：' + CONFIG.crops[S.farmMode].name +
        (Object.keys(CONFIG.crops[S.farmMode].inputs).length
          ? '（需 ' + UI.needsText(CONFIG.crops[S.farmMode].inputs) + '）' : ''));
      Save.save('farm_mode'); };
    $('panelWrap').addEventListener('pointerdown', e => { if (e.target === $('panelWrap')) UI.closePanel(); });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden){ Save.save('hidden'); this.running = false; }
      else if (!this.running){ this.last = 0; this.running = true; requestAnimationFrame(this.loop.bind(this)); } });
    addEventListener('beforeunload', () => Save.save('unload'));
    UI.syncHud(); this._lastCoinFix();
    /* 紧急修复批①：封面时序理顺——满 1.5s 且主图集就绪才淡出（上限 4s 防加载失败挂死）；
       淡出 0.7s 完成后再贴镜头、亮 HUD（body.booted）、发开局/离线提示，
       不许出现封面与 HUD 同帧叠印、也不许玩家在封面期盲走。 */
    const bootT0 = Date.now();
    const finishSplash = () => { const sp = $('splash'); if (sp) sp.classList.add('done');
      setTimeout(() => { Scene.snapCamera(); document.body.classList.add('booted');
        UI.hint(S.pendingSettlement ? '有离线产出待领，去掌门居门前领取' : '左边摇杆走动，走到田边点右下按钮干活'); }, 720); };
    const waitSplash = () => { if (Art.ready || Date.now() - bootT0 > 4000) finishSplash();
      else setTimeout(waitSplash, 200); };
    setTimeout(waitSplash, 1500);
    this.running = true; requestAnimationFrame(this.loop.bind(this));
  },
  _lastCoinFix(){ UI._lastCoin = S.balances.coin || 0; $('coin').textContent = UI._lastCoin; },
  /* 修复批⑥：读手动槽后重装配运行时（模块 init 均为「有数据不重建」口径，与 boot 同序安全重入） */
  applyLoadedState(){
    Sect.recomputeBuildDegree();
    Farming.init(); Disciples.init(); Production.init(); Orders.init(); Codex.init();
    Events.ensureWeekly(); Ads.resumeChecks();
    Day.init();
    Scene.loadMap('kaizongmen_main');
    Actor.spawnPlayer();
    Npc.syncRoster();
    UI.syncHud();
  },
};
Game.boot();

/* 测试钩子（冒烟脚本用） */
window.__game = { CONFIG, Ledger, Save, Farming, Npc, Offline, Day, Actor, Scene, Disciples, Interaction, Fx, Render,
  Production, Orders, Events, Ads, Sect, Codex, UI, Leaderboard, Art,
  get state(){ return S; } };
</script>
</body>
</html>
