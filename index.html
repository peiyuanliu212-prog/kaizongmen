/* ================================================================
 * 模块：存档层 save（唯一持久化入口；normalize 版本阶梯）
 * ================================================================ */
const Save = {
  // 版本阶梯：键为「从该版本升级」的迁移函数；新增版本时只往后追加，不改旧阶梯
  MIGRATIONS: {
    1: s => { // v1 -> v2：M2 新字段嵌套补齐（顶层已由 freshState 合并，这里处理嵌套结构与旧弟子/建筑）
      const F = freshState();
      s.routine = Object.assign(F.routine, s.routine || {});
      s.routine.signIn = Object.assign(F.routine.signIn, (s.routine || {}).signIn || {});
      s.routine.weekly = Object.assign(F.routine.weekly, (s.routine || {}).weekly || {});
      s.routine.daily = Object.assign(F.routine.daily, (s.routine || {}).daily || {});
      s.ordersMeta = Object.assign(F.ordersMeta, s.ordersMeta || {});
      s.adsDaily = Object.assign(F.adsDaily, s.adsDaily || {});
      if (!Array.isArray(s.adsApplied)) s.adsApplied = [];
      if (!s.stats) s.stats = { earnedCoin: 0 };
      if (!s.codex) s.codex = { seen: {} };
      if (!s.farmMode) s.farmMode = CONFIG.farm.defaultCrop;
      for (const d of (s.disciples || [])){ // 旧弟子补三件套字段
        if (!d.attrs) d.attrs = {};
        if (!Array.isArray(d.fates)) d.fates = [];
        if (!d.quality) d.quality = '寻常';
        if (d.dispatch === undefined) d.dispatch = null;
      }
      if (!(s.buildings || []).some(b => b.id === 'quarters'))
        s.buildings.push({ ...CONFIG.buildings.find(b => b.id === 'quarters') });
      return s;
    },
  },
  digest(str){ let h = 0; for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0; return 'd' + (h >>> 0).toString(36); },
  normalize(raw){
    if (!raw || typeof raw !== 'object') return null;
    let s = Object.assign(freshState(), raw);       // 缺字段以新档默认补齐
    s.day = Object.assign(freshState().day, raw.day || {});
    // 嵌套对象逐项合并（防旧档覆盖掉后加的字段：双榜统计/缓存即属此类）
    s.stats = Object.assign(freshState().stats, raw.stats || {});
    s.boardCache = Object.assign(freshState().boardCache, raw.boardCache || {});
    s.lastReport = Object.assign(freshState().lastReport, raw.lastReport || {});
    let v = typeof raw.ver === 'number' ? raw.ver : 0;
    while (v < CONFIG.save.version){
      const step = this.MIGRATIONS[v];
      if (step){ s = step(s); s.migrationLog.push('v' + v + '->v' + (v + 1)); }
      v++;
    }
    s.ver = CONFIG.save.version;
    return s;
  },
  save(reason){
    try {
      S.savedAt = nowMs(); S.lastSeenAt = nowMs();
      const payload = JSON.stringify(S);
      const prev = localStorage.getItem(CONFIG.save.key);
      if (prev) localStorage.setItem(CONFIG.save.lastGoodKey, prev);   // 上一份落盘作 lastGood
      localStorage.setItem(CONFIG.save.key, payload);
      return true;
    } catch (e) { console.warn('[save] failed', reason, e); return false; }
  },
  load(){
    let raw = null;
    try { raw = JSON.parse(localStorage.getItem(CONFIG.save.key) || 'null'); } catch (e) { raw = null; }
    let s = this.normalize(raw);
    if (!s){
      try { s = this.normalize(JSON.parse(localStorage.getItem(CONFIG.save.lastGoodKey) || 'null')); } catch (e) { s = null; }
      if (s) console.warn('[save] restored lastGood');
    }
    S = s || freshState();
    return S;
  },
  exportSnapshot(){ return JSON.parse(JSON.stringify(S)); },
};

/* ================================================================
 * 模块：账本与库存 ledger/inventory（资源单一事实源）
 * 接口：transact / canAfford / addItem / consumeItem / snapshotBalances
 * ================================================================ */
const Ledger = {
  _txSeq: 0,
  transact(tx){ // tx: { reason, currency?:{coin:n}, items?:{itemId:qty} }（增正减负，原子校验）
    const cur = tx.currency || {}, itm = tx.items || {};
    for (const k in cur) if ((S.balances[k] || 0) + cur[k] < 0) return false;
    for (const k in itm) if ((S.inventory[k] || 0) + itm[k] < 0) return false;
    for (const k in cur) S.balances[k] = (S.balances[k] || 0) + cur[k];
    for (const k in itm) S.inventory[k] = (S.inventory[k] || 0) + itm[k];
    for (const k in cur) if (cur[k] > 0 && S.stats) S.stats.earnedCoin += cur[k];   // 打脸线/统计读真实入账
    // 效率榜事实源：只有订单交付入账计「经营产出」（赠予/广告/离线一律不计，防刷口径见 Leaderboard）
    if (cur.coin > 0 && tx.reason && tx.reason.indexOf('order_') === 0 && S.stats){
      S.stats.opEarned = (S.stats.opEarned || 0) + cur.coin;
      S.stats.opOrders = (S.stats.opOrders || 0) + 1;
      const dk = Day.getDailyKey();
      if (S.stats.opLastDate !== dk){ S.stats.opLastDate = dk; S.stats.opDays = (S.stats.opDays || 0) + 1; }
    }
    for (const k in itm) if (itm[k] > 0) Codex.markSeen(k);                        // 图鉴：首次获得即登记
    S.transactions.push({ id: ++this._txSeq, ts: nowMs(), reason: tx.reason, currency: cur, items: itm });
    if (S.transactions.length > 100) S.transactions.splice(0, S.transactions.length - 100);
    UI.syncHud();
    return true;
  },
  canAfford(cost){ // cost: { coin?:n, items?:{id:qty} }
    if (cost.coin && (S.balances.coin || 0) < cost.coin) return false;
    for (const k in (cost.items || {})) if ((S.inventory[k] || 0) < cost.items[k]) return false;
    return true;
  },
  addItem(itemId, qty, reason){ return this.transact({ reason: reason || 'addItem', items: { [itemId]: qty } }); },
  consumeItem(itemId, qty, reason){ return this.transact({ reason: reason || 'consumeItem', items: { [itemId]: -qty } }); },
  snapshotBalances(){ return { balances: { ...S.balances }, inventory: { ...S.inventory } }; },
  // 出售红线（账本层 enforced）：sellable=false 的条目禁止进入订单/出售路径
  isSellable(itemId){ const it = CONFIG.items[itemId]; return !!(it && it.sellable); },
};

/* ================================================================
 * 模块：日界与体力 day/stamina
 * 接口：canSpend / spendStamina / restoreStamina / sleep / getDailyKey
 * ================================================================ */
const Day = {
  getDailyKey(d){ const t = d || new Date();
    return t.getFullYear() + '-' + (t.getMonth() + 1) + '-' + t.getDate(); },
  init(){ S.day.dailyKey = this.getDailyKey(); this.restoreByElapsed(); },
  weekKey(d){ const t = d || new Date(); const onejan = new Date(t.getFullYear(), 0, 1);
    const wk = Math.ceil((((t - onejan) / 86400000) + onejan.getDay() + 1) / 7);
    return t.getFullYear() + 'W' + wk; },
  // 真实日期日界（与睡觉严格分离：睡觉不触发此函数，防刷签到/广告序号）
  checkRollover(){
    const key = this.getDailyKey();
    if (S.day.dailyKey === key) return false;
    S.day.dailyKey = key;
    S.adsDaily = { date: key, rewardSeq: 0, byPoint: {} };
    S.routine.daily = { key, done: {} };
    S.ordersMeta.freeRefreshLeft = CONFIG.orders.freeRefreshPerDay;
    Orders.generateDaily(true);
    Events.ensureWeekly();
    Save.save('rollover');
    return true;
  },
  restoreByElapsed(){ // 离线按 elapsed 恢复（与睡觉恢复共用锚点，防双算）
    const el = nowMs() - (S.day.staminaAnchorAt || nowMs());
    if (el > 0 && S.day.stamina < CONFIG.stamina.max){
      const gain = CONFIG.stamina.max * el / CONFIG.stamina.offlineFullMs;
      S.day.stamina = clamp(S.day.stamina + gain, 0, CONFIG.stamina.max);
    }
    S.day.staminaAnchorAt = nowMs();
  },
  canSpend(n){ return S.day.stamina >= n; },
  spendStamina(n, reason){ if (!this.canSpend(n)) return false;
    S.day.stamina -= n; S.day.staminaAnchorAt = nowMs(); UI.syncHud(); return true; },
  restoreStamina(n, source){ S.day.stamina = clamp(S.day.stamina + n, 0, CONFIG.stamina.max);
    S.day.staminaAnchorAt = nowMs(); UI.syncHud(); },
  sleep(onDone){
    const f = $('fade'); f.style.opacity = 1;
    setTimeout(() => {
      // 当日弟子产出结算入账本（作物不催熟：只动 readyAt 已到期的结算检查，不改完成时间）
      let settled = 0;
      if (S.pendingYield > 0){
        if (Ledger.addItem('lingzhi', S.pendingYield, 'disciple_daily')) settled = S.pendingYield;
        S.pendingYield = 0;
      }
      S.day.dayIndex += 1;
      S.day.stamina = CONFIG.stamina.max; S.day.staminaAnchorAt = nowMs();
      Npc.onNewDay();
      Farming.settlePlots(nowMs());
      Save.save('sleep');
      UI.syncHud();
      UI.hint('第 ' + S.day.dayIndex + ' 天' + (settled ? ' · 弟子昨日搬运入库 灵芝 +' + settled : ''));
      f.style.opacity = 0;
      Events.checkFaceEvents();
      if (onDone) onDone();
    }, 900);
  },
};

/* ================================================================
 * 模块：扩建与晋阶 sect（M2 实装：报价/扣款走账本/场景即时变化/品级晋阶）
 * ================================================================ */
const Sect = {
  recomputeBuildDegree(){
    S.buildDegree = S.buildings.reduce((sum, b) => sum + b.level * b.degreePerLevel, 0);
    return S.buildDegree;
  },
  building(id){ return S.buildings.find(b => b.id === id); },
  getUpgradeQuote(buildingId){
    if (buildingId === 'mineGate'){
      if (S.unlockedZones.includes('mineZone')) return null;
      return { name: '开辟后山矿口', cost: { ...CONFIG.upgrades.mineUnlock }, desc: '解锁后山矿口与矿脉工位' };
    }
    const b = this.building(buildingId); if (!b) return null;
    const q = (CONFIG.upgrades[buildingId] || {})[b.level + 1];
    if (!q) return null;
    return { name: b.name + ' ' + b.level + '→' + (b.level + 1) + ' 级', cost: { coin: q.coin || 0, items: { ...(q.items || {}) } },
      desc: '建设度 +' + b.degreePerLevel };
  },
  upgrade(buildingId){ // 校验→账本同事务扣款→改场景/碰撞/活动区→重算建设度→落成反馈
    const q = this.getUpgradeQuote(buildingId); if (!q) return false;
    if (!Ledger.canAfford(q.cost)){ UI.hint('家底不够：' + UI.costText(q.cost)); return false; }
    const neg = {}; for (const k in (q.cost.items || {})) neg[k] = -q.cost.items[k];
    if (!Ledger.transact({ reason: 'upgrade_' + buildingId, currency: { coin: -(q.cost.coin || 0) }, items: neg })) return false;
    if (buildingId === 'mineGate'){
      S.buildings.push({ id: CONFIG.mineBuilding.id, name: CONFIG.mineBuilding.name, level: 1,
        degreePerLevel: CONFIG.mineBuilding.degreePerLevel });
      Scene.unlockZone('mineZone');
      const g = Scene.getAnchor('mineGate');
      Fx.burst(g.x, g.y, { sprites: ['mote', 'spark'], n: 30, speed: 2.4, life: 900 });
      Fx.floatText(g.x, g.y - 30, '后山矿口已开辟', '#ffcf5e');
    } else {
      const b = this.building(buildingId); b.level += 1;
      Fx.burst(800, 250, { sprites: ['mote'], n: 22, speed: 2, life: 800 });
    }
    this.recomputeBuildDegree();
    Save.save('upgrade');
    UI.syncHud();
    return true;
  },
  nextRank(){ return CONFIG.ranks[S.sectRank + 1] || null; },
  canPromote(){ const n = this.nextRank(); return !!n && S.buildDegree >= n.need; },
  promote(useAdDouble){ // 晋阶：半屏仪式在 UI 层；此处只落状态与礼金（双倍由广告回执倍率决定）
    if (!this.canPromote()) return 0;
    S.sectRank += 1;
    let reward = CONFIG.promoteRewardBase * (S.sectRank + 1);
    if (useAdDouble) reward *= 2;
    Ledger.transact({ reason: 'promote', currency: { coin: reward } });
    this.recomputeBuildDegree();
    Save.save('promote');
    UI.syncHud();
    return reward;
  },
};

 * 模块：榜单 leaderboard（M2 补批实装；一页纸 v2 接口 reportScore/fetchBoards/getBoard）
 * 指标（只读既有事实源派生，禁第二套统计）：
 *  - 规模榜 scale ＝ 宗门总建设度（Sect.recomputeBuildDegree 按建筑状态重算）。
 *  - 效率榜 efficiency ＝ 累计订单入账 ÷（累计交付经营日＋先验 2 日），取整，单位 灵石/日。
 *    防刷稳健口径（双函定案留给设计侧定稳，此处定版并留档）：只有订单交付的灵石入账
 *    计入分子（账本 transact 按 reason 前缀 order_ 记账于 stats），晋阶礼金/签到/打脸
 *    贺礼/广告/离线产出等系统与被动收入一律不计；分母按真实日期去重（睡觉刷天数不
 *    影响），再加先验天数压小样本单日冲高；服务端按母本语义只升不降（记历史最佳）。
 * 传输：复用拼将系列榜单客户端母本（luanshi-pinjiang-lb + 封神客户端 lb* 实现）——
 *  ColorboxAI.cloud.request({auth:true}) 调 /api/leaderboard[/submit|/me]，
 *  displayName/avatar 由平台登录态填入，puid 由网关注入，客户端禁传。
 * 【替换点/未证实】本作尚无自有 CloudBase env 与网关，CONFIG.leaderboard.apiBase 为空时
 *  走下方本地适配层（与真实接口同签名：submit/list/me 均返回母本响应形状；
 *  本地种子行是演示数据、非全服玩家）。接入平台时填 apiBase/envId 即切换远程，
 *  跨 project 登录态能否被网关接受仍须真机联调复证（母本 README 已知未证实项）。
 * 降级口径（母本同）：一切榜单失败只影响面板文案，绝不抛错进主循环、不挡游玩。
 * ================================================================ */
const Leaderboard = {
  _profile: null, _lastReportAt: 0,
  /* ---- 指标派生 ---- */
  scaleScore(){ Sect.recomputeBuildDegree(); return S.buildDegree; },
  efficiencyScore(){ const st = S.stats || {};
    return Math.floor((st.opEarned || 0) / ((st.opDays || 0) + CONFIG.leaderboard.effPriorDays)); },
  metrics(){ return { scale: this.scaleScore(), efficiency: this.efficiencyScore() }; },
  _digest(kind, score){ return Save.digest('lb_' + kind + ':' + score); },
  /* ---- 平台画像（母本 lbProfile 同口径清洗；站外/未登录回本地名） ---- */
  async profile(){
    if (this._profile) return this._profile;
    try {
      const cb = window.ColorboxAI;
      if (cb && cb.auth && typeof cb.auth.getUserInfo === 'function'){
        const r = await cb.auth.getUserInfo();
        if (r && r.code === 200 && r.data){
          const av = r.data.avatar || r.data.userHeadUrl;
          this._profile = { nickname: r.data.nickname ? String(r.data.nickname).slice(0, 40) : '虎扑用户',
            avatar: (typeof av === 'string' && /^https?:\/\//.test(av) && av.length <= 512) ? av : null };
          return this._profile;
        }
      }
    } catch (e) {}
    this._profile = { nickname: '青云掌门', avatar: null };
    return this._profile;
  },
  available(){ const cb = window.ColorboxAI;
    return !!(CONFIG.leaderboard.apiBase && cb && cb.cloud && typeof cb.cloud.request === 'function'
      && typeof cb.cloud.auth === 'function'); },
  /* ---- 远程传输（母本 lbRequest 同形状；带超时，失败抛错由调用方降级） ---- */
  _authed: false,
  async _remote(path, data){
    if (!this.available()) throw new Error('榜单服务未接入');
    const cb = window.ColorboxAI, envId = CONFIG.leaderboard.envId;
    if (!this._authed){
      const r = await cb.cloud.auth({ envId });
      if (!r || (r.code !== 200 && r.code !== 0)) throw new Error('请先登录');
      this._authed = true;
    }
    const call = cb.cloud.request({ url: CONFIG.leaderboard.apiBase + path,
      method: data ? 'POST' : 'GET', data, envId, auth: true });
    const resp = await Promise.race([call, new Promise((_, rej) =>
      setTimeout(() => rej(new Error('榜单服务超时')), CONFIG.leaderboard.fetchTimeoutMs))]);
    if (!resp || resp.statusCode === 401) throw new Error('请先登录');
    if (resp.statusCode !== 200 || (resp.code !== 0 && resp.code !== 200))
      throw new Error((resp && resp.message) || '榜单服务异常');
    return resp.data;
  },
  /* ---- 本地适配层（与真实接口同签名；存档内保存，种子行仅本地演示） ---- */
  _local(){
    if (!S.lbLocal){
      const seeds = CONFIG.leaderboard.localSeeds, rows = {};
      for (const kind in seeds) rows[kind] = seeds[kind].map(([name, score]) =>
        ({ displayName: name, avatar: null, score, updatedAt: 0 }));
      S.lbLocal = { rows, myBest: { scale: 0, efficiency: 0 }, myName: '青云掌门' };
    }
    return S.lbLocal;
  },
  _localList(kind){ // 母本读榜形状：{ total, entries:[{rank,displayName,avatar,score,isCurrent}] }（前 50）
    const L = this._local(), mine = L.myBest[kind] || 0;
    const all = L.rows[kind].map(r => ({ ...r, isCurrent: false }));
    if (mine > 0) all.push({ displayName: L.myName, avatar: null, score: mine, isCurrent: true, updatedAt: 0 });
    all.sort((a, b) => b.score - a.score || (a.updatedAt || 0) - (b.updatedAt || 0));
    const entries = all.slice(0, 50).map((r, i) => ({ rank: i + 1, ...r }));
    return { total: all.length, entries };
  },
  _localMe(kind){
    const L = this._local(), mine = L.myBest[kind] || 0;
    if (mine <= 0) return null;
    const rank = L.rows[kind].filter(r => r.score > mine).length + 1;
    return { rank, score: mine, displayName: L.myName };
  },
  async _submit(kind, score, profile){ // 只升不降（母本 best 语义）
    const board = CONFIG.leaderboard.boards[kind];
    if (this.available())
      return this._remote('/leaderboard/submit', { board, score,
        displayName: profile.nickname, avatar: profile.avatar || undefined });
    const L = this._local();
    if (score > (L.myBest[kind] || 0)){ L.myBest[kind] = score; L.myName = profile.nickname; }
    Save.save('lb_local_submit');
    return this._localMe(kind);
  },
  async _fetch(kind){
    const board = CONFIG.leaderboard.boards[kind];
    if (this.available()){
      const data = await this._remote('/leaderboard?board=' + encodeURIComponent(board));
      const entries = (data && (data.entries || data.rows || data.list)) || [];
      if (!entries.some(r => r.isCurrent)){
        try { const me = await this._remote('/leaderboard/me?board=' + encodeURIComponent(board));
          if (me && me.rank) entries.push({ ...me, isCurrent: true }); } catch (e) {}
      }
      return entries;
    }
    return this._localList(kind).entries;
  },
  async _me(kind){
    if (this.available()){
      try { return await this._remote('/leaderboard/me?board=' +
        encodeURIComponent(CONFIG.leaderboard.boards[kind])); } catch (e) { return null; }
    }
    return this._localMe(kind);
  },
  /* ---- 对外接口（一页纸 v2） ---- */
  async reportScore(force){ // 节流＋摘要去重；失败不落 lastReport（留待下次重试）；永不抛错
    try {
      const now = nowMs();
      if (!force && now - this._lastReportAt < CONFIG.leaderboard.reportMinIntervalMs) return false;
      const m = this.metrics(); let changed = false;
      const profile = await this.profile();
      for (const kind of ['scale', 'efficiency']){
        if (m[kind] <= 0) continue;
        const dg = this._digest(kind, m[kind]);
        if (!force && S.lastReport[kind] === dg) continue;
        try { await this._submit(kind, m[kind], profile); S.lastReport[kind] = dg; changed = true; }
        catch (e) { /* 单榜失败互不牵连，摘要不落，下轮重试 */ }
      }
      this._lastReportAt = now;
      if (changed) Save.save('lb_report');
      return changed;
    } catch (e) { return false; }
  },
  async fetchBoards(){ // 双榜一并刷新进 boardCache；失败保留旧缓存并回 ok:false
    let ok = true;
    for (const kind of ['scale', 'efficiency']){
      try { S.boardCache[kind] = await this._fetch(kind); }
      catch (e) { ok = false; }
    }
    if (ok){ S.boardCache.updatedAt = nowMs(); Save.save('lb_fetch'); }
    return { ok };
  },
  getBoard(kind){ return S.boardCache[kind] || []; },
  myRank(kind){ return this._me(kind); },
};

/* ================================================================
 * 模块：离线结算 offline（M1 本地模拟实现；接口按一页纸 v2）
 * registerDefinition / settleOnReturn / previewSettlement / claimSettlement
 * 平台 timeflow BFF 接入留 M2；本实现遵循双轨公式与幂等回执。
 * ================================================================ */
const Offline = {
  definitionVersion: CONFIG.offline.definitionVersion,
  registerDefinition(version){ this.definitionVersion = version; return true; }, // M2 改为向 BFF 注册
  _ratePerHour(){ return (CONFIG.offline.rateBasePerHour + CONFIG.offline.ratePerBuildDegree * S.buildDegree)
    * CONFIG.offline.offlineRateFactor; },
  _compute(from, to){
    const el = Math.max(0, to - from);
    if (el < CONFIG.offline.minSettleMs) return null;
    const rate = this._ratePerHour();
    const cap = rate * CONFIG.offline.capHours * CONFIG.offline.capFactor;   // 相对封顶
    let amount = Math.min(rate * el / 3600000, cap);
    let early = 0;
    if (el <= CONFIG.offline.earlyBonusMs){ early = amount * (CONFIG.offline.earlyBonusMul - 1); amount += early; }
    amount = Math.floor(amount);
    if (amount < 1) return null;
    const digest = Save.digest(from + ':' + to + ':' + amount);
    return { id: 'st_' + digest, from, to, track1: { item: CONFIG.offline.track1Item, amount },
             track2: null, earlyBonus: Math.floor(early), digest };
  },
  settleOnReturn(now){ // 只生成待领快照，不直接发奖
    if (S.pendingSettlement) return S.pendingSettlement;
    const p = this._compute(S.lastSeenAt || S.createdAt, now);
    if (p){ S.pendingSettlement = p; Save.save('offline_pending'); }
    return p;
  },
  previewSettlement(){ return S.pendingSettlement; },
  claimSettlement(claimId){
    const p = S.pendingSettlement;
    if (!p || p.id !== claimId) return false;
    if (S.offlineClaim.appliedDigests.includes(p.digest)) { S.pendingSettlement = null; return false; } // 幂等
    const ok = Ledger.transact({ reason: 'offline_track1', currency: { [p.track1.item]: p.track1.amount } });
    if (ok){ S.offlineClaim.appliedDigests.push(p.digest); S.pendingSettlement = null;
      Events.markRoutine('settle'); Save.save('offline_claim'); }
    return ok;
  },
  dueDispatches(){ return S.disciples.filter(d => d.scenePresence === 'atGate'); },  // 轨道二待交接名单（结算面板分行播报）
};

/* ================================================================
 * 模块：特效层 fx/juice（对象池粒子引擎＋juice 工具集）
 * 发射模式：burst / stream / flyTo / bolt；帧率保护五条按调研落地。
 * ================================================================ */
const Fx = {
  canvas: null, ctx: null, dpr: 1,
  pool: [], active: 0, emitters: [], bolts: [], floats: [],
  perf: { level: 0, frameAvg: 16, overFrames: 0 },
  trauma: 0, shakeT: 0, reducedMotion: false,
  sprites: {},
  init(){
    this.canvas = $('fxCanvas'); this.ctx = this.canvas.getContext('2d');
    this.reducedMotion = !!matchMedia('(prefers-reduced-motion: reduce)').matches;
    this.dpr = clamp(devicePixelRatio || 1, 1, CONFIG.fx.dprCap);
    const resize = () => { this.canvas.width = innerWidth * this.dpr; this.canvas.height = innerHeight * this.dpr; };
    addEventListener('resize', resize); resize();
    for (let i = 0; i < CONFIG.fx.poolSize; i++)
      this.pool.push({ on: false, x: 0, y: 0, vx: 0, vy: 0, life: 0, maxLife: 1, size: 3, rot: 0, grav: 0,
        drag: 1, spr: 'mote', space: 'world', sx: 0, sy: 0, cx: 0, cy: 0, tx: 0, ty: 0, t: 0, dur: 1, onArrive: null, sway: 0, seed: 0 });
    this.sprites = {
      coin: this._sprite(8, (g) => { g.fillStyle = '#ffcf5e'; g.fillRect(1, 1, 6, 6); g.fillStyle = '#ffe9a8'; g.fillRect(2, 2, 3, 3); }),
      leaf: this._sprite(8, (g) => { g.fillStyle = '#7fae5c'; g.fillRect(1, 3, 6, 2); g.fillStyle = '#a8c686'; g.fillRect(2, 2, 4, 1); }),
      spark: this._sprite(8, (g) => { g.fillStyle = '#ffc46b'; g.fillRect(3, 0, 2, 8); g.fillRect(0, 3, 8, 2); }),
      mote: this._sprite(6, (g) => { g.fillStyle = '#fff3c4'; g.fillRect(1, 1, 4, 4); }),
      drop: this._sprite(8, (g) => { g.fillStyle = '#7fb3d5'; g.fillRect(3, 1, 2, 6); g.fillStyle = '#aed6f1'; g.fillRect(2, 4, 4, 3); }),
    };
    // 漂浮字 DOM 节点池
    for (let i = 0; i < 12; i++){ const d = document.createElement('div'); d.className = 'floatTxt';
      d.style.display = 'none'; document.body.appendChild(d); this.floats.push({ el: d, age: 0, life: 0, y: 0 }); }
  },
  _sprite(size, draw){ const c = document.createElement('canvas'); c.width = c.height = size;
    draw(c.getContext('2d')); return c; },
  _alloc(){ if (this.active >= CONFIG.fx.hardCap) return null;
    for (let i = 0; i < this.pool.length; i++) if (!this.pool[i].on){ const p = this.pool[i];
      if (i >= this.active){ /* 保持活跃段紧凑 */ }
      p.on = true; this.active++; return p; }
    return null; },
  _free(p){ p.on = false; this.active--; },
  _budget(n){ const room = CONFIG.fx.hardCap - this.active;
    let want = Math.min(n, room);
    if (this.perf.level === 1) want = Math.floor(want * 0.6);
    return Math.max(0, want); },
  /* ---- burst：一点爆散（世界坐标） ---- */
  burst(x, y, opts){
    opts = opts || {}; const n = this._budget(opts.n || 16); if (!n) return;
    const sprs = opts.sprites || ['mote'], spd = opts.speed || 2.2, life = opts.life || 800;
    for (let i = 0; i < n; i++){ const p = this._alloc(); if (!p) break;
      const a = Math.random() * Math.PI * 2, s = (0.3 + Math.random() * 0.7) * spd;
      Object.assign(p, { x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 0.7, grav: 0.0038, drag: 1,
        life: 0, maxLife: life * (0.6 + Math.random() * 0.7), size: 2.5 + Math.random() * 3,
        spr: sprs[i % sprs.length], space: 'world', rot: Math.random() * 7, sway: 0 }); }
  },
  /* ---- stream：持续发射器，返回句柄 { stop() } ---- */
  stream(x, y, opts){
    opts = opts || {};
    const em = { x, y, rate: opts.rate || 12, acc: 0, on: true,
      sprites: opts.sprites || ['mote'], vy: opts.vy != null ? opts.vy : -0.55, spread: opts.spread || 22,
      life: opts.life || 1300, size: opts.size || 3 };
    this.emitters.push(em);
    return { stop(){ em.on = false; } };
  },
  /* ---- flyTo：定向飞行（世界起点 → 屏幕目标点，二次贝塞尔，到达回调） ---- */
  flyTo(wx, wy, screenTx, screenTy, opts){
    opts = opts || {}; const n = this._budget(opts.n || 8); if (!n) return;
    const st = Scene.worldToScreen({ x: wx, y: wy });
    for (let i = 0; i < n; i++){ const p = this._alloc(); if (!p) break;
      const sx = st.x + (Math.random() * 26 - 13), sy = st.y + (Math.random() * 16 - 8);
      Object.assign(p, { space: 'screen', x: sx, y: sy, sx, sy, tx: screenTx, ty: screenTy,
        cx: (sx + screenTx) / 2, cy: Math.min(sy, screenTy) - 90 - Math.random() * 40,
        t: 0, dur: 620 + i * 55 + Math.random() * 120, life: 0, maxLife: 9999, size: 5,
        spr: opts.sprite || 'coin', grav: 0, onArrive: opts.onArrive || null, sway: 0 }); }
  },
  /* ---- bolt：一次性折线（主干分叉＋残影） ---- */
  bolt(x1, y1, x2, y2){
    const segs = []; const steps = 7; let px = x1, py = y1;
    for (let i = 1; i <= steps; i++){ const t = i / steps;
      const nx = x1 + (x2 - x1) * t + (i < steps ? (Math.random() * 26 - 13) : 0);
      const ny = y1 + (y2 - y1) * t + (i < steps ? (Math.random() * 14 - 7) : 0);
      segs.push([px, py, nx, ny]); px = nx; py = ny; }
    this.bolts.push({ segs, age: 0, life: 260 });
    this.flash(0.35, '#ffeeb0'); this.shake(0.45);
  },
  /* ---- juice ---- */
  shake(mag){ if (this.reducedMotion) return; this.trauma = clamp(this.trauma + mag, 0, 1); },
  flash(alpha, color){ if (this.reducedMotion) return; const f = $('flash');
    f.style.background = color || '#ffffff'; f.style.transition = 'none'; f.style.opacity = alpha;
    requestAnimationFrame(() => { f.style.transition = 'opacity .45s'; f.style.opacity = 0; }); },
  floatText(wx, wy, text, color){
    const slot = this.floats.find(f => f.life <= 0) || this.floats[0];
    const sp = Scene.worldToScreen({ x: wx, y: wy });
    slot.el.textContent = text; slot.el.style.color = color || '#f2d38a';
    slot.el.style.left = sp.x + 'px'; slot.el.style.top = sp.y + 'px'; slot.el.style.display = 'block';
    slot.age = 0; slot.life = 1150; slot.y = sp.y;
  },
  countUp(el, from, to, dur){
    if (!el) return; const t0 = performance.now();
    const step = (t) => { const k = clamp((t - t0) / (dur || 600), 0, 1);
      const e = 1 - Math.pow(1 - k, 3);
      el.textContent = Math.round(from + (to - from) * e);
      if (k < 1) requestAnimationFrame(step); else el.textContent = to; };
    requestAnimationFrame(step);
  },
  ease: { linear: t => t, outCubic: t => 1 - Math.pow(1 - t, 3),
    outBack: t => 1 + 2.7 * Math.pow(t - 1, 3) + 1.7 * Math.pow(t - 1, 2),
    outElastic: t => t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (2 * Math.PI / 3)) + 1,
    inOutQuad: t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2 },
  /* M3.5：环境飘落——落瓣/落叶精灵低密度慢飘全宗门；沿用 emitters 帧率保护（perf 2 级自动停） */
  attachGroundFx(){
    if (this._ambientOn || !this.sprites || typeof Art === 'undefined' || !Art.ready) return;
    const petals = [], gleaves = [];
    for (let i = 1; i <= 7; i++){ const c = Art.cropCanvas('fx_petal_' + i + '_v1.png', true);
      if (c){ this.sprites['petal' + i] = c; petals.push('petal' + i); } }
    for (let i = 1; i <= 8; i++){ const c = Art.cropCanvas('fx_leaf_' + i + '_v1.png', true);
      if (c){ this.sprites['gleaf' + i] = c; gleaves.push('gleaf' + i); } }
    if (!petals.length && !gleaves.length) return;
    this._ambientOn = true;
    if (petals.length) this.emitters.push({ x: 800, y: 400, rate: 1.4, acc: 0, on: true, drift: true,
      spread: 780, spreadY: 300, sprites: petals, vx: 0.14, vy: 0.13, life: 9500, size: 8.5 });
    if (gleaves.length) this.emitters.push({ x: 800, y: 760, rate: 1.0, acc: 0, on: true, drift: true,
      spread: 780, spreadY: 330, sprites: gleaves, vx: 0.11, vy: 0.16, life: 9000, size: 9 });
  },
  /* ---- 主循环（由游戏主循环以钳制后 dt 调用） ---- */
  tick(dtMs, frameMs){
    // 帧率自适应降级（恢复后不自动升档，防抖动）
    this.perf.frameAvg = this.perf.frameAvg * 0.92 + frameMs * 0.08;
    if (this.perf.frameAvg > CONFIG.fx.degradeFrameMs){ if (++this.perf.overFrames > 45 && this.perf.level < 2){
      this.perf.level++; this.perf.overFrames = 0;
      if (this.perf.level === 2) for (const em of this.emitters) em.on = false; } }
    else this.perf.overFrames = Math.max(0, this.perf.overFrames - 2);
    // stream 发射
    if (this.perf.level < 2) for (const em of this.emitters){ if (!em.on) continue;
      em.acc += em.rate * dtMs / 1000;
      while (em.acc >= 1){ em.acc--; const p = this._alloc(); if (!p) break;
        if (em.drift){ Object.assign(p, { x: em.x + (Math.random() * 2 - 1) * em.spread,
          y: em.y + (Math.random() * 2 - 1) * (em.spreadY || 8),
          vx: (em.vx || 0.15) * (0.6 + Math.random() * 0.8), vy: (em.vy || 0.15) * (0.7 + Math.random() * 0.6),
          grav: 0, drag: 1, life: 0, maxLife: em.life * (0.75 + Math.random() * 0.5),
          size: em.size * (0.7 + Math.random() * 0.7),
          spr: em.sprites[Math.floor(Math.random() * em.sprites.length)], space: 'world',
          rot: Math.random() * 7, sway: 1, seed: Math.random() * 7 }); continue; }
        Object.assign(p, { x: em.x + (Math.random() * em.spread * 2 - em.spread), y: em.y + (Math.random() * 8 - 4),
          vx: (Math.random() * 0.24 - 0.12), vy: em.vy * (0.8 + Math.random() * 0.5), grav: -0.0004, drag: 1,
          life: 0, maxLife: em.life * (0.7 + Math.random() * 0.6), size: em.size * (0.7 + Math.random() * 0.7),
          spr: em.sprites[0], space: 'world', rot: 0, sway: 0 }); } }
    this.emitters = this.emitters.filter(e => e.on);
    // 粒子推进
    for (const p of this.pool){ if (!p.on) continue; p.life += dtMs;
      if (p.space === 'screen'){ p.t += dtMs; const k = clamp(p.t / p.dur, 0, 1);
        const u = 1 - k; p.x = u * u * p.sx + 2 * u * k * p.cx + k * k * p.tx;
        p.y = u * u * p.sy + 2 * u * k * p.cy + k * k * p.ty;
        if (k >= 1){ const cb = p.onArrive; this._free(p); if (cb) cb(); } continue; }
      if (p.life >= p.maxLife){ this._free(p); continue; }
      p.vy += p.grav * dtMs; p.x += p.vx * dtMs / 10; p.y += p.vy * dtMs / 10; p.rot += dtMs / 160;
      if (p.sway) p.x += Math.sin(p.life / 340 + (p.seed || 0)) * dtMs * 0.045; }
    for (let i = this.bolts.length - 1; i >= 0; i--){ this.bolts[i].age += dtMs;
      if (this.bolts[i].age >= this.bolts[i].life) this.bolts.splice(i, 1); }
    // 漂浮字
    for (const f of this.floats){ if (f.life <= 0) continue; f.age += dtMs;
      if (f.age >= f.life){ f.life = 0; f.el.style.display = 'none'; continue; }
      f.el.style.top = (f.y - f.age * 0.028) + 'px'; f.el.style.opacity = 1 - f.age / f.life; }
    // 震屏（trauma² × 噪声）
    if (this.trauma > 0){ this.trauma = Math.max(0, this.trauma - dtMs / 480); this.shakeT += dtMs / 28;
      const m = this.trauma * this.trauma * 13;
      const ox = (Math.sin(this.shakeT * 1.7) + Math.sin(this.shakeT * 2.9) * 0.6) * m;
      const oy = (Math.cos(this.shakeT * 2.3) + Math.sin(this.shakeT * 3.7) * 0.6) * m;
      $('stage').style.transform = `translate(${ox.toFixed(1)}px, ${oy.toFixed(1)}px)`;
      if (this.trauma === 0) $('stage').style.transform = ''; }
    this._draw();
  },
  _draw(){
    const g = this.ctx; g.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    g.clearRect(0, 0, innerWidth, innerHeight);
    for (const b of this.bolts){ const a = 1 - b.age / b.life;
      g.strokeStyle = 'rgba(255,238,176,' + (a * 0.95) + ')'; g.lineWidth = 3; g.beginPath();
      for (const s of b.segs){ const p1 = Scene.worldToScreen({ x: s[0], y: s[1] }), p2 = Scene.worldToScreen({ x: s[2], y: s[3] });
        g.moveTo(p1.x, p1.y); g.lineTo(p2.x, p2.y); } g.stroke(); }
    for (const p of this.pool){ if (!p.on) continue;
      const sp = p.space === 'screen' ? { x: p.x, y: p.y } : Scene.worldToScreen(p);
      const k = p.space === 'screen' ? 1 : 1 - p.life / p.maxLife;
      g.globalAlpha = clamp(k * 1.7, 0, 1);
      const img = this.sprites[p.spr] || this.sprites.mote, sc = p.size / 4;
      g.save(); g.translate(sp.x, sp.y); if (p.spr === 'leaf') g.rotate(p.rot); else if (p.sway) g.rotate(Math.sin(p.rot * 0.35) * 0.7);
      g.drawImage(img, -4 * sc, -4 * sc, 8 * sc, 8 * sc); g.restore(); }
    g.globalAlpha = 1;
  },
};

/* ================================================================

  ],
  anchors: {
