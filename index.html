function fmtDur(ms){ if (ms <= 0) return '已成熟/已完成';
  const s = Math.ceil(ms / 1000); if (s < 60) return s + ' 秒';
  const m = Math.floor(s / 60); if (m < 60) return m + ' 分 ' + (s % 60) + ' 秒';
  const h = Math.floor(m / 60); if (h < 24) return h + ' 小时 ' + (m % 60) + ' 分';
  return Math.floor(h / 24) + ' 天 ' + (h % 24) + ' 小时'; }
function fmtClock(ts){ const d = new Date(ts), p = n => String(n).padStart(2, '0');
  return (d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()); }
function dayKey(ts){ const d = new Date(ts || nowMs()), p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()); }
function digest(str){ let h = 5381; for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) >>> 0;
  return 'd' + h.toString(36); }

function hashStr(str){ let h = 5381; str = String(str || ''); for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) >>> 0; return h; }
function avatarIdxOf(d){ return (typeof d.avatarIdx === 'number') ? d.avatarIdx : (hashStr(d.id || d.name) % 6); }  // 弟子头像：按 id 哈希分配 %6（与旧版同口径）

/* ---------------- 账本（资源单一事实源） ---------------- */
const Ledger = {
  canAfford(cost){ if (!cost) return true;
    if (cost.coin && (S.balances.coin || 0) < cost.coin) return false;
    for (const k in (cost.items || {})) if ((S.inventory[k] || 0) < cost.items[k]) return false; return true; },
  costOf(coinAmt, itemsObj){ const c = {}; if (coinAmt) c.coin = -coinAmt;
    for (const k in (itemsObj || {})) c[k] = -(itemsObj[k] || 0); return { items: c }; },
  /* tx = { coin: n, items: {id: n}, reason } —— 正入账、负扣费，先校验后落账，原子性 */
  transact(tx){
    const coin = tx.coin || 0, itm = tx.items || {};
    if (coin < 0 && (S.balances.coin || 0) + coin < 0) return false;
    for (const k in itm) if ((S.inventory[k] || 0) + itm[k] < 0) return false;
    if (coin) { S.balances.coin = (S.balances.coin || 0) + coin;
      if (coin > 0){ S.stats.earnedCoin += coin; rollToday(); S.stats.todayEarned += coin;
        if (window.UI_READY && typeof floatText === 'function'){ floatText('+' + coin + ' 灵石', 'gold'); Audio8.play('coins', 0.4); } } }
    for (const k in itm){ S.inventory[k] = (S.inventory[k] || 0) + itm[k];
      if (itm[k] > 0) S.codex.items[k] = true; }
    markDirty(); return true;
  },
};
function rollToday(){ const k = dayKey(); if (S.stats.todayKey !== k){ S.stats.todayKey = k; S.stats.todayEarned = 0; } }
function techMul(){ return 1 + CONFIG.technique.perLevel * (S.technique.level || 0); }
function expMul(){ return 1 + CONFIG.technique2.perLevel * (S.technique2.level || 0); }  // 引气诀：历练获取倍率（过天结算用）
function buildingLevel(id){ const b = S.buildings.find(x => x.id === id); return b ? (b.level || 0) : 0; }
function treasureSetCompleteOn(st, setId){ const owned = (st && st.treasures && st.treasures.owned) || {};
  return CONFIG.treasures.filter(t => t.set === setId).every(t => owned[t.id]); }
function setComplete(setId){ return treasureSetCompleteOn(S, setId); }
function recomputeDegree(){
  let d = 0;
  for (const b of S.buildings){ const def = CONFIG.buildings.find(x => x.id === b.id); if (def) d += b.level * def.degreePerLevel; }
  if (S.mineUnlocked) d += CONFIG.mineBuilding.degreePerLevel;
  if (setComplete('kaishan')) d += CONFIG.treasureSets.find(x => x.id === 'kaishan').degreeBonus;   // 宝库·开山套：建设度 +10（套装加成在事实源内叠加）
  S.sect.buildDegree = d; return d;
}
function postCount(postId){ return S.disciples.filter(d => !d.dispatch && d.post === postId).length; }
function postFactor(postId, base){ // 岗位系数：在岗弟子（≤2 名计效）逐人连乘 base×（1 − 5%×该弟子历练阶位）；0 阶弟子与旧口径完全一致
  const ds = S.disciples.filter(d => !d.dispatch && d.post === postId).slice(0, 2);
  let f = 1; for (const d of ds) f *= base * (1 - CONFIG.discipleExp.perStage * (d.stage || 0)); return f; }
function cropDurationMs(crop){ // 实际时长 ＝ 档位时长 ÷ 聚灵诀倍率 × 药圃岗位系数（播种时定格）；宝库·农桑套集齐再 ×0.9
  const base = CONFIG.tiers[crop.tier - 1].durationMs;
  let dur = base / techMul() * postFactor('farm', 0.8);
  if (setComplete('nongsang')) dur *= 0.9;
  return Math.round(dur); }
function jobDurationMs(recipe){ // 实际时长 ＝ 档位时长 ÷ 聚灵诀倍率 × 工位岗位系数（开工时定格）；宝库·匠作套集齐再 ×0.9
  const base = CONFIG.tiers[recipe.tier - 1].durationMs;
  let dur = base / techMul() * postFactor(recipe.station, 0.9);
  if (setComplete('jiangzuo')) dur *= 0.9;
  return Math.round(dur); }

function normalizeState(raw){ // 任意来源（本地档/长码/短码）的存档先过这里：与 freshState 合并补缺，形状不对返回 null
  if (!raw || typeof raw !== 'object') return null;
  if (!raw.sect || typeof raw.sect !== 'object' || !raw.balances || typeof raw.balances !== 'object') return null;
  const F = freshState(); const s = Object.assign(F, raw);
  /* ver3 迁移（字段层）：meta.activeSlot 只接受 1–5 整数，其余一律 null；槽位归属的实际迁移
     （把现行档快照写入空槽）在 boot 时由 Save.ensureActiveSlot 执行，本函数不碰 localStorage */
  s.meta = Object.assign(F.meta, raw.meta || {});
  if (!(Number.isInteger(s.meta.activeSlot) && s.meta.activeSlot >= 1 && s.meta.activeSlot <= CONFIG.save.slots)) s.meta.activeSlot = null;
  s.meta.guideDone = !!s.meta.guideDone;   // 引导完成标记走 normalize 默认（老档无此字段＝false；是否触发由 Guide 的老玩家判定把关）
  s.sect = Object.assign(F.sect, raw.sect || {});
  s.balances = Object.assign(F.balances, raw.balances || {});
  s.inventory = Object.assign({}, raw.inventory || {});
  // 田数随大殿等级（时长保底批）：6 ＋ 2×(大殿级−1)；先按原始建筑算上限再对齐田块（长档已长的田不砍）
  const rawHall = (Array.isArray(raw.buildings) ? raw.buildings : []).find(b => b && b.id === 'hall');
  const plotCapN = CONFIG.plotCount + 2 * (clamp((rawHall && rawHall.level) || 1, 1, 3) - 1);
  s.plots = Array.isArray(raw.plots) && raw.plots.length ? raw.plots.slice(0, Math.max(plotCapN, raw.plots.length)) : F.plots;
  while (s.plots.length < plotCapN) s.plots.push({ cropId: null, plantedAt: 0, readyAt: 0 });
  s.jobs = Array.isArray(raw.jobs) ? raw.jobs : [];
  s.disciples = Array.isArray(raw.disciples) ? raw.disciples : [];
  // 建筑按 CONFIG 全量对齐：老档缺的新建筑（聚灵阵/藏书阁）以初始等级补入，已有等级保留
  s.buildings = CONFIG.buildings.map(def => { const rb = (Array.isArray(raw.buildings) ? raw.buildings : []).find(b => b && b.id === def.id);
    return { id: def.id, level: rb ? clamp(rb.level || 0, 0, 3) : def.level }; });
  s.technique = Object.assign(F.technique, raw.technique || {});
  // ver2 厚度批字段补齐（老档没有就用 fresh 默认，绝不因缺字段报错）
  s.technique2 = Object.assign(F.technique2, raw.technique2 || {});
  s.daily = (raw.daily && typeof raw.daily === 'object' && Array.isArray(raw.daily.taskIds)) ? raw.daily : null;
  s.treasures = Object.assign(F.treasures, raw.treasures || {});
  s.treasures.owned = (raw.treasures && raw.treasures.owned && typeof raw.treasures.owned === 'object') ? raw.treasures.owned : {};
  s.treasures.milestones = (raw.treasures && Array.isArray(raw.treasures.milestones)) ? raw.treasures.milestones : [];
  s.market = Object.assign(F.market, raw.market || {});
  s.chain = Object.assign(F.chain, raw.chain || {});
  s.chain.spring = Object.assign(F.chain.spring, (raw.chain || {}).spring || {});
  s.chain.spring.flags = ((raw.chain || {}).spring || {}).flags || {};
  s.chain.bandit = Object.assign(F.chain.bandit, (raw.chain || {}).bandit || {});
  s.chain.bandit.flags = ((raw.chain || {}).bandit || {}).flags || {};
  s.rush = (raw.rush && typeof raw.rush === 'object') ? raw.rush : null;
  s.ver = 3;
  for (const d of s.disciples){ if (typeof d.avatarIdx !== 'number') d.avatarIdx = hashStr(d.id || d.name) % 6;

function recomputeOn(s){ // 对任意状态对象重算建设度（normalize 时 S 还没换，先就地算；与 recomputeDegree 同口径）
  let d = 0;

  if (s.mineUnlocked) d += CONFIG.mineBuilding.degreePerLevel;
  if (treasureSetCompleteOn(s, 'kaishan')) d += CONFIG.treasureSets.find(x => x.id === 'kaishan').degreeBonus;   // 宝库·开山套 +10

}

/* ---------------- 离线结算（双轨本地公式，待领幂等） ---------------- */
const Offline = {
  /* 产率/小时 ＝（49 ＋ 0.2×建设度）× 0.6 × 聚灵诀倍率 ×（1 ＋ 8%×聚灵阵等级）×（云游套集齐 1.1）；封顶 ＝ 产率 × 7h × 0.6；离线 ≤8h 早归 ×1.3（封顶后加成，与行走版同口径；厚度批加成在事实源内叠加） */
  compute(from, to){
    const el = Math.max(0, to - from); if (el < CONFIG.offline.minSettleMs) return null;
    const rate = (CONFIG.offline.rateBasePerHour + CONFIG.offline.ratePerBuildDegree * S.sect.buildDegree)
                 * CONFIG.offline.offlineRateFactor * techMul()
                 * (1 + 0.08 * buildingLevel('spiritArray')) * (setComplete('yunyou') ? 1.1 : 1);
    const cap = rate * CONFIG.offline.capHours * CONFIG.offline.capFactor;
    let amount = Math.min(rate * el / 3600000, cap);
    let early = 0;
    if (el <= CONFIG.offline.earlyBonusMs){ early = amount * (CONFIG.offline.earlyBonusMul - 1); amount += early; }
    amount = Math.floor(amount); if (amount < 1) return null;
    return { id: 'st_' + digest(from + ':' + to + ':' + amount), from, to, amount,
             earlyBonus: Math.floor(early), digest: digest(from + ':' + to + ':' + amount), doubled: false,
             ratePerHour: Math.floor(rate), capAmount: Math.floor(cap), hours: Math.round(el / 360000) / 10 };  // 离线三件套明示（竞品落地）：时产/封顶/时长随结算单一事实源带出
  },
  settleOnReturn(){ if (S.pendingSettlement) return S.pendingSettlement;
    const p = this.compute(S.day.lastSeenAt || S.createdAt, nowMs());
    if (p){ S.pendingSettlement = p; markDirty(); Save.save(); } return p; },
  claim(doubled){ const p = S.pendingSettlement; if (!p) return 0;
    if (S.offlineClaim.appliedDigests.includes(p.digest)){ S.pendingSettlement = null; markDirty(); return 0; } // 幂等：同 digest 不双发
    const amt = doubled ? p.amount * 2 : p.amount;
    if (Ledger.transact({ coin: amt, reason: 'offline' })){
      S.offlineClaim.appliedDigests.push(p.digest); S.pendingSettlement = null; markDirty(); return amt; }
    return 0; },
};

/* ---------------- 广告（本地 mock 替换点：全主动触发、绝不插屏；PENDING 未落定不发、落定幂等、按序号衰减） ---------------- */
const Ads = {
  multFor(seq){ return seq <= CONFIG.ads.fullSeq ? 1 : seq <= CONFIG.ads.halfSeq ? 0.5 : 0; },
  /* effect 为可序列化描述：{type:'coinBonus', amount, tag} / {type:'jobSpeed', jobId} / {type:'orderRefresh'} / {type:'offlineDouble'} / {type:'promoteDouble'} */
  request(point, effect){
    const k = dayKey(); if (S.ads.date !== k){ S.ads.date = k; S.ads.seq = 0; }
    if (S.ads.pending.some(e => e.state === 'watching')){ toast('上一条广告还在播放中'); return; }
    const entry = { id: 'ad_' + nowMs().toString(36) + Math.floor(Math.random() * 999), point, effect,
                    state: 'watching', createdAt: nowMs(), granted: 0 };
    S.ads.pending.push(entry); markDirty(); Save.save(); render();
    setTimeout(() => { const e = S.ads.pending.find(x => x.id === entry.id);
      if (e && e.state === 'watching'){ e.state = 'completed'; this.settle(e.id); } }, CONFIG.ads.mockWatchMs);
  },
  settle(id){ const e = S.ads.pending.find(x => x.id === id);
    if (!e || e.state !== 'completed' || S.ads.applied.includes(id)) return;      // 未落定不发、已落定不重发
    const seq = S.ads.seq + 1, mult = this.multFor(seq), eff = e.effect || {}; let due = 0, msg = '';
    if (eff.type === 'coinBonus'){ due = Math.floor((eff.amount || 0) * mult); }
    else if (eff.type === 'offlineDouble'){ const p = S.pendingSettlement;
      if (p && !p.doubled){ due = Math.floor(p.amount * mult); if (due > 0 || mult === 0) p.doubled = true; } }
    else if (eff.type === 'promoteDouble'){ const pi = S.promoteInfo;
      if (pi && !pi.doubled){ due = Math.floor(pi.reward * mult); pi.doubled = true; } }
    else if (eff.type === 'jobSpeed'){ const j = S.jobs.find(x => x.id === eff.jobId);
      if (j && j.readyAt > nowMs()){ if (mult >= 1) j.readyAt = nowMs();
        else if (mult > 0) j.readyAt = nowMs() + Math.floor((j.readyAt - nowMs()) * (1 - mult)); msg = '工单已加速'; } }
    else if (eff.type === 'orderRefresh'){ if (mult > 0){ genOrders(true); msg = '订单已刷新'; } }
    const delta = Math.max(0, due - (e.granted || 0));                            // 差量口径：只补未发部分
    if (delta > 0) Ledger.transact({ coin: delta, reason: 'ad_' + e.point });
    bumpDaily('ad');   // 日课「看广告」计数：结算单点（含重进补发结算），与到账同刻
    e.granted = due; S.ads.seq = seq; S.ads.applied.push(id);
    S.ads.pending = S.ads.pending.filter(x => x.id !== id);
    markDirty(); Save.save();
    toast(delta > 0 ? ('广告奖励到账：灵石 +' + delta + (mult < 1 ? '（第 ' + seq + ' 次，倍率 ' + mult + '）' : ''))
                    : (msg || '本次广告倍率为 0，无奖励（已达软封顶）'));
    render();
  },
  resumePending(){ // 重进时核对未落定：超时作废；在窗内且已过播放时长则补记完成并结算（差量补发）
    const t = nowMs(); let changed = false;
    for (const e of [...S.ads.pending]){
      if (e.state === 'watching'){
        if (t - e.createdAt > CONFIG.ads.pendingTtlMs){ S.ads.pending = S.ads.pending.filter(x => x.id !== e.id); changed = true; }
        else if (t - e.createdAt >= CONFIG.ads.mockWatchMs){ e.state = 'completed'; changed = true; } } }
    if (changed){ markDirty(); Save.save(); }
    for (const e of [...S.ads.pending]) if (e.state === 'completed') this.settle(e.id);
  },
  watching(){ return S.ads.pending.some(e => e.state === 'watching'); },
};

function resolveOpt(o){ // 把 *ByFlag 字段按当前链 flags 解析成实际 label/note/cost/gain（渲染与结算共用，保证所见即所结算）
  const r = { label: o.label, note: o.note, cost: o.cost, gain: o.gain, attrBoost: o.attrBoost,
              setFlag: o.setFlag, shardsGain: o.shardsGain, treasureDrop: o.treasureDrop };
  if (o.labelByFlag) r.label = chainFlag(o.labelByFlag.flag) ? o.labelByFlag.yes : o.labelByFlag.no;
  if (o.noteByFlag) r.note = chainFlag(o.noteByFlag.flag) ? o.noteByFlag.yes : o.noteByFlag.no;
  if (o.costByFlag) r.cost = chainFlag(o.costByFlag.flag) ? o.costByFlag.yes : o.costByFlag.no;
  if (o.gainByFlag) r.gain = chainFlag(o.gainByFlag.flag) ? o.gainByFlag.yes : o.gainByFlag.no;
  return r; }
function eventByAnyId(id){ return EVENTS.find(e => e.id === id) || CHAIN_EVENTS.find(e => e.id === id); }
function nextChainEvent(){ for (const cid of ['spring', 'bandit']){ const c = S.chain[cid];
    if (c && c.step < 3) return CHAIN_EVENTS.find(e => e.chain === cid && e.step === c.step + 1) || null; } return null; }
function maybeEvent(){ if (S.pendingEvent) return;
  const chance = Math.min(CONFIG.patrolChanceCap, CONFIG.eventChance + CONFIG.patrolBonus * postCount('patrol'));
  if (Math.random() < chance){ const nxt = nextChainEvent();                 // 命中后 60% 优先推进未完事件链，其余走普通池
    S.pendingEvent = (nxt && Math.random() < 0.6) ? nxt.id : pick(EVENTS).id;
    S.eventOpen = false; markDirty(); } }
function chooseEvent(idx){ const ev = eventByAnyId(S.pendingEvent); if (!ev) { S.pendingEvent = null; return; }
  const raw = ev.opts[idx]; if (!raw) return;
  const o = resolveOpt(raw);
  if (o.cost && !Ledger.transact(Object.assign({ reason: 'event' }, txOf(o.cost, -1)))){ toast('家底不够，选不了这一项'); return; }
  if (o.gain) Ledger.transact(Object.assign({ reason: 'event' }, txOf(o.gain, 1)));
  if (o.setFlag) setChainFlag(o.setFlag);
  if (o.shardsGain){ S.treasures.shards += o.shardsGain; floatText('宝物碎片 +' + o.shardsGain); }
  if (o.treasureDrop) grantTreasureFrom(o.treasureDrop);
  if (o.attrBoost && S.disciples.length){ const d = pick(S.disciples);
    d.attrs[o.attrBoost.attr] = clamp((d.attrs[o.attrBoost.attr] || 0) + o.attrBoost.n, 1, 99);
    toast(d.name + ' 的' + o.attrBoost.attr + ' +' + o.attrBoost.n); }
  else if (!o.attrBoost) toast('已定：' + o.label);
  if (ev.chain){ const c = S.chain[ev.chain]; c.step = Math.max(c.step, ev.step);
    if (ev.step >= 3){ S.treasures.shards += 2; toast('这桩连环事了结，拾得宝物碎片 +2'); } }
  else if (Math.random() < CONFIG.treasureDrop.eventShardChance){ S.treasures.shards += 1; toast('事后拾得宝物碎片 +1'); }  // 普通事件掉落（运营口径）
  S.pendingEvent = null; S.eventOpen = false; markDirty(); Save.save(); beep(); render(); }
function txOf(eff, sign){ const tx = {};
  if (eff.coin) tx.coin = eff.coin * sign;
  if (eff.items){ tx.items = {}; for (const k in eff.items) tx.items[k] = eff.items[k] * sign; }
  return tx; }
function canAffordEff(eff){ if (!eff) return true;
  if (eff.coin && (S.balances.coin || 0) < eff.coin) return false;
  for (const k in (eff.items || {})) if ((S.inventory[k] || 0) < eff.items[k]) return false; return true; }

/* ---------------- 掌门日课（厚度批：每日抽 3 件、计数走动作钩子、全完成奖 40；按游戏日刷新，明日预告与明日实抽同源） ---------------- */
function drawDailyTasks(seedStr){ let h = hashStr(seedStr); const pool = CONFIG.dailyTasks.map(t => t.id); const out = [];
  while (out.length < 3 && pool.length){ h = (h * 1103515245 + 12345) >>> 0; out.push(pool.splice(h % pool.length, 1)[0]); } return out; }
function drawDaily2Tasks(seedStr){ let h = hashStr(seedStr); const pool = CONFIG.daily2Tasks.map(t => t.id); const out = [];
  while (out.length < 3 && pool.length){ h = (h * 1103515245 + 12345) >>> 0; out.push(pool.splice(h % pool.length, 1)[0]); } return out; }
function dailyDef(id){ return CONFIG.dailyTasks.find(t => t.id === id); }
function daily2Def(id){ return CONFIG.daily2Tasks.find(t => t.id === id); }
function ensureDaily(){ const k = 'd' + S.day.index;
  if (!S.daily || S.daily.key !== k){ S.daily = { key: k, taskIds: drawDailyTasks(k), progress: {}, claimed: false,
    task2Ids: drawDaily2Tasks(k + 'b'), progress2: {}, claimed2: false }; markDirty(); return; }
  if (!S.daily.task2Ids){ S.daily.task2Ids = drawDaily2Tasks(k + 'b'); S.daily.progress2 = S.daily.progress2 || {}; S.daily.claimed2 = !!S.daily.claimed2; markDirty(); } }
function bumpDaily(hook){ if (!S.daily) return;
  for (const id of S.daily.taskIds){ const t = dailyDef(id); if (!t || t.hook !== hook) continue;
    const cur = S.daily.progress[id] || 0; if (cur < t.target){ S.daily.progress[id] = cur + 1; markDirty(); } }
  for (const id of (S.daily.task2Ids || [])){ const t = daily2Def(id); if (!t || t.hook !== hook) continue;
    const cur = (S.daily.progress2 || {})[id] || 0; if (cur < t.target){ S.daily.progress2[id] = cur + 1; markDirty(); } } }
function dailyAllDone(){ return !!S.daily && S.daily.taskIds.every(id => (S.daily.progress[id] || 0) >= dailyDef(id).target); }
function daily2AllDone(){ return !!S.daily && (S.daily.task2Ids || []).length > 0 &&
  S.daily.task2Ids.every(id => ((S.daily.progress2 || {})[id] || 0) >= daily2Def(id).target); }
function claimDaily(){ if (!dailyAllDone() || S.daily.claimed) return;
  Ledger.transact({ coin: CONFIG.dailyReward, reason: 'daily' }); S.daily.claimed = true;
  toast('日课全完成，奖励 ' + CONFIG.dailyReward + ' 灵石；进阶日课已解锁'); markDirty(); Save.save(); Audio8.play('success'); render(); }
function claimDaily2(){ if (!S.daily.claimed || !daily2AllDone() || S.daily.claimed2) return;
  Ledger.transact({ coin: CONFIG.daily2Reward, reason: 'daily2' }); S.daily.claimed2 = true;
  toast('进阶日课全完成，奖励 ' + CONFIG.daily2Reward + ' 灵石'); markDirty(); Save.save(); Audio8.play('success'); render(); }

/* ---------------- 宗门宝库（厚度批：24 件 4 套；重复/溢出转碎片，碎片 3 换 1；里程碑领灵石） ---------------- */
function treasureById(id){ return CONFIG.treasures.find(t => t.id === id); }
function ownedCount(){ return Object.keys(S.treasures.owned).filter(k => S.treasures.owned[k]).length; }
function grantTreasureFrom(setId){ // 给一件未拥有宝物（可限定套）；该套已满转全池，全满转碎片 ×2
  let pool = CONFIG.treasures.filter(t => !S.treasures.owned[t.id] && (!setId || t.set === setId));
  if (!pool.length && setId) pool = CONFIG.treasures.filter(t => !S.treasures.owned[t.id]);
  if (!pool.length){ S.treasures.shards += 2; toast('宝库已集齐，转得宝物碎片 ×2'); return null; }
  const t = pick(pool); S.treasures.owned[t.id] = true;
  toast('获得宝物：' + t.name + '（' + CONFIG.treasureSets.find(s => s.id === t.set).name + '）'); floatText(t.name);
  return t; }
function exchangeTreasure(id){ const t = treasureById(id); if (!t || S.treasures.owned[id]) return;
  if ((S.treasures.shards || 0) < CONFIG.shardExchangeCost){ toast('碎片不够（需 ' + CONFIG.shardExchangeCost + '）'); return; }
  S.treasures.shards -= CONFIG.shardExchangeCost; S.treasures.owned[id] = true;
  toast('兑换宝物：' + t.name); markDirty(); Save.save(); Audio8.play('success'); render(); }
function claimMilestone(n){ n = Number(n); const reward = CONFIG.treasureMilestones[n]; if (!reward) return;
  if (ownedCount() < n){ toast('收藏还没到 ' + n + ' 件'); return; }
  if (S.treasures.milestones.includes(n)) return;
  S.treasures.milestones.push(n); Ledger.transact({ coin: reward, reason: 'treasure_milestone' });
  toast('宝库里程碑 ' + n + ' 件，奖励 ' + reward + ' 灵石'); markDirty(); Save.save(); Audio8.play('success'); render(); }

/* ---------------- 山下集市·宝匣（厚度批：概率公示、10 匣保底、每日首匣半价） ---------------- */
function rollMarketDay(){ const k = dayKey(); if (S.market.dateKey !== k){ S.market.dateKey = k; S.market.openedToday = 0; markDirty(); } }
function chestPrice(){ rollMarketDay(); return S.market.openedToday === 0 ? CONFIG.market.firstPrice : CONFIG.market.price; }
function openChest(){ const M = CONFIG.market; rollMarketDay();
  const price = S.market.openedToday === 0 ? M.firstPrice : M.price;
  if (!Ledger.transact({ coin: -price, reason: 'chest' })){ toast('开匣需要 ' + price + ' 灵石，家底还不够'); return; }
  S.market.openedToday++; bumpDaily('chest');
  const missing = CONFIG.treasures.filter(t => !S.treasures.owned[t.id]);
  let whole = false;
  if (missing.length){ whole = S.market.pity >= M.pityMax - 1 ? true : Math.random() < M.wholeChance; }  // 第 10 匣保底必出未拥有整件
  if (whole){ const t = pick(missing); S.treasures.owned[t.id] = true; S.market.pity = 0;
    toast((price === M.firstPrice ? '首匣' : '宝匣') + '开出整件宝物：' + t.name + '！'); floatText(t.name); }
  else { S.treasures.shards += M.shardQty; if (missing.length) S.market.pity++;
    toast('宝匣开出宝物碎片 ×' + M.shardQty + (missing.length ? '（保底进度 ' + S.market.pity + '/' + M.pityMax + '）' : '')); }
  markDirty(); Save.save(); Audio8.play('success'); render(); }

/* ---------------- 限时急单（厚度批：每日 1 张，源自 timed 池，30 分钟过期作废，奖励 ×2） ---------------- */
function genRush(){ const k = dayKey();
  if (S.rush && S.rush.dateKey === k){   // 连环急单：第一张交掉后隔 4 小时送到第二张（时长保底批，D2/D3 的中段内容）
    if (S.rush.done && (S.rush.seq || 1) < 2 && S.rush.nextAt && nowMs() >= S.rush.nextAt && !S.rush.secondMade){
      const pool = CONFIG.orders.pools.timed, o = pool[S.day.index % pool.length];
      const eod = new Date(); eod.setHours(24, 0, 0, 0);
      S.rush = { dateKey: k, seq: 2, needs: Object.assign({}, o.needs), baseReward: o.reward, reward: o.reward * 2,
                 expiresAt: eod.getTime(), done: false, expired: false }; markDirty(); }
    return; }
  const pool = CONFIG.orders.pools.timed, o = pool[(S.day.index - 1) % pool.length];
  const eod = new Date(); eod.setHours(24, 0, 0, 0);   // 时长保底批：急单改「当日有效」——回访节奏慢的玩家也吃得到，不再 30 分钟作废
  S.rush = { dateKey: k, seq: 1, needs: Object.assign({}, o.needs), baseReward: o.reward, reward: o.reward * 2,
             expiresAt: eod.getTime(), done: false, expired: false }; markDirty(); }
function deliverRush(){ const r = S.rush; if (!r || r.done) return;
  if (nowMs() > r.expiresAt){ r.expired = true; toast('急单已过期作废'); markDirty(); Save.save(); render(); return; }
  if (!canAffordEff({ items: r.needs })){ toast('货物不够：需 ' + needsText(r.needs)); return; }
  Ledger.transact(Object.assign({ reason: 'rush' }, txOf({ items: r.needs }, -1)));
  Ledger.transact({ coin: r.reward, reason: 'rush' });
  r.done = true; S.stats.orders++; bumpDaily('order');
  if ((r.seq || 1) < 2){ r.nextAt = nowMs() + 4 * 3600 * 1000; toast('急单赶上了！奖励 ' + r.reward + ' 灵石（×2）；约 4 小时后还有一张'); }
  else toast('急单赶上了！奖励 ' + r.reward + ' 灵石（×2）');
  maybeEvent(); markDirty(); Save.save(); beep(); render(); }

/* ---------------- 大宗订单（时长保底批）：每日 1 张常驻大单，当日有效、交掉为止，给全天生产一个总目标 ---------------- */

/* ---------------- 生产：药圃 / 工单 / 订单 ---------------- */
function plantCrop(i, cropId){ const p = S.plots[i]; if (!p || p.cropId) return;
  const crop = CONFIG.crops[cropId]; if (!crop) return;
  if (!Ledger.transact(Object.assign({ reason: 'plant' }, txOf({ items: crop.inputs }, -1)))){ toast('投入不够：需 ' + needsText(crop.inputs)); return; }
  let dur = cropDurationMs(crop);
  // 首收钩子：每档第一块灵芝田首次成熟只要 10 秒，让新玩家半分钟内尝到第一口收获（仅一次，hookFirstCrop 标记后不再触发）
  if (cropId === 'lingzhi' && !S.hookFirstCrop){ dur = 10 * 1000; S.hookFirstCrop = true; }
  p.cropId = cropId; p.plantedAt = nowMs(); p.readyAt = nowMs() + dur;
  S.stats.planted++; markDirty(); Save.save(); beep(); render(); }
/* 掌门运功（竞品落地·学《摸鱼修仙》点击＋自动双轨）：点按催熟全部生长中作物 3 秒，连击飘字，每日 60 次 */
let tapCombo = 0, tapComboTimer = null;
function tapState(){ const k = dayKey(); if (!S.tapBuff) S.tapBuff = { date: k, count: 0 };
  if (S.tapBuff.date !== k){ S.tapBuff.date = k; S.tapBuff.count = 0; } return S.tapBuff; }
function tapRowHtml(){ const t = tapState(), left = Math.max(0, 60 - t.count);
  const growing = S.plots.some(p => p.cropId && p.readyAt > nowMs());
  return '<div class="btnrow"><button class="btn sm" ' + (left > 0 && growing ? '' : 'disabled') +
    ' onclick="tapCultivate()">掌门运功 · 催熟（今日剩 ' + left + ' 次）</button></div>'; }
function tapCultivate(){ const t = tapState(); if (t.count >= 60){ toast('今日运功已达上限，明日再来'); return; }
  const growing = S.plots.filter(p => p.cropId && p.readyAt > nowMs());
  if (!growing.length){ toast('田里暂无生长中的作物'); return; }
  growing.forEach(p => { p.readyAt -= 3000; });
  t.count++; tapCombo++; clearTimeout(tapComboTimer);
  tapComboTimer = setTimeout(() => { tapCombo = 0; }, 2500);
  floatText('运功 ×' + tapCombo + ' · 催熟 -3 秒'); Audio8.play('click');
  markDirty(); }
function harvestPlot(i, silent){ const p = S.plots[i]; if (!p || !p.cropId || nowMs() < p.readyAt) return null;
  const crop = CONFIG.crops[p.cropId];
  Ledger.transact({ items: { [crop.itemId]: crop.yieldQty }, reason: 'harvest' });
  floatText('+' + crop.yieldQty + ' ' + crop.name); Audio8.play('harvest_store');
  p.cropId = null; p.plantedAt = 0; p.readyAt = 0; S.stats.harvested++; bumpDaily('harvest');
  markDirty(); if (!silent){ Save.save(); beep(); render(); } return crop; }
function stationActive(stationId){ return S.jobs.filter(j => j.station === stationId).length; }
function startJob(recipeId){ const r = CONFIG.recipes.find(x => x.id === recipeId); if (!r) return;
  if (r.station === 'mine' && !S.mineUnlocked){ toast('先在宗门页开辟后山矿口'); return; }
  if (stationActive(r.station) >= CONFIG.stations[r.station].maxRunning){ toast(CONFIG.stations[r.station].name + ' 工位已满（2 条）'); return; }

function collectJob(jobId, silent){ const j = S.jobs.find(x => x.id === jobId); if (!j || nowMs() < j.readyAt) return null;

  for (const k in r.outputs) floatText('+' + r.outputs[k] + ' ' + itemName(k)); Audio8.play('harvest_store');

  if (!silent){ Save.save(); beep(); render(); } return r; }
function jobSpeed(jobId){ Ads.request('job_speedup', { type: 'jobSpeed', jobId }); }
function genOrders(force){ if (S.orders.length && !force) return;
  const pool = CONFIG.orders.pools.daily, off = S.ordersBatch % pool.length;

function deliverOrder(uid){ const o = S.orders.find(x => x.uid === uid); if (!o) return;

  if (S.ordersBatchDone >= CONFIG.orders.dailyCount){ S.ordersBatch++; genOrders(true); toast('这一批订单交齐了，已刷新新单');
    // 订单宝箱（厚度批宝物来源）：交满一批开箱，碎片 ×1 必得＋30% 整件（运营口径）

/* ---------------- 弟子：招募 / 派工 / 派遣 ---------------- */
function genDisciple(){ const G = CONFIG.discipleGen;
  let total = 0; for (const q of G.qualities) total += q.w;
  let roll = Math.random() * total, q = G.qualities[0];
  for (const x of G.qualities){ roll -= x.w; if (roll <= 0){ q = x; break; } }
  let name = ''; for (let t = 0; t < 12; t++){ name = pick(G.surnames) + pick(G.givenNames);
    if (!S.disciples.some(d => d.name === name)) break; }
  const attrMin = Math.min(q.max, q.min + 3 * buildingLevel('library'));   // 藏书阁：每级新弟子资质下限 +3（生成时定格）
  const attrs = {}; for (const a of G.attrNames) attrs[a] = randInt(attrMin, q.max);
  const fate = pick(G.fates);
  let origin = pick(G.originOpenings) + '，' + pick(G.originBridges) + '，' + pick(G.originEndings) + '。';
  if (Math.random() < 0.08) origin += '别看此人' + pick(['身形魁梧','个子小小','嗓门洪亮','走路带风']) + '，偏偏' +
    pick(['心细如发','胆子极小','嗜睡如命','慢条斯理']) + '，全宗门都拿这事打趣。';
  const nid = 'd' + nowMs().toString(36) + Math.floor(Math.random() * 9999);
  return { id: nid, name, quality: q.name, attrs, avatarIdx: hashStr(nid) % 6,
           fate: fate.name, fateDesc: fate.desc, personality: pick(G.personalities), origin,
           robe: pick(G.robes), post: null, dispatch: null, exp: 0, stage: 0 }; }
function recruit(){ const G = CONFIG.discipleGen;
  if (S.disciples.length >= G.rosterCap){ toast('名册已满（' + G.rosterCap + ' 人），先扩建弟子居舍再说'); return; }
  if (!Ledger.transact({ coin: -G.recruitCost, reason: 'recruit' })){ toast('招募需要 ' + G.recruitCost + ' 灵石，家底还不够'); return; }
  const d = genDisciple(); S.disciples.push(d);
  S.codex.qualities[d.quality] = true; S.codex.fates[d.fate] = true; S.stats.recruited++; bumpDaily('recruit');
  toast(d.name + ' 入山门（' + d.quality + '）'); markDirty(); Save.save(); Audio8.play('success'); render(); }
function setPost(id, post){ const d = S.disciples.find(x => x.id === id); if (!d || d.dispatch) return;
  d.post = (d.post === post) ? null : post; if (d.post){ S.stats.assigned++; bumpDaily('assign'); }
  markDirty(); Save.save(); beep(); render(); }
function startDispatch(id, destId){ const d = S.disciples.find(x => x.id === id); if (!d || d.dispatch) return;
  const dest = CONFIG.dispatch.dests.find(x => x.id === destId); if (!dest) return;
  d.dispatch = { destId, backAt: nowMs() + CONFIG.tiers[4].durationMs }; d.post = null;
  markDirty(); Save.save(); beep(); render(); }
function claimDispatch(id, silent){ const d = S.disciples.find(x => x.id === id);
  if (!d || !d.dispatch || nowMs() < d.dispatch.backAt) return null;
  const dest = CONFIG.dispatch.dests.find(x => x.id === d.dispatch.destId); if (!dest) return null;
  Ledger.transact({ items: { [dest.item]: dest.qty }, reason: 'dispatch' });
  floatText('+' + dest.qty + ' ' + itemName(dest.item)); Audio8.play('harvest_store');
  // 派遣带回宝物（厚度批来源，运营口径）：5% 整件，否则 25% 碎片 ×1
  const droll = Math.random();
  if (droll < CONFIG.treasureDrop.dispatchWholeChance) grantTreasureFrom(null);
  else if (droll < CONFIG.treasureDrop.dispatchWholeChance + CONFIG.treasureDrop.dispatchShardChance){ S.treasures.shards += 1; floatText('宝物碎片 +1'); }
  d.dispatch = null; S.stats.dispatches++; bumpDaily('dispatchBack'); markDirty();
  if (!silent){ Save.save(); beep(); render(); } return dest; }

/* ---------------- 宗门：扩建 / 晋阶 / 功法 / 签到 / 过天 ---------------- */
function doUpgrade(bid){ const b = S.buildings.find(x => x.id === bid); if (!b) return;
  const cost = (CONFIG.upgrades[bid] || {})[b.level + 1]; if (!cost) { toast('已满级'); return; }
  if (!Ledger.canAfford(cost)){ toast('还差：' + costText(cost)); return; }
  Ledger.transact(Object.assign({ reason: 'upgrade' }, txOf(cost, -1)));
  b.level++; recomputeDegree(); S.stats.upgrades++; bumpDaily('upgrade');
  if (bid === 'hall'){ const cap = CONFIG.plotCount + 2 * (b.level - 1);   // 大殿扩建：药田 +2 块（时长保底批）
    while (S.plots.length < cap) S.plots.push({ cropId: null, plantedAt: 0, readyAt: 0 });
    floatText('药田 +2 块'); }
  floatText('+10 建设度'); toast(b.name + ' 升至 ' + b.level + ' 级，建设度 ' + S.sect.buildDegree);
  markDirty(); Save.save(); Audio8.play('success'); render(); }
function unlockMine(){ const cost = CONFIG.upgrades.mineUnlock;
  if (S.mineUnlocked) return;
  if (!Ledger.canAfford(cost)){ toast('还差：' + costText(cost)); return; }
  Ledger.transact(Object.assign({ reason: 'mine_unlock' }, txOf(cost, -1)));
  S.mineUnlocked = true; recomputeDegree(); S.stats.upgrades++; bumpDaily('upgrade');
  floatText('+15 建设度'); toast('后山矿口已开辟，矿脉工位可用');
  markDirty(); Save.save(); Audio8.play('success'); render(); }
function nextRankDef(){ return CONFIG.ranks[S.sect.rank + 1] || null; }
function canPromote(){ const n = nextRankDef(); return !!n && S.sect.buildDegree >= n.need; }
function doPromote(){ if (!canPromote()){ toast('建设度还不够晋阶'); return; }
  const firstEver = S.sect.rank === 0;
  S.sect.rank++; const reward = CONFIG.promoteRewardBase * (S.sect.rank + 1); // 礼金＝50 × 新品级序（index+1）
  Ledger.transact({ coin: reward, reason: 'promote' });
  if (firstEver) Ledger.transact({ items: { mine_charm: CONFIG.openingGiftMineCharmOnPromote }, reason: 'promote_gift' });
  S.promoteInfo = { reward, doubled: false, at: nowMs() };
  toast('晋阶！' + S.sect.name + ' 已是「' + CONFIG.ranks[S.sect.rank].name + '」，礼金 ' + reward + ' 灵石' + (firstEver ? '，另赠矿引 ×1' : ''));
  markDirty(); Save.save(); Audio8.play('success'); render(); }
function promoteDoubleAd(){ if (!S.promoteInfo || S.promoteInfo.doubled){ toast('这次晋阶的双倍已用过'); return; }
  Ads.request('promote_double', { type: 'promoteDouble' }); }
function doTechnique(){ const T = CONFIG.technique, lv = S.technique.level;
  if (lv >= T.maxLevel){ toast('聚灵诀已至顶层'); return; }
  const cost = T.costs[lv];
  if (!Ledger.transact({ coin: -cost, reason: 'technique' })){ toast('参悟需要 ' + cost + ' 灵石'); return; }
  S.technique.level++; S.stats.upgrades++; bumpDaily('upgrade');
  floatText('产率 +' + Math.round(T.perLevel * 100) + '%');
  toast('聚灵诀升至 ' + S.technique.level + ' 层，全产率 ×' + techMul().toFixed(1));
  markDirty(); Save.save(); Audio8.play('success'); render(); }
function canSignIn(){ return S.routine.signIn.lastDate !== dayKey(); }
function signInReward(){ return CONFIG.routine.signInRewards[Math.min(S.routine.signIn.total, CONFIG.routine.signInRewards.length - 1)]; }
function doSignIn(silent){ if (!canSignIn()){ if (!silent) toast('今日已签到，明日再来'); return 0; }
  const r = signInReward(); Ledger.transact({ coin: r, reason: 'signin' });
  S.routine.signIn.total++; S.routine.signIn.lastDate = dayKey();
  if (S.routine.signIn.total === 7){ S.treasures.shards += 2; toast('累计签到第 7 天大奖：宝物碎片 ×2'); floatText('宝物碎片 +2'); }  // 七日签到大奖（厚度批，签到阶梯原样不动）
  markDirty();
  if (!silent){ Save.save(); beep(); render(); } return r; }
/* 弟子指点（时长保底批）：每名弟子每个真实日可指点 1 次，历练 +12、10% 掉宝物碎片；给每日一份与人数挂钩的固定互动量 */
const ADVISE_LINES = ['手把手教了一遍，眼睛都亮了些。', '挑出两处错漏，若有所思地点头。', '今日这一课，记性好的话能受用半月。',
  '练得满头是汗，嘴上说还想再来一遍。', '一点就透，掌门心里暗暗点头。', '挨了两句训，反倒练得更起劲了。'];
function adviseDisciple(id){ const d = S.disciples.find(x => x.id === id); if (!d || d.dispatch) return;
  if (d.adviseDate === dayKey()){ toast('今日已经指点过，明日再来'); return; }
  d.adviseDate = dayKey();
  d.stage = d.stage || 0; d.exp = d.exp || 0;
  if (d.stage < CONFIG.discipleExp.maxStage){ d.exp += 12;
    while (d.exp >= CONFIG.discipleExp.need && d.stage < CONFIG.discipleExp.maxStage){ d.exp -= CONFIG.discipleExp.need; d.stage++; toast(d.name + ' 升至 ' + d.stage + ' 阶'); }
    if (d.stage >= CONFIG.discipleExp.maxStage) d.exp = CONFIG.discipleExp.need; }
  if (Math.random() < 0.1){ S.treasures.shards += 1; floatText('宝物碎片 +1'); }
  const line = ADVISE_LINES[Math.abs(hashStr(d.id + dayKey())) % ADVISE_LINES.length];
  toast('指点「' + d.name + '」：历练 +12。' + line);
  markDirty(); Save.save(); Audio8.play('success'); render(); }
function doSleep(){ if (!armed('sleep')){ toast('再点一次确认歇息过天'); return; }
  const report = '第 ' + S.day.index + ' 天入账 ' + S.stats.todayEarned + ' 灵石 · 在册弟子 ' + S.disciples.length + ' 人 · 建设度 ' + S.sect.buildDegree;
  // 弟子历练过天结算（厚度批）：在岗（有岗位、未派遣）弟子得历练 ＝ 34 × 引气诀倍率取整，满 100 升阶（上限 5 阶，满阶停在 100）
  const gain = Math.round(CONFIG.discipleExp.perDay * expMul()); const ups = [];
  for (const d of S.disciples){ if (!d.post || d.dispatch) continue;
    d.stage = d.stage || 0; d.exp = d.exp || 0;
    if (d.stage >= CONFIG.discipleExp.maxStage){ d.exp = CONFIG.discipleExp.need; continue; }
    d.exp += gain;
    while (d.exp >= CONFIG.discipleExp.need && d.stage < CONFIG.discipleExp.maxStage){ d.exp -= CONFIG.discipleExp.need; d.stage++; ups.push(d.name + ' 升至 ' + d.stage + ' 阶'); }
    if (d.stage >= CONFIG.discipleExp.maxStage) d.exp = CONFIG.discipleExp.need; }
  if (ups.length) toast('历练精进：' + ups.join('、'));
  S.lastReport = report; S.day.index++; S.stats.todayEarned = 0; S.stats.todayKey = dayKey();
  ensureDaily();   // 过天刷新日课（新游戏日重抽 3 件）
  maybeEvent(); markDirty(); Save.save(); Audio8.play('morning_bell'); render(); }

/* ---------------- 一键全收（逐项走原领取函数与幂等，不绕过） ---------------- */
function collectSummary(){ const t = nowMs();
  return { offline: S.pendingSettlement ? S.pendingSettlement.amount : 0,
    plots: S.plots.filter(p => p.cropId && t >= p.readyAt).length,
    jobs: S.jobs.filter(j => t >= j.readyAt).length,
    dispatch: S.disciples.filter(d => d.dispatch && t >= d.dispatch.backAt).length,
    signin: canSignIn() ? signInReward() : 0 }; }
function collectCount(c){ return (c.offline ? 1 : 0) + c.plots + c.jobs + c.dispatch + (c.signin ? 1 : 0); }
function claimAll(){ const c = collectSummary(); if (!collectCount(c)){ toast('暂无可领取的'); return; }
  if (S.pendingSettlement) Offline.claim(false);                       // 待领结算：走 Offline.claim（digest 幂等）
  S.plots.forEach((p, i) => { if (p.cropId && nowMs() >= p.readyAt) harvestPlot(i, true); });
  [...S.jobs].forEach(j => { if (nowMs() >= j.readyAt) collectJob(j.id, true); });
  S.disciples.forEach(d => { if (d.dispatch && nowMs() >= d.dispatch.backAt) claimDispatch(d.id, true); });
  if (canSignIn()) doSignIn(true);                                     // 签到：走 doSignIn（自然日校验）
  markDirty(); Save.save(); beep(); toast('一键全收完成'); render(); }

/* ---------------- 两段确认（高后果按钮共用） ---------------- */
const __armed = {};
function armed(key){ const t = nowMs();
  if (__armed[key] && t - __armed[key] < 3500){ delete __armed[key]; return true; }
  __armed[key] = t; setTimeout(render, 3600); render(); return false; }
function armLabel(key, label){ return (__armed[key] && nowMs() - __armed[key] < 3500) ? '确认？' : label; }
function armCls(key){ return (__armed[key] && nowMs() - __armed[key] < 3500) ? 'btn sm arm' : 'btn sm'; }
function armBtn(key, label){ return (__armed[key] && nowMs() - __armed[key] < 3500) ? 'btn arm' : 'btn'; }

/* 进入某档位：先把当前主档自动备份到恢复槽，两段确认后载入并把活动槽切换过去 */
function enterSlot(i){
  if (!armed('slotIn' + i)){ toast('再点一次确认进入档位 ' + i + '（当前进度会先自动备份到恢复槽）'); return; }
  if (S.sect.started) Save.writeSlot(CONFIG.save.restoreKey);
  const s = normalizeState(Save.loadRaw(CONFIG.save.slotPrefix + i));
  if (!s || !s.sect.started){ toast('档位 ' + i + ' 没有有效存档'); return; }
  s.meta.activeSlot = i; S = s; newGameSlot = null; markDirty(); Save.save();
  toast('已进入档位 ' + i); passGate(); go('home');

  if (!armed('slotAsg' + i)){ toast('再点一次确认归入档位 ' + i + '（会覆盖该槽原存档）'); return; }

function delSlotGate(i){
  if (!armed('slotDel' + i)){ toast('再点一次确认删除档位 ' + i); return; }
  try { localStorage.removeItem(CONFIG.save.slotPrefix + i); } catch (e) {}
  if (S.meta.activeSlot === i){ S.meta.activeSlot = null; markDirty(); Save.save(); }
  toast('已删除档位 ' + i); render();
}
function startSect(){
  const name = ($('inSect').value || '').trim() || '青云宗';
  const master = ($('inMaster').value || '').trim() || '掌门';
  S.sect.name = name.slice(0, 8); S.sect.masterName = master.slice(0, 6); S.sect.started = true;
  /* 落槽：指定了新宗槽位用它，否则沿用当前归属；无归属时默认 1 号槽，
     但 1 号槽已被别的进度占用就顺延找第一个空槽，全满则先不归槽（开始页可手动归入），绝不静默覆盖 */
  if (newGameSlot){ S.meta.activeSlot = newGameSlot; newGameSlot = null; }
  else if (!S.meta.activeSlot){ S.meta.activeSlot = null;
    for (let i = 1; i <= CONFIG.save.slots; i++)
      if (!localStorage.getItem(CONFIG.save.slotPrefix + i)){ S.meta.activeSlot = i; break; } }
  recomputeDegree();
  const tgRec = Guide.peek(); if (tgRec && (tgRec.done || tgRec.skipped)) S.meta.guideDone = true;   // 引导已完成/跳过 → 开宗即同步标记（Guide 定义在下方，运行时调用无碍）
  Ledger.transact({ coin: CONFIG.startGiftCoin, reason: 'opening_gift' });
  genOrders(true); ensureDaily(); genRush(); markDirty(); Save.save();
  naming = false; ceremony = true;                    // 开宗大典幕：封面图全屏一幕，点「进入宗门」才落到总览（引导此时让行）
  beep(); passGate(); go('home');
}

function addToDesktop(){ // 平台唯一召回口子（2026-11-13 主人批四款统一加）：只许玩家点击按钮时调用，禁自动触发/代点。

  // bridgeResult.result===false 展示 errorMsg（空则默认文案）；安卓 result===true 提示已添加，其他平台成功静默；回调为空静默。

    toast('请在虎扑 App 内打开本游戏，再用这个按钮添加桌面快捷方式'); return; }
  window.ColorboxAI.addToDesktop().then(res => {
    if (!res || res.code !== 200){ toast((res && res.message) || '添加到桌面失败，请稍后重试'); return; }
    const data = res.data || {};
    if (data.platform === 'android' && data.alreadyAdded === true){ toast('已添加过，请勿重复添加'); return; }
    const cb = data.bridgeResult;
    if (cb && cb.result === false) toast(cb.errorMsg || '添加到桌面失败，请稍后重试');
    else if (data.platform === 'android' && cb && cb.result === true) toast('已添加');
  }).catch(() => { toast('添加到桌面失败，请稍后重试'); }); }

let codeDraft = '';
function genLongCode(){
  let str = null, label = '当前进度';
  if (codeSlotChoice === 'cur'){ Save.save(); str = JSON.stringify(S); }
  else { const rawStr = localStorage.getItem(CONFIG.save.slotPrefix + codeSlotChoice);
    if (!rawStr){ $('longMsg').textContent = '档位 ' + codeSlotChoice + ' 是空的，没有可导出的存档。'; return; }
    str = rawStr; label = '档位 ' + codeSlotChoice; }
  const b64 = btoa(unescape(encodeURIComponent(str)));
  codeDraft = b64; $('longCode').value = b64; $('longMsg').textContent = label + '的长码已生成（' + b64.length + ' 字符），请全选复制、自行保存。'; }
function importLongCode(){ const domV = ($('longCode') && $('longCode').value) || ''; if (domV) codeDraft = domV;   // 先同步暂存，防两段确认的 render 清空输入框
  const v = (codeDraft || '').trim(); if (!v){ $('longMsg').textContent = '先把长码粘贴到框里。'; return; }
  if (!armed('import')){ toast('再点一次确认导入（目标槽旧内容会先进恢复槽备份）'); return; }
  let parsed = null; try { parsed = JSON.parse(decodeURIComponent(escape(atob(v.replace(/\s+/g, ''))))); } catch (e) {}
  const s = parsed && normalizeState(parsed);
  if (!s){ $('longMsg').textContent = '导入失败：长码校验不通过，未覆盖任何存档。'; return; }
  if (codeSlotChoice === 'cur'){           // 导入当前进度：旧进度进恢复槽；归属沿用本机当前档位，不跟随码里的旧归属

    toast('长码导入成功'); go('home'); return; }
  const i = Number(codeSlotChoice), key = CONFIG.save.slotPrefix + i;
  const oldRaw = localStorage.getItem(key);
  if (oldRaw){ try { localStorage.setItem(CONFIG.save.restoreKey, oldRaw); } catch (e) {} }   // 该槽旧内容先进恢复槽
  s.meta.activeSlot = i;
  try { localStorage.setItem(key, JSON.stringify(s)); } catch (e) { $('longMsg').textContent = '导入失败：存储空间不足。'; return; }
  if (S.meta.activeSlot === i){ S = s; markDirty(); Save.save(); toast('已导入档位 ' + i + '，当前进度已同步刷新'); go('home'); }
  else { $('longMsg').textContent = '已导入到档位 ' + i + '（当前进度未动；到开始页或上方读取该槽即可游玩）。'; render(); } }

  enabled(){ return !!this.shell() || !!this.base(); },
  /* 统一请求：8 秒超时；失败优先解析后端 {code,message} 把 message 交回调用方展示 */
  async call(path, bodyObj){
    const sh = this.shell();
    if (sh){
      try {
        const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 8000));
        /* 平台官方调用形态（act-cloudbase 技能包示例原文）：cloud.request({ url: 网关域名＋路由, method, data, envId })；
           只给 path 会被 SDK 拒「Missing parameter: url is required」（2026-11-12 预览实测，非预览伪影） */
        const req = { url: CONFIG.vault.shellBase + path, method: 'POST', data: bodyObj || {} };
        if (CONFIG.vault.shellEnvId) req.envId = CONFIG.vault.shellEnvId;
        const r = await Promise.race([sh.request(req), timeout]);
        if (r && typeof r.statusCode === 'number' && r.statusCode !== 200)
          return { ok: false, message: r.message || '云端返回异常，请稍后再试或改用长码' };
        if (r && ('code' in r)){                                  // 信封形态（业务码数字、网关错误码可能是字符串；成功码 0 与 200 都认）
          if (String(r.code) !== '0' && String(r.code) !== '200') return { ok: false, message: r.message || '云端返回异常' };
          return { ok: true, data: r.data || {} };
        }
        const d = (r && r.data) || null;                          // SDK 已解信封形态：r.data 即业务数据
        if (!d) return { ok: false, message: (r && r.message) || '云端返回异常' };
        return { ok: true, data: d };
      } catch (e) { return { ok: false, message: e && e.message === 'timeout' ? '云端请求超时，请改用长码' : ((e && e.message) || '云端请求失败，请改用长码') }; }
    }
    const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 8000);
    try { const res = await fetch(this.base() + path, { method: 'POST', signal: ctl.signal,
        headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(bodyObj || {}) });
      let env = null; try { env = await res.json(); } catch (e) {}
      if (!res.ok || !env || env.code !== 0)
        return { ok: false, message: (env && env.message) ? env.message : '云端返回异常，请稍后再试或改用长码' };
      return { ok: true, data: env.data || {} };
    } catch (e) { return { ok: false, message: e && e.name === 'AbortError' ? '云端请求超时，请改用长码' : '网络不通，请改用长码' }; }
    finally { clearTimeout(timer); }
  },
  payloadStr(){ Save.save(); return JSON.stringify(S); },
  async put(){
    if (!this.enabled()){ vaultUi.outHtml = '云端通道还没开通，先用下方长码换设备。'; render(); return; }
    const payload = this.payloadStr();
    const bytes = new Blob([payload]).size;
    if (bytes > 256 * 1024){ vaultUi.outHtml = '存档已 ' + Math.ceil(bytes / 1024) + ' KB，超过短码上限 256 KB，请改用下方长码。'; render(); return; }
    vaultUi.outHtml = '正在生成短码…'; render();
    const r = await this.call('/api/kzvault/put', { payload });
    if (!r.ok){ vaultUi.outHtml = '生成失败：' + esc(r.message) + '。可以再试一次，还不行就用下方长码。'; render(); return; }
    const code = String(r.data.shortCode || '').toUpperCase();
    if (!code){ vaultUi.outHtml = '生成失败：云端没有返回短码，请改用下方长码。'; render(); return; }
    vaultUi.outHtml = '你的云端短码：<b style="font-size:19px;letter-spacing:2px">KZ-' + esc(code) + '</b>' +
      '<br><span class="small">换设备时在设置页输入此码取档（带不带 KZ- 前缀都可以）。请自行抄好，短码不另存本机。</span>';
    render();
  },
  async get(){
    if (!this.enabled()){ vaultUi.msg = '云端通道还没开通，先用下方长码换设备。'; render(); return; }
    let code = (vaultUi.code || '').trim().toUpperCase().replace(/\s+/g, '');
    if (code.indexOf('KZ-') === 0) code = code.slice(3);       // 玩家带前缀输入时先剥掉再发
    if (!code){ vaultUi.msg = '先输入短码再取档。'; render(); return; }
    vaultUi.msg = '正在取档…'; render();
    const r = await this.call('/api/kzvault/get', { code });
    if (!r.ok){ vaultUi.msg = '取档失败：' + r.message + '（当前进度未动）'; render(); return; }
    let parsed = null; try { parsed = JSON.parse(r.data.payload || ''); } catch (e) {}
    const s = parsed && normalizeState(parsed);
    if (!s){ vaultUi.msg = '取档失败：云端存档校验不通过，已放弃覆盖（当前进度未动）。'; render(); return; }
    Save.writeSlot(CONFIG.save.restoreKey);                    // 覆盖前自动把当前档存入恢复槽
    s.meta.activeSlot = S.meta.activeSlot;                      // 归属沿用本机当前档位（短码协议口径不变）
    S = s; markDirty(); Save.save();
    vaultUi.msg = '取档成功，已载入云端存档；覆盖前的进度已存入恢复槽，可在下方找回。';
    toast('云端存档已载入'); render();
  },
};

/* ================= 新手引导（形态照联赛 v58/v59 定版） =================
 * 底部讲解台 fixed 停靠底部同一位置（bottom 52px、height 138px 写死，rect 全程恒定），永不移动；
 * 引导期页面加底部滚动留白（body.guiding main），目标可完整滚到讲解台上方；高亮圈独立元素、每 tick 按目标 rect 追踪；
 * 讲解只落在真实界面的真实控件上。动作步没有「下一步」，只认真实操作推进（done 谓词轮询＋目标点击命中双保险）；
 * 信息步才有「下一步」。玩家切错页：讲解台改提示回页、高亮改指对应页签，回页自动恢复本步。
 * 进度存独立 key kaizongmen_tguide（未开宗阶段也存）；完成/跳过后同步 meta.guideDone，永不再触发。
 * 仅全新访客触发：本地已有文本版主档/任一槽位存档且无进行中 tguide → 老玩家，写 veteran 标记零打扰（行走版旧档不算数）。
 * 讲解台 z-index 15（低于 toast 20/飘字 30），高亮圈 pointer-events:none、不遮挡目标点击。 */
let gClicked = false;   // 当前动作步的目标点击命中标记（advance 时清零）
const GUIDE_TOTAL = 13;
const GUIDE_STEPS = [
  { title: '开宗立派', phases: [{ ctx: 'setup', sel: '#inSect', type: 'info',
      text: '点按钮做经营决策的宗门经营游戏：种田、收徒、扩建、晋阶，离线也在长。先给宗门起个名字（用默认的也行）。',
      skipIf: () => S.sect.started }] },   // 已开宗（设置页重看时）自动跳过本步
  { title: '开宗', phases: [{ ctx: 'setup', sel: '#btnStart', type: 'action',
      text: '点「开宗立派」：领 100 灵石开宗礼金，从今天起，你说了算。', done: () => S.sect.started }] },
  { title: '资源条', phases: [{ ctx: 'home', sel: '#hdr', type: 'info',
      text: '顶部是你的家底：灵石、材料、弟子数都看这里；带红字的「可领取」是有东西能领了。' }] },
  { title: '今日清单', phases: [{ ctx: 'home', sel: '#cardCollect', type: 'info',
      text: '总览第一张卡是今日清单：能领的都汇在这——离线结算、成熟作物、签到，一键全收全领掉。' }] },
  { title: '去生产', phases: [{ ctx: 'any', sel: '[data-tab="prod"]', type: 'action',
      text: '点底部「生产」页签，去看看你的药圃。', done: () => tab === 'prod' }] },
  { title: '种第一块田', phases: [{ ctx: 'prod', sel: '#btnFirstPlant', type: 'action',
      text: '在第一块田点「灵芝」种下。新手首块田只要 10 秒就成熟。', done: () => S.stats.planted > 0 }] },
  { title: '等它长', phases: [{ ctx: 'prod', sel: '#plot0', type: 'info',
      text: '田里开始倒计时了。把弟子派到药圃岗、参悟功法，都能让作物长得更快。',
      skipIf: () => !S.plots[0].cropId || nowMs() >= S.plots[0].readyAt }] },
  { title: '回收菜', phases: [{ ctx: 'any', sel: '[data-tab="home"]', type: 'action',
      text: '回底部「总览」页签，把刚熟的灵芝收掉。', done: () => tab === 'home' }] },
  { title: '一键全收', phases: [{ ctx: 'home', sel: '#btnClaimAll', altSel: '#cardCollect', type: 'action', dyn: true,
      text: '点「一键全收」，刚熟的灵芝就进仓库了。',
      infoText: '可领的都已经领完了：以后离线结算、成熟作物、签到都汇在这张卡，点「一键全收」一次全领。',
      done: () => gClicked || collectCount(collectSummary()) === 0 }] },
  { title: '招募弟子', phases: [
      { ctx: 'any', sel: '[data-tab="disc"]', type: 'action', text: '去底部「弟子」页签看看。', done: () => tab === 'disc' },
      { ctx: 'disc', sel: '#cardRecruit', type: 'info',
        text: '50 灵石招一名弟子，品质概率明写在卡上。招来别闲着——给他派个岗位才有产出。' }] },
  { title: '宗门页', phases: [{ ctx: 'any', sel: '[data-tab="sect"]', type: 'info',
      text: '「宗门」页是长线：顶部小栏目切换——「建设」里扩建与功法，「宝库」里宝匣、宝库与签到。' }] },
  { title: '掌门日课', phases: [
      { ctx: 'any', sel: '[data-tab="home"]', type: 'action', text: '回底部「总览」页签，看今天的日课。', done: () => tab === 'home' },
      { ctx: 'home', sel: '#dailyBlock', altSel: '#cardCollect', type: 'info',
        text: '掌门日课：每天三件事，全清奖 40 灵石；卡片下方还有明日预告，今晚就知道明天干什么。' }] },
  { title: '过天与存档', phases: [{ ctx: 'home', sel: '#btnSleep', type: 'info',
      text: '点「歇息 · 过天」结束一天，会出昨日简报。存档在底部「设置」页：五槽、长码、云端短码都在那。点「完成」，开宗大吉。' }] },
];
/* 引导锚点所在的子栏目（分栏后）：目标不在当前子栏目时，tick 自动切过去，绝不指不存在的控件 */
const GUIDE_SUB = { '#cardCollect': 'today', '#btnClaimAll': 'today', '#dailyBlock': 'today', '#btnSleep': 'today',
                    '#btnFirstPlant': 'farm', '#plot0': 'farm', '#cardRecruit': 'roster' };
const Guide = {
  KEY: 'kaizongmen_tguide', st: null, active: false, timer: null, _sig: '', _lastScroll: 0, _dynMode: null,
  followSub(){ const ph = this.phase(); if (!ph || !ph.sel || this.wrongPage()) return;
    if (document.querySelector(ph.sel)) return;
    const want = GUIDE_SUB[ph.sel], page = ph.ctx;
    if (want && sub[page] && sub[page] !== want){ sub[page] = want; render(); } },
  peek(){ try { const r = localStorage.getItem(this.KEY); return r ? JSON.parse(r) : null; } catch (e) { return null; } },
  saveSt(){ try { if (this.st) localStorage.setItem(this.KEY, JSON.stringify(this.st)); } catch (e) {} },
  stepDef(){ return GUIDE_STEPS[(this.st ? this.st.step : 1) - 1] || null; },
  phase(){ const s = this.stepDef(); if (!s) return null; return s.phases[Math.min(this.st.phase || 0, s.phases.length - 1)]; },
  context(){ if (!S.sect.started || (atGate && (S.sect.started || slotSaveExists()))) return 'setup'; return tab; },
  wrongPage(){ const ph = this.phase(); if (!ph || !ph.ctx || ph.ctx === 'any') return false; return this.context() !== ph.ctx; },
  phaseType(ph){ if (!ph.dyn) return ph.type;   // 第 9 步 dyn：模式在进入本步时快照定型——进来有「一键全收」按钮＝动作步（领完按钮消失也按动作步判 done，不翻降级）；进来就没按钮才降级信息步
    if (this._dynMode == null) this._dynMode = document.querySelector(ph.sel) ? 'action' : 'info';
    return this._dynMode; },
  init(){
    const tg = this.peek();
    if (S.meta.guideDone || (tg && (tg.done || tg.skipped))){ this.active = false; return; }
    if (tg && tg.step >= 1 && tg.step <= GUIDE_TOTAL && !tg.done){ this.st = tg; this.st.phase = tg.phase || 0; this.start(); return; }
    const hasSave = S.sect.started || !!Save.loadRaw(CONFIG.save.autoKey) || slotSaveExists();
    /* 老玩家判定只认文本版存档：行走版是另一个形态，其旧档不算数（2026-11-12 主人真机反馈：留有行走版档被误判老玩家、引导永不触发） */
    if (hasSave){ this.st = { step: GUIDE_TOTAL, phase: 0, done: true, veteran: true }; this.saveSt(); this.active = false; return; }
    this.st = { step: 1, phase: 0, done: false }; this.saveSt(); this.start();
  },
  start(){ this.active = true; gClicked = false; this._dynMode = null; document.body.classList.add('guiding');
    $('gDesk').style.display = 'flex'; this.timer = setInterval(() => this.tick(), 200); this.tick(); },
  stop(){ this.active = false; if (this.timer) clearInterval(this.timer); this.timer = null;
    const d = $('gDesk'); if (d) d.style.display = 'none'; const r = $('gRing'); if (r) r.style.display = 'none';
    document.body.classList.remove('guiding'); },
  advance(){ const s = this.stepDef(); if (!s){ this.finish(false); return; }
    gClicked = false; this._dynMode = null;
    if (this.st.phase < s.phases.length - 1) this.st.phase++;
    else { this.st.step++; this.st.phase = 0; }
    this._sig = ''; this.saveSt();
    if (this.st.step > GUIDE_TOTAL) this.finish(false); },
  next(){ if (!this.active || this.wrongPage()) return; const ph = this.phase(); if (!ph) return;
    if (this.phaseType(ph) !== 'info') return; this.advance(); this.tick(); },
  finish(skipped){ if (this.st){ this.st.done = true; if (skipped) this.st.skipped = true; this.saveSt(); }
    if (S.sect.started && !S.meta.guideDone){ S.meta.guideDone = true; markDirty(); Save.save(); }
    this.stop(); if (!skipped) toast('引导完成，宗门交给你了'); },
  yielding(){ return !!((S.pendingEvent && S.eventOpen) || ceremony || (atGate && !naming)); },   // 让行：事件抉择展开、开宗大典幕在场、或还在开始页选档（没进起名）时，讲解台与高亮圈隐藏、不推进，条件结束自动接回原步
  replay(){ if (!S.sect.started) return;   // 设置页「重看新手引导」：从第 1 步重走（已开宗的 1–2 步自动跳过），走完/跳过后完成标记自动恢复（finish 恒置 done）
    this.st = { step: 1, phase: 0, done: false, replay: true }; this.saveSt();
    this._sig = ''; this._dynMode = null; gClicked = false;
    if (!this.active) this.start(); else this.tick(); },
  tick(){ if (!this.active) return;
    if (this.yielding()){ const d = $('gDesk'); if (d) d.style.display = 'none';
      const r = $('gRing'); if (r) r.style.display = 'none'; this._yielded = true; return; }
    if (this._yielded){ this._yielded = false; this._sig = '';
      const d = $('gDesk'); if (d) d.style.display = 'flex'; }
    let guard = 0;
    while (guard++ < 24){ const ph = this.phase(); if (!ph) break;
      if (ph.skipIf && ph.skipIf()){ this.advance(); if (!this.active) return; continue; }
      if (this.phaseType(ph) === 'action' && ph.done && ph.done()){ this.advance(); if (!this.active) return; continue; }
      break; }
    this.followSub();
    this.paint(); this.positionRing(); },
  paint(){ const ph = this.phase(); if (!ph || !$('gDesk')) return;
    const wrong = this.wrongPage(), type = this.phaseType(ph);
    const sig = this.st.step + '|' + this.st.phase + '|' + (wrong ? 1 : 0) + '|' + type;
    if (sig === this._sig) return; this._sig = sig;
    const s = this.stepDef();
    $('gTitle').textContent = '第 ' + this.st.step + '/' + GUIDE_TOTAL + ' 步 · ' + s.title;
    let dots = ''; for (let i = 1; i <= GUIDE_TOTAL; i++)
      dots += '<span class="gDot' + (i < this.st.step ? ' done' : i === this.st.step ? ' on' : '') + '"></span>';
    $('gDots').innerHTML = dots;
    const TABNAMES = { home: '总览', prod: '生产', disc: '弟子', sect: '宗门', set: '设置' };
    if (wrong){ $('gText').textContent = '这一步不在当前页。点底部「' + (TABNAMES[ph.ctx] || '') + '」页签回去，讲解接着来。';
      $('gHint').textContent = '讲解台在这儿等你'; }
    else { $('gText').textContent = (ph.dyn && type === 'info') ? ph.infoText : ph.text;
      $('gHint').textContent = type === 'action' ? '完成上面的操作，自动继续' : ''; }
    const nx = $('gNext');
    if (!wrong && type === 'info'){ nx.style.display = '';
      nx.textContent = (this.st.step === GUIDE_TOTAL && this.st.phase === s.phases.length - 1) ? '完成' : '下一步'; }
    else nx.style.display = 'none'; },
  positionRing(){ const ring = $('gRing'); if (!ring) return;
    const ph = this.phase(); if (!ph){ ring.style.display = 'none'; return; }
    let sel = ph.sel;
    if (this.wrongPage()) sel = '[data-tab="' + ph.ctx + '"]';
    else if (ph.dyn && this.phaseType(ph) === 'info') sel = ph.altSel || ph.sel;
    const el = sel ? document.querySelector(sel) : null;
    if (!el){ ring.style.display = 'none'; return; }
    let r = el.getBoundingClientRect();
    const deskTop = window.innerHeight - 190;   // 讲解台上沿（bottom 52 + height 138）
    if (r.bottom > deskTop - 6 || r.top < 2){ const t = Date.now();
      if (t - this._lastScroll > 700){ this._lastScroll = t; el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } }
    r = el.getBoundingClientRect();
    ring.style.display = 'block';
    ring.style.left = (r.left - 4) + 'px'; ring.style.top = (r.top - 4) + 'px';
    ring.style.width = (r.width + 8) + 'px'; ring.style.height = (r.height + 8) + 'px'; },
};
document.addEventListener('click', function(e){ if (!Guide.active) return; const ph = Guide.phase();
  if (!ph || ph.type !== 'action') return; const t = e.target; if (!t || !t.closest) return;
  if ((ph.sel && t.closest(ph.sel)) || (ph.altSel && t.closest(ph.altSel))) gClicked = true; }, true);
function gNext(){ Guide.next(); }
function gSkip(){ if (Guide.active) Guide.finish(true); }
function gReplay(){ Guide.replay(); }

/* ---------------- 启动 ---------------- */
/* 开始页门：冷打开（新会话）先落开始页选档；同会话内刷新/重进直达游戏
   （sessionStorage 标记，标签页关掉即失效）——选档发生在会话入口，不打断游戏内重载 */
let atGate = true;
function passGate(){ atGate = false; try { sessionStorage.setItem('kaizongmen_gate', 'in'); } catch (e) {} }
function boot(){
  const raw = Save.loadRaw(CONFIG.save.autoKey);
  const s = raw && normalizeState(raw);
  if (s) S = s; else if (raw) { const lg = Save.loadRaw(CONFIG.save.lastGoodKey); const s2 = lg && normalizeState(lg); if (s2) S = s2; }
  if (!s && !raw) Save.migrateWalking();
  if (S.sect.started){ Save.ensureActiveSlot();   // ver3 迁移：给现行档归槽（找不到空槽就保持未归槽）
    genOrders(false); ensureDaily(); genRush(); Offline.settleOnReturn(); Ads.resumePending(); }
  try { if (sessionStorage.getItem('kaizongmen_gate') === 'in') atGate = false; } catch (e) { atGate = false; }
  window.UI_READY = true;
  render();
  Guide.init();   // 新手引导：仅全新访客触发/进行中恢复，老玩家零打扰（判定见 Guide.init）
  setInterval(() => { if (dirty) Save.save(); }, CONFIG.save.autosaveMs);
  setInterval(() => { const a = document.activeElement;
    if (a && (a.tagName === 'TEXTAREA' || a.tagName === 'INPUT' || a.tagName === 'SELECT')) return;
    if (S.sect.started) render(); }, 1000);
}
boot();
