    /* 紧急修复批②：女弟子发饰层——与男弟子共用帧表，靠发间花瓣钗区分（视觉规范既定路线）；
       位置随朝向：正/背在头侧，侧面在朝向侧上方。 */
    if (!isPlayer && disciple && !pxNative && this._discipleVariant(disciple) === 'f' && Art.F['fx_petal_1_v1.png']){   // 像素试点：女弟子原画自带粉钗，不再叠程序发饰
      /* 发饰位置按实际绘制框与内容中心/头顶行计算（锚点表口径，四批固定倍率下数值不变） */
      const pcx = B3 ? (B3[2] / fW) * dwP : dwP / 2, ptop = B3 ? (B3[3] / fH) * dhP : 0;
      const poff = st.dir === 'side' ? (st.face > 0 ? dwP * 0.13 : -dwP * 0.30) : dwP * 0.13;
      const psz = dhP / DH;
      Art.draw(g, 'fx_petal_1_v1.png', dx + pcx + poff, dy + ptop - 2, 15 * psz, 11 * psz);
    }
    /* 沉淀打磨批②：弟子头顶名牌——在 drawPerson 内随人物同趟 Y 排序绘制（遮挡口径与人物本体一致），主角不加。
       锚点取绘制框内容中心/头顶行，与发饰层同口径；名牌悬于头顶行上方 3px。 */
    if (!isPlayer && disciple && disciple.name){
      const ncx = dx + (B3 ? (B3[2] / fW) * dwP : dwP / 2);
      const ntop = dy + (B3 ? (B3[3] / fH) * dhP : 0);
      this._drawNameplate(disciple.name, ncx, ntop);
    }
  },
  /* 沉淀打磨批②：头顶小名牌（小字＋半透明深底＋金边，样式与建筑铭牌同系、尺寸更小） */
  _drawNameplate(name, cx, topY){
    const g = this.ctx;
    if (cx < -50 || cx > innerWidth + 50 || topY < -24 || topY > innerHeight + 24) return;
    const pxPlate = CONFIG.art.pixelSample && Art.readyPxu && Art.F['pxu_uic_nameplate.png'];
    g.font = pxPlate ? '12px FusionPixelKZM, sans-serif' : '600 10px sans-serif';   // 像素全量·程三：名牌换 U2 像素牌＋像素字体（12px 网格）
    const w = Math.ceil(g.measureText(name).width) + 12, h = 16;
    const x = Math.round(cx - w / 2), y = Math.round(topY - h - 3);
    if (pxPlate){ const f = Art.F['pxu_uic_nameplate.png'];
      g.drawImage(f.img, f.x, f.y, f.w, f.h, x - 5, y - 3, w + 10, h + 6);
      g.fillStyle = '#4a3220'; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(name, cx, y + h / 2 + 0.5);
      g.textBaseline = 'alphabetic'; g.textAlign = 'left'; return; }
    g.fillStyle = 'rgba(46,36,26,.78)';
    g.beginPath();
    if (g.roundRect) g.roundRect(x, y, w, h, 4); else g.rect(x, y, w, h);
    g.fill();
    g.strokeStyle = 'rgba(233,196,106,.45)'; g.lineWidth = 1; g.stroke();
    g.fillStyle = '#f2ead8'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(name, cx, y + h / 2 + 0.5);
    g.textBaseline = 'alphabetic'; g.textAlign = 'left';
  },
  /* 单体飞剑绘制——frm2_sword（尖端朝 +x）绕脚底锚点按行进角旋转，尖端恒随向。
     沉淀打磨批①：竖向长度改透视缩短（总长＝横向长 × swordLenFB 0.85），锚定按「行进侧探出量」：
     下飞柄端 tuck 在脚后、刃下探 L−0.11·dhP；上飞尖端越头顶约 16px（剑身藏体后只露尖，与真机截图读感一致）；
     横向 shift 恒 0（居中），转向途中按 |sin| 平滑混合、无跳变。锚点 (ax, ay) 为刃线中心（画布行 134/144 处）。
     旧口径（高清真机反馈批③）：竖向放大 1.35 并沿轴前移——下飞刃下探约 140 逻辑 px，主人 13:39 录屏判「像根杆子戳到地」，已废止。 */
  _drawFlySword(g, ang, ax, ay, dwP, dhP){
    if (ang === null || ang === undefined) return;
    const cv = this._swordCv || (this._swordCv = Art.cropCanvas('frm2_sword_v1.png'));
    if (!cv) return;
    const sn = Math.sin(ang), s = Math.abs(sn);
    const L = dwP * (1 + (CONFIG.flight.swordLenFB - 1) * s);
    const T = L * cv.height / cv.width;
    let shift = 0;
    if (s > 0.001){
      const reachDown = L - dhP * 0.11;          // 下飞：尖端自锚点下探量（柄端留在脚后体下）
      const reachUp = dhP * 0.89 + 16;           // 上飞：尖端自锚点上探量（越头顶约 16px）
      const reach = reachDown + Math.max(0, -sn) * (reachUp - reachDown);
      shift = (reach - L / 2) * s;
    }
    g.save(); g.translate(ax + Math.cos(ang) * shift, ay + sn * shift); g.rotate(ang);
    g.drawImage(cv, -L / 2, -T / 2, L, T); g.restore();
  },
  /* 修复批①遗留：程序像素飞剑——美术批二起降为 art2 未就绪兜底（正常路径由 GPT 御剑姿态整图承担，见 drawPerson）。
     剑向随移动朝向平滑转头，静止悬停时回正到 facing；剑身带一层微光拖影晕。 */
  _drawSword(e, st, cam, lift){
    const g = this.ctx;
    const moving = Math.hypot(st.vx, st.vy) > 0.3;
    const target = moving ? Math.atan2(st.vy, st.vx) : (st.face > 0 ? 0 : Math.PI);
    let d = target - st.swordAng;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    st.swordAng += d * 0.2;
    const cx = e.x - cam.x, cy = e.y - cam.y - lift + 6;
    g.save(); g.translate(cx, cy); g.rotate(st.swordAng);
    g.fillStyle = 'rgba(140,190,255,.28)'; g.fillRect(-26, -6, 58, 12);   // 剑光晕
    g.fillStyle = '#dfe9ee'; g.fillRect(-2, -2, 36, 4);                   // 剑身
    g.fillStyle = '#8fa8b5'; g.fillRect(-2, 1, 36, 1);                    // 剑脊阴影
    g.fillStyle = '#eef6f9'; g.fillRect(34, -1.5, 7, 3);                  // 剑尖
    g.fillStyle = '#c9a86a'; g.fillRect(-5, -3.5, 3, 7);                  // 剑格
    g.fillStyle = '#6e5638'; g.fillRect(-12, -1.5, 7, 3);                 // 剑柄
    g.fillStyle = '#c9a86a'; g.fillRect(-14, -2, 2, 4);                   // 剑首
    g.restore();
  },
  /* 沉淀打磨批④(a)：建筑接地阴影——斜俯视场景里建筑原本零落地阴影、像贴纸浮在地面（透视违和的可缓解部分）；
     在建筑 ent 内、图之前画扁椭圆软影，与建筑同趟 Y 排序（口径与人物一致）。影色/扁率全场统一，逐栋只给中心/接地线/宽。 */
  /* 像素全量批·程二：pxf 场景帧入位——等比缩放、底边（接地线）锚定，口径与试点大殿一致；
     帧不在册返回 false 由调用点回退现行 HD 帧。x/bottom 为世界坐标，内部扣镜头。 */
  _pxb(g, name, x, bottom, w, cam){
    const f = Art.F[name]; if (!f) return false;
    const dh = w * f.h / f.w;
    Art.draw(g, name, x - cam.x, bottom - dh - cam.y, w, dh);
    return true;
  },
  _groundShadow(cx, baseY, w){
    const g = this.ctx, cam = Scene.camera;
    g.fillStyle = 'rgba(32,28,18,.20)';
    g.beginPath(); g.ellipse(cx - cam.x, baseY - cam.y, w / 2, Math.max(5, w * 0.055), 0, 0, Math.PI * 2); g.fill();

  /* fix14：铭牌文字适配——旧版恒 12px 字号＋measureText 实测宽定牌宽有两坑：
     ①FusionPixelKZM 未加载完时 measureText 按回退字体量测偏小；②牌面纹理内框只占牌宽约
     12%–88%，带图标时文字起点 27px＋四字名（后山矿口）＋锁定后缀直接溢出内框（主人实证只显三字）。
     现行：字宽取「实测」与「字数×字号×0.99（点阵字每字约 1em）」的大者；超上限（170）逐级缩字号至 9；
     牌宽按内框几何反推 w＝(文字起点＋字宽)/0.88＋4，保证全名落在内框内。返回后 g.font 已设为适配字号。 */
  _fitPlate(label, hasIcn, px){
    const g = this.ctx, start = hasIcn ? 27 : 8, maxTw = 170;
    let fs = 12, tw = 0;
    for (; fs >= 9; fs--){
      g.font = px ? fs + 'px FusionPixelKZM, sans-serif' : '600 ' + fs + 'px sans-serif';
      tw = Math.max(g.measureText(label).width, px ? label.length * fs * 0.99 : 0);
      if (tw <= maxTw) break;
    }
    return { fs, tw, start, w: Math.ceil((start + tw) / 0.88) + 4 };
  },
  /* 修复批③：建筑铭牌——头顶悬浮小牌（图标＋建筑名），靠近门前时金边高亮。

  _drawPlates(){
    const g = this.ctx, cam = Scene.camera, p = Actor.player;
    for (const b of Scene.buildings){
      if (b.needQuarters){ const q = (S.buildings || []).find(x => x.id === 'quarters');
        if (!q || q.level < 1) continue; }
      const cx = b.img ? b.img.x + b.img.w / 2 : b.plateAt.x;
      const topY = b.img ? b.img.y : b.plateAt.y;
      const door = Scene.getAnchor(b.door);
      const near = door && dist(p, door) < 78;
      let y = topY - 14 + (near ? Math.sin(performance.now() / 280) * 1.5 : 0);
      if (y - 22 < 2) y = topY + 30;   // 贴世界顶边的建筑（大殿）：铭牌改挂檐口下，不画到界外
      const label = b.name + (b.id === 'mine' && Scene.isLocked('mineZone') ? ' · 未开放' : '');

      const hasIcn = Art.ready && Art.F['icn_' + b.icon + '_v1.png'];
      const fit = this._fitPlate(label, hasIcn, !!pxPlateB);   // fix14：字号/牌宽适配（字体已由 _fitPlate 设为适配字号）
      const w = fit.w, h = 22;
      const x = cx - cam.x - w / 2;

      if (yy < 84 && yy > -h) yy = 84;   // 建筑贴屏幕顶时铭牌压到 HUD 之下，不被顶栏盖住
      if (x + w < -10 || x > innerWidth + 10 || yy + h < -10 || yy > innerHeight + 10) continue;

        g.fillStyle = near ? '#8c2f22' : '#4a3220';
        g.textAlign = 'left'; g.textBaseline = 'middle';
        g.fillText(label, tx, yy + h / 2 + 0.5);
        g.textBaseline = 'alphabetic';
        continue; }
      g.fillStyle = 'rgba(46,36,26,.88)';
      g.beginPath();

      g.fillStyle = near ? '#ffe9a8' : '#f2ead8';

     W7={cx,cy,rx,ry} → 换算到绘制框 (16,430,180,170)；轮盘件为源图轮面圆化切图，
     渲染时按实测屏幕椭圆半径 (Rsx,Rsy) 压回，转速 10 秒/圈不变。 */
  _drawWheelOverlay(g, cam){
    const m = Art.spriteMeta('fx_wheel_v1.png'); if (!m) return;
    const W7 = { cx: 146, cy: 136, rx: 54, ry: 44 };
    const cx = 16 + W7.cx * (180 / 302) - cam.x, cy = 430 + W7.cy * (170 / 225) - cam.y;
    const Rsx = W7.rx * (180 / 302), Rsy = W7.ry * (170 / 225), R = Math.max(Rsx, Rsy);
    const dw = R / m.rw, dh = R / m.rh;
    g.save(); g.translate(cx, cy); g.scale(Rsx / R, Rsy / R);
    g.rotate(performance.now() / 10000 * Math.PI * 2);
    g.drawImage(m.canvas, -m.cx * dw, -m.cy * dh, dw, dh);
    g.restore();

        ents.push({ y: 774, f: () => PXD('pxf_prop_bush.png', 1318, 774, 116, 'prop_bush_v1.png', 1318, 690, 116, 84) });
        ents.push({ y: 1030, f: () => PXD('pxf_prop_flower.png', 112, 1030, 104, 'prop_flower_v1.png', 112, 954, 104, 76) });
        ents.push({ y: 1054, f: () => PXD('pxf_prop_bush.png', 1438, 1054, 116, 'prop_bush_v1.png', 1438, 968, 116, 86) });
      }
    } else {

    ents.push({ y: 246, f: () => this.drawBuilding(680, 120, 240, 118, '掌门居') });
    ents.push({ y: 528, f: () => { this.drawBuilding(1150, 420, 168, 104, '淬炼坊');
      const fl = 8 + Math.sin(performance.now() / 160) * 2;
      g.fillStyle = '#3d3d3d'; g.fillRect(1224, 486, 20, 20);
      g.fillStyle = '#ff9c4a'; g.fillRect(1230, 494 - fl / 2, 8, fl); } });
    ents.push({ y: 816, f: () => { const x = 1088 - cam.x, y = 760 - cam.y;
      g.fillStyle = '#8a6d4f'; g.fillRect(x, y + 14, 74, 42); g.fillStyle = '#6e5638'; g.fillRect(x, y + 4, 74, 14);
      g.fillStyle = '#f2ead8'; g.font = '12px sans-serif'; g.textAlign = 'center'; g.fillText('订单点', x + 37, y - 4); } });
    ents.push({ y: 1142, f: () => { const x = -cam.x, y = -cam.y;
      g.fillStyle = '#5a4632'; g.fillRect(x + 736, y + 1064, 14, 86); g.fillRect(x + 850, y + 1064, 14, 86);
      g.fillStyle = '#37474f'; g.fillRect(x + 720, y + 1048, 160, 16);
      g.fillStyle = '#f2ead8'; g.font = '700 13px sans-serif'; g.textAlign = 'center'; g.fillText('青 云 宗', x + 800, y + 1061); } });
    ents.push({ y: 352, f: () => { const x = 1400 - cam.x, y = 306 - cam.y;
      g.fillStyle = '#e8dcc3'; g.fillRect(x - 44, y + 22, 88, 24);
      g.fillStyle = '#8c2f22'; g.font = '700 12px sans-serif'; g.textAlign = 'center';
      g.fillText(Scene.isLocked('mineZone') ? '后山矿口 · 未开放' : '后山矿口', x, y + 38); } });
    }
    /* 追加批3：M1 程序占位树已全部拔除（原树位由 prop_bush/prop_flower 替代，见 Art.ready 分支装饰段） */
    for (const a of Npc.agents){ const d = Disciples.getDisciple(a.discipleId);
      ents.push({ y: a.y, f: () => this.drawPerson(a, d, false) }); }
    ents.push({ y: Actor.player.y, f: () => this.drawPerson(Actor.player, null, true) });
    ents.sort((m, n) => m.y - n.y);
    for (const e of ents) e.f();
    this._drawPlates();
    cam.x = _camFx; cam.y = _camFy;   // 整数化镜头还原（见 draw 头注）
  },
  drawBuilding(x0, y0, w, h, name){
    const g = this.ctx, x = x0 - Scene.camera.x, y = y0 - Scene.camera.y;
    g.fillStyle = '#e8dcc3'; g.fillRect(x, y + 44, w, h - 44);
    g.fillStyle = '#4a5d6b';
    g.beginPath(); g.moveTo(x - 12, y + 50); g.lineTo(x + w / 2, y - 4); g.lineTo(x + w + 12, y + 50); g.closePath(); g.fill();
    g.fillStyle = '#6e5638'; g.fillRect(x + w / 2 - 17, y + h - 42, 34, 42);
    g.fillStyle = '#f5eeda'; g.fillRect(x + 24, y + 60, 32, 24); g.fillRect(x + w - 56, y + 60, 32, 24);
    g.fillStyle = '#8c2f22'; g.font = '700 14px sans-serif'; g.textAlign = 'center'; g.fillText(name, x + w / 2, y + 28);
  },
};

/* ================================================================
 * 模块：声音 sound（UI声音集成批；音源口径 2026-11-07 15:53 主人改定：文件素材路线）
 * Sfx＝音效/BGM 文件播放层（16:02 选型已填入，素材包 audio/assets-hunt，授权清单同目录）：
 *   SFX 走 CONFIG.audio.sfxFiles（assets/audio/sfx/）；BGM 双轨——日常曲 bgmMain 低音量循环常驻
 *   （解锁后起播、进面板不中断、晨钟时 ducking），庆典曲 bgmEvent 仅晋阶演出期间切换、关页切回。
 *   CC-BY 署名（Sunrise/Tolling Bell）已照录于宗门页「关于·鸣谢」。
 * Voice＝人声短句 mp3（assets/audio/，触发分组见 CONFIG.audio.voiceGroups），本批已实装发声。
 * 两轨共用 S.settings.muted 总开关、音量分轨（CONFIG.audio.sfxVol/voiceVol）；
 * 浏览器自动播放策略：首次用户手势 pointerdown 后才解锁，未解锁一律静默（不许开屏自动出声）。
 * 接口：Sfx.unlock/play、Voice.unlock/play/group
 * ================================================================ */
const Sfx = {
  unlocked: false, _lastPlay: {}, _bgmEl: null, _bgmWanted: true, _evEl: null, _duckT: 0, _duckUntil: 0,
  muted(){ return !!(S.settings && S.settings.muted); },
  unlock(){ this.unlocked = true; this.bgm('start'); },   // 首次手势解锁后日常 BGM 起播（常驻）
  play(name){
    if (!this.unlocked || this.muted()) return false;
    const th = (CONFIG.audio.throttleMs || {})[name] || 0, t0 = nowMs();
    if (th && t0 - (this._lastPlay[name] || 0) < th) return false;
    const f = (CONFIG.audio.sfxFiles || {})[name];
    if (!f) return false;   // 素材未填：静默占位（待外部素材包，见模块头待办）
    this._lastPlay[name] = t0;
    try { const a = new Audio(CONFIG.audio.sfxDir + f); a.volume = CONFIG.audio.sfxVol;
      const p = a.play(); if (p && p.catch) p.catch(() => {});
      return true; } catch (e) { return false; }
  },
  /* BGM 双轨：日常曲常驻循环；庆典曲仅晋阶演出期间（ceremony(true) 起、关页 ceremony(false) 止） */
  _mkBgm(file, vol, loop){ try { const a = new Audio(CONFIG.audio.bgmDir + file);
    a.loop = loop; a.volume = vol; return a; } catch (e) { return null; } },
  bgm(action){
    if (action === 'start'){
      this._bgmWanted = true;
      if (this._evEl) return true;                       // 庆典中：日常曲让位，演完由 ceremony(false) 恢复
      if (!this.unlocked || this.muted()) return false;
      if (this._bgmEl){ if (this._bgmEl.paused){ const p = this._bgmEl.play(); if (p && p.catch) p.catch(() => {}); } return true; }
      if (!CONFIG.audio.bgmMain) return false;
      this._bgmEl = this._mkBgm(CONFIG.audio.bgmMain, this._duckUntil && nowMs() < this._duckUntil
        ? CONFIG.audio.bgmVol * 0.25 : CONFIG.audio.bgmVol, true);
      if (this._bgmEl){ const p = this._bgmEl.play(); if (p && p.catch) p.catch(() => {}); return true; }
      return false;
    }
    if (action === 'stop'){ this._bgmWanted = false;
      if (this._bgmEl){ try { this._bgmEl.pause(); } catch (e) {} } return true; }
    return false;
  },
  ceremony(on){
    if (on){
      if (!this.unlocked || this.muted() || this._evEl || !CONFIG.audio.bgmEvent) return false;
      if (this._bgmEl){ try { this._bgmEl.pause(); } catch (e) {} }
      this._evEl = this._mkBgm(CONFIG.audio.bgmEvent, CONFIG.audio.eventVol, true);
      if (this._evEl){ const p = this._evEl.play(); if (p && p.catch) p.catch(() => {}); return true; }
      return false;
    }
    if (this._evEl){ try { this._evEl.pause(); } catch (e) {} this._evEl = null; }
    if (this._bgmWanted) this.bgm('start');
    return true;
  },
  duck(ms){ // 晨钟 ducking：当前 BGM 短暂压低后自动恢复（静音/无曲时为空操作）
    const el = this._evEl || this._bgmEl; if (!el) return;
    const base = this._evEl ? CONFIG.audio.eventVol : CONFIG.audio.bgmVol;
    this._duckUntil = nowMs() + ms;
    try { el.volume = base * 0.25; } catch (e) {}
    clearTimeout(this._duckT);
    this._duckT = setTimeout(() => { const e2 = this._evEl || this._bgmEl;
      if (e2){ try { e2.volume = this._evEl ? CONFIG.audio.eventVol : CONFIG.audio.bgmVol; } catch (e) {} } }, ms);
  },
  suspendBgm(){ for (const el of [this._bgmEl, this._evEl]) if (el){ try { el.pause(); } catch (e) {} } },
  resumeBgm(){ if (this._evEl){ if (this._evEl.paused){ const p = this._evEl.play(); if (p && p.catch) p.catch(() => {}); } }
    else if (this._bgmWanted) this.bgm('start'); },
};
const Voice = {
  unlocked: false, _cool: {},
  unlock(){ this.unlocked = true; },
  muted(){ return !!(S.settings && S.settings.muted); },
  play(file){
    if (!this.unlocked || this.muted() || !file) return false;
    try { const a = new Audio('assets/audio/' + file); a.volume = CONFIG.audio.voiceVol;
      const p = a.play(); if (p && p.catch) p.catch(() => {});
      return true; } catch (e) { return false; }
  },
  group(name, key){ // 分组随机一句；greet 按（组+弟子）走 CONFIG.audio.greetCooldownMs 冷却
    const list = (CONFIG.audio.voiceGroups || {})[name]; if (!list || !list.length) return false;
    const ck = name + ':' + (key || ''), t0 = nowMs();
    if (name === 'greet' && t0 - (this._cool[ck] || 0) < CONFIG.audio.greetCooldownMs) return false;
    this._cool[ck] = t0;
    return this.play(list[Math.floor(Math.random() * list.length)]);
  },
};

/* ================================================================
 * 主循环与启动
 * ================================================================ */
const Game = {
  last: 0, running: false, saveTimer: 0,
  loop(t){
    if (!this.running) return;
    requestAnimationFrame(this.loop.bind(this));
    const frameMs = this.last ? t - this.last : 16;
    const dt = clamp(frameMs, 0, 50); this.last = t;
    Actor.setMoveIntent(Input.getMoveVector(), dt);
    Scene.updateCamera(dt);
    Farming.settlePlots(nowMs());
    Production.settleJobs(nowMs()); Orders.settleOrderTimers(nowMs());
    Disciples.settleDispatches(nowMs());
    this.slowTimer = (this.slowTimer || 0) + dt;
    if (this.slowTimer > 2000){ this.slowTimer = 0; Day.checkRollover(); Events.checkFaceEvents(); Leaderboard.reportScore(); }
    Npc.tick(dt);
    Interaction.refreshButton();
    Render.draw();
    Fx.tick(clamp(frameMs, 0, CONFIG.fx.dtClampMs), frameMs);
    this.saveTimer += dt;
    if (this.saveTimer > CONFIG.save.autosaveMs){ this.saveTimer = 0; Save.save('autosave'); }
  },
  boot(){
    if (/[?&]hd=1\b/.test(location.search)) CONFIG.art.pixelSample = false;   // 像素定版回退通道：经典画风（高清插画）
    if (/[?&]pixel=1\b/.test(location.search)) CONFIG.art.pixelSample = true;   // 像素直达（定版默认即像素，留作显式口径）
    Art.load();
    Save.load();
    Sect.recomputeBuildDegree();
    Farming.init(); Disciples.init(); Production.init(); Orders.init(); Codex.init();
    Events.ensureWeekly(); Ads.resumeChecks();
    Day.init();
    Scene.loadMap('kaizongmen_main');
    Actor.spawnPlayer();
    Npc.syncRoster();
    Offline.settleOnReturn(nowMs());
    Render.init(); Fx.init(); Input.init();
    if (Art.ready2) Fx.attachSwordTrail();   // 美术批二：图集先行就绪时补注册剑光（后就绪由 Art._build2 调用，幂等）
    // 环境活气：淬炼坊烟气 stream＋大殿前光尘 stream（降级时自动关停）
    Fx.stream(1239, 314, { rate: 4, sprites: ['spark'], vy: -0.8, spread: 6, life: 1100, size: 2.6 }); // M3：新图烟囱口（约 1239,314），图内静态烟已在，动态 stream 减弱保留活气
    Fx.stream(800, 210, { rate: 4, sprites: ['mote'], vy: -0.28, spread: 70, life: 1700, size: 2.6 });
    $('btnDisciples').onclick = () => { UI._mode = 'panel'; UI.openDisciplesPanel(); };
    $('btnOrders').onclick = () => { UI._mode = 'panel'; UI.openOrdersPanel(); };
    $('btnRoutine').onclick = () => { UI._mode = 'panel'; UI.openRoutinePanel(); };
    $('btnCodex').onclick = () => { UI._mode = 'panel'; UI.openCodexPanel(); };
    $('btnSect').onclick = () => { UI._mode = 'panel'; UI.openSectPanel(); };
    $('btnBoard').onclick = () => { UI._mode = 'panel'; UI.openBoardPanel(); };
    $('btnSound').onclick = () => UI.toggleSound();
    UI.refreshSoundBtn();
    // UI声音批：热区数值（CONFIG.uiKit）注入 CSS 变量；首次手势解锁音频；按钮点击音（pointerdown，不受急修 click 护盾影响）
    const rootStyle = document.documentElement.style;
    rootStyle.setProperty('--joyPad', CONFIG.uiKit.joyHitPadPx + 'px');
    rootStyle.setProperty('--actPad', CONFIG.uiKit.actHitPadPx + 'px');
    rootStyle.setProperty('--btnPad', CONFIG.uiKit.smallBtnPadPx + 'px');
    document.addEventListener('pointerdown', () => { Sfx.unlock(); Voice.unlock(); });
    document.addEventListener('pointerdown', e => {
      const b = e.target && e.target.closest ? e.target.closest('button, #act') : null;
      if (b && !b.disabled) Sfx.play('click'); });
    addEventListener('resize', () => UI._placeDeco());
    $('seedBtn').onclick = () => { const keys = Object.keys(CONFIG.crops);
      const i = keys.indexOf(S.farmMode || CONFIG.farm.defaultCrop);
      S.farmMode = keys[(i + 1) % keys.length];
      UI.hint('下次播种：' + CONFIG.crops[S.farmMode].name +
        (Object.keys(CONFIG.crops[S.farmMode].inputs).length
          ? '（需 ' + UI.needsText(CONFIG.crops[S.farmMode].inputs) + '）' : ''));
      Save.save('farm_mode'); };
    $('panelWrap').addEventListener('pointerdown', e => { if (e.target === $('panelWrap')) UI.closePanel(); });
    document.addEventListener('click', e => {   // 急修：开页护盾吞噬端（捕获阶段，先于页内任何 onclick 触发）
      if (nowMs() < UI._guardUntil && e.target && e.target.closest &&
          (e.target.closest('#pageWrap') || e.target.closest('#panelWrap'))){
        e.stopPropagation(); e.preventDefault(); UI._guardUntil = 0; }
    }, true);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden){ Save.save('hidden'); this.running = false; }
      else if (!this.running){ this.last = 0; this.running = true; requestAnimationFrame(this.loop.bind(this)); } });
    addEventListener('beforeunload', () => Save.save('unload'));
    UI.syncHud(); this._lastCoinFix();
    /* 紧急修复批①：封面时序理顺——满 1.5s 且主图集就绪才淡出（上限 4s 防加载失败挂死）；
       淡出 0.7s 完成后再贴镜头、亮 HUD（body.booted）、发开局/离线提示，
       不许出现封面与 HUD 同帧叠印、也不许玩家在封面期盲走。 */
    const bootT0 = Date.now();
    const finishSplash = () => { const sp = $('splash'); if (sp) sp.classList.add('done');
      setTimeout(() => { Scene.snapCamera(); document.body.classList.add('booted');
        UI.hint(S.pendingSettlement ? '有离线产出待领，去掌门居门前领取' : '左边摇杆走动，走到田边点右下按钮干活'); }, 720); };
    const waitSplash = () => { if (Art.ready || Date.now() - bootT0 > 4000) finishSplash();
      else setTimeout(waitSplash, 200); };
    setTimeout(waitSplash, 1500);
    this.running = true; requestAnimationFrame(this.loop.bind(this));
  },
  _lastCoinFix(){ UI._lastCoin = S.balances.coin || 0; $('coin').textContent = UI._lastCoin; UI._coinSfx = true; },
  /* 修复批⑥：读手动槽后重装配运行时（模块 init 均为「有数据不重建」口径，与 boot 同序安全重入） */
  applyLoadedState(){
    Sect.recomputeBuildDegree();
    Farming.init(); Disciples.init(); Production.init(); Orders.init(); Codex.init();
    Events.ensureWeekly(); Ads.resumeChecks();
    Day.init();
    Scene.loadMap('kaizongmen_main');
    Actor.spawnPlayer();
    Npc.syncRoster();
    UI.syncHud();
  },
};
Game.boot();

/* 测试钩子（冒烟脚本用） */
window.__game = { CONFIG, Ledger, Save, Farming, Npc, Offline, Day, Actor, Scene, Disciples, Interaction, Fx, Render,
  Production, Orders, Events, Ads, Sect, Codex, UI, Leaderboard, Art, Steward, Sfx, Voice,
  get state(){ return S; } };
</script>
