const $ = id => document.getElementById(id);
const nowMs = () => Date.now();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const randInt = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtDur(ms){ if (ms <= 0) return '已成熟/已完成';
  const s = Math.ceil(ms / 1000); if (s < 60) return s + ' 秒';
  const m = Math.floor(s / 60); if (m < 60) return m + ' 分 ' + (s % 60) + ' 秒';
  const h = Math.floor(m / 60); if (h < 24) return h + ' 小时 ' + (m % 60) + ' 分';
  return Math.floor(h / 24) + ' 天 ' + (h % 24) + ' 小时'; }
function fmtClock(ts){ const d = new Date(ts), p = n => String(n).padStart(2, '0');
  return (d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()); }
function dayKey(ts){ const d = new Date(ts || nowMs()), p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()); }
function digest(str){ let h = 5381; for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) >>> 0;
  return 'd' + h.toString(36); }
function itemName(id){ return (CONFIG.items[id] || {}).name || id; }
function icn(name){ return '<img class="icn" src="assets/icons/icn_' + name + '.png" alt="">'; }

function itemIcn(id){ return icn(ITEM_ICONS[id] || 'bag'); }
function hashStr(str){ let h = 5381; str = String(str || ''); for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) >>> 0; return h; }
function avatarIdxOf(d){ return (typeof d.avatarIdx === 'number') ? d.avatarIdx : (hashStr(d.id || d.name) % 6); }  // 弟子头像：按 id 哈希分配 %6（与旧版同口径）
function avaImg(d, cls){ return '<img class="' + (cls || 'avaImg') + '" src="assets/ava_' + avatarIdxOf(d) + '.png" alt="">'; }

/* ---------------- 声音（旧版定版音频资产：BGM 低音量循环＋6 音效；首次 pointerdown 解锁，设置页开关统管、存档记忆） ---------------- */
const Audio8 = {
  bgm: null, unlocked: false, lastSemantic: 0,
  unlock(){ if (this.unlocked) return; this.unlocked = true; if (typeof S !== 'undefined' && S.settings.soundOn) this.startBgm(); },
  startBgm(){ if (!this.bgm){ try { this.bgm = new Audio('assets/audio/bgm_main_peace_valley.ogg'); this.bgm.loop = true; this.bgm.volume = 0.16; } catch (e) { return; } }
    if (S.settings.soundOn){ const p = this.bgm.play(); if (p && p.catch) p.catch(() => {}); } },
  stopBgm(){ if (this.bgm) this.bgm.pause(); },
  play(name, vol){ if (typeof S === 'undefined' || !S.settings.soundOn || !this.unlocked) return;

/* ---------------- 账本（资源单一事实源） ---------------- */
const Ledger = {
  canAfford(cost){ if (!cost) return true;
    if (cost.coin && (S.balances.coin || 0) < cost.coin) return false;
    for (const k in (cost.items || {})) if ((S.inventory[k] || 0) < cost.items[k]) return false; return true; },
  costOf(coinAmt, itemsObj){ const c = {}; if (coinAmt) c.coin = -coinAmt;
    for (const k in (itemsObj || {})) c[k] = -(itemsObj[k] || 0); return { items: c }; },
  /* tx = { coin: n, items: {id: n}, reason } —— 正入账、负扣费，先校验后落账，原子性 */
  transact(tx){
    const coin = tx.coin || 0, itm = tx.items || {};
    if (coin < 0 && (S.balances.coin || 0) + coin < 0) return false;
    for (const k in itm) if ((S.inventory[k] || 0) + itm[k] < 0) return false;
    if (coin) { S.balances.coin = (S.balances.coin || 0) + coin;
      if (coin > 0){ S.stats.earnedCoin += coin; rollToday(); S.stats.todayEarned += coin;
        if (window.UI_READY && typeof floatText === 'function'){ floatText('+' + coin + ' 灵石', 'gold'); Audio8.play('coins', 0.4); } } }
    for (const k in itm){ S.inventory[k] = (S.inventory[k] || 0) + itm[k];
      if (itm[k] > 0) S.codex.items[k] = true; }
    markDirty(); return true;
  },
};
function rollToday(){ const k = dayKey(); if (S.stats.todayKey !== k){ S.stats.todayKey = k; S.stats.todayEarned = 0; } }
function techMul(){ return 1 + CONFIG.technique.perLevel * (S.technique.level || 0); }
function recomputeDegree(){
  let d = 0;
  for (const b of S.buildings){ const def = CONFIG.buildings.find(x => x.id === b.id); if (def) d += b.level * def.degreePerLevel; }
  if (S.mineUnlocked) d += CONFIG.mineBuilding.degreePerLevel;
  S.sect.buildDegree = d; return d;
}
function postCount(postId){ return S.disciples.filter(d => !d.dispatch && d.post === postId).length; }
function cropDurationMs(crop){ // 实际时长 ＝ 档位时长 ÷ 聚灵诀倍率 × 药圃岗位系数（0.8/名，≤2 名，播种时定格）
  const base = CONFIG.tiers[crop.tier - 1].durationMs;
  return Math.round(base / techMul() * Math.pow(0.8, Math.min(2, postCount('farm')))); }
function jobDurationMs(recipe){ // 实际时长 ＝ 档位时长 ÷ 聚灵诀倍率 × 工位岗位系数（0.9/名，≤2 名，开工时定格）
  const base = CONFIG.tiers[recipe.tier - 1].durationMs;
  return Math.round(base / techMul() * Math.pow(0.9, Math.min(2, postCount(recipe.station)))); }

/* ---------------- 存档层 ---------------- */
function normalizeState(raw){ // 任意来源（本地档/长码/短码）的存档先过这里：与 freshState 合并补缺，形状不对返回 null
  if (!raw || typeof raw !== 'object') return null;
  if (!raw.sect || typeof raw.sect !== 'object' || !raw.balances || typeof raw.balances !== 'object') return null;
  const F = freshState(); const s = Object.assign(F, raw);
  s.sect = Object.assign(F.sect, raw.sect || {});
  s.balances = Object.assign(F.balances, raw.balances || {});
  s.inventory = Object.assign({}, raw.inventory || {});
  s.plots = Array.isArray(raw.plots) && raw.plots.length ? raw.plots.slice(0, CONFIG.plotCount) : F.plots;
  while (s.plots.length < CONFIG.plotCount) s.plots.push({ cropId: null, plantedAt: 0, readyAt: 0 });
  s.jobs = Array.isArray(raw.jobs) ? raw.jobs : [];
  s.disciples = Array.isArray(raw.disciples) ? raw.disciples : [];
  s.buildings = Array.isArray(raw.buildings) && raw.buildings.length ? raw.buildings : F.buildings;
  s.technique = Object.assign(F.technique, raw.technique || {});
  for (const d of s.disciples) if (typeof d.avatarIdx !== 'number') d.avatarIdx = hashStr(d.id || d.name) % 6;
  s.routine = Object.assign(F.routine, raw.routine || {});
  s.routine.signIn = Object.assign(F.routine.signIn, (raw.routine || {}).signIn || {});
  s.codex = Object.assign(F.codex, raw.codex || {});
  s.ads = Object.assign(F.ads, raw.ads || {});
  s.offlineClaim = Object.assign(F.offlineClaim, raw.offlineClaim || {});
  s.stats = Object.assign(F.stats, raw.stats || {});
  s.day = Object.assign(F.day, raw.day || {});
  s.settings = Object.assign(F.settings, raw.settings || {});
  recomputeOn(s); return s;
}
function recomputeOn(s){ // 对任意状态对象重算建设度（normalize 时 S 还没换，先就地算）
  let d = 0;
  for (const b of (s.buildings || [])){ const def = CONFIG.buildings.find(x => x.id === b.id); if (def) d += b.level * def.degreePerLevel; }
  if (s.mineUnlocked) d += CONFIG.mineBuilding.degreePerLevel;
  s.sect.buildDegree = d;
}
const Save = {
  save(){ try { const prev = localStorage.getItem(CONFIG.save.autoKey);

      S.day.lastSeenAt = nowMs();

    } catch (e) { console.warn('[save] failed', e); } },
  loadRaw(key){ try { const r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch (e) { return null; } },
  slotSummary(key){ const s = this.loadRaw(key); if (!s || !s.sect || !s.sect.started) return null;
    return { day: (s.day || {}).index || 1, rank: CONFIG.ranks[s.sect.rank || 0].name, degree: s.sect.buildDegree || 0,
             coin: (s.balances || {}).coin || 0, disciples: (s.disciples || []).length, savedAt: (s.day || {}).lastSeenAt || 0 }; },
  writeSlot(key){ try { localStorage.setItem(key, JSON.stringify(S)); return true; } catch (e) { return false; } },
  readSlot(key){ const s = normalizeState(this.loadRaw(key)); if (!s) return false;
    S = s; markDirty(); Save.save(); return true; },
  /* 行走版旧档迁移：先备份原文，再迁灵石/库存/建筑等级/建设度/品级/天数/弟子名与品质；失败只记日志不阻断 */
  migrateWalking(){
    const rawStr = localStorage.getItem(CONFIG.save.walkingKey); if (!rawStr) return false;
    try { if (!localStorage.getItem(CONFIG.save.walkingBackupKey))
      localStorage.setItem(CONFIG.save.walkingBackupKey, rawStr); } catch (e) {}
    try { const w = JSON.parse(rawStr); if (!w || typeof w !== 'object') return false;
      const s = freshState();
      s.sect.started = true; s.sect.name = '青云宗';

      if (Array.isArray(w.buildings)) for (const wb of w.buildings){ const b = s.buildings.find(x => x.id === wb.id); if (b) b.level = clamp(wb.level || 0, 0, 3); }
      s.mineUnlocked = Array.isArray(w.unlockedZones) && w.unlockedZones.includes('mineZone');
      recomputeOn(s);
      s.sect.rank = clamp(w.sectRank || 0, 0, CONFIG.ranks.length - 1);
      s.day.index = Math.max(1, (w.day || {}).dayIndex || 1);
      s.day.lastSeenAt = w.lastSeenAt || nowMs();
      const G = CONFIG.discipleGen;
      s.disciples = (Array.isArray(w.disciples) ? w.disciples : []).slice(0, G.rosterCap).map((d, i) => {
        const q = G.qualities.find(x => x.name === d.quality) || G.qualities[0];
        const attrs = {}; for (const a of G.attrNames) attrs[a] = clamp((d.attrs || {})[a] || randInt(q.min, q.max), 1, 99);
        const fate = G.fates.find(f => f.name === d.fateName) || pick(G.fates);
        const mid = 'm' + i + '_' + nowMs().toString(36);
        return { id: mid, avatarIdx: hashStr(mid) % 6, name: String(d.name || ('弟子' + (i + 1))).slice(0, 6),
                 quality: q.name, attrs, fate: fate.name, fateDesc: fate.desc, personality: d.personality || pick(G.personalities),
                 origin: d.origin || '自旧宗门随掌门一同迁来。', robe: (d.robe || G.robes[i % G.robes.length]), post: null, dispatch: null };
      });
      for (const d of s.disciples){ s.codex.qualities[d.quality] = true; s.codex.fates[d.fate] = true; }
      s.stats.recruited = s.disciples.length;
      s.migrationLog.push('walking-migrated@' + new Date().toISOString());
      S = s; return true;
    } catch (e) { console.warn('[migrate] walking failed', e); try { S.migrationLog.push('walking-migrate-failed'); } catch (e2) {} return false; }
  },
};

/* ---------------- 离线结算（双轨本地公式，待领幂等） ---------------- */
const Offline = {
  /* 产率/小时 ＝（49 ＋ 0.2×建设度）× 0.6 × 聚灵诀倍率；封顶 ＝ 产率 × 7h × 0.6；离线 ≤8h 早归 ×1.3（封顶后加成，与行走版同口径） */
  compute(from, to){
    const el = Math.max(0, to - from); if (el < CONFIG.offline.minSettleMs) return null;
    const rate = (CONFIG.offline.rateBasePerHour + CONFIG.offline.ratePerBuildDegree * S.sect.buildDegree)
                 * CONFIG.offline.offlineRateFactor * techMul();
    const cap = rate * CONFIG.offline.capHours * CONFIG.offline.capFactor;
    let amount = Math.min(rate * el / 3600000, cap);
    let early = 0;
    if (el <= CONFIG.offline.earlyBonusMs){ early = amount * (CONFIG.offline.earlyBonusMul - 1); amount += early; }
    amount = Math.floor(amount); if (amount < 1) return null;
    return { id: 'st_' + digest(from + ':' + to + ':' + amount), from, to, amount,
             earlyBonus: Math.floor(early), digest: digest(from + ':' + to + ':' + amount), doubled: false };
  },
  settleOnReturn(){ if (S.pendingSettlement) return S.pendingSettlement;
    const p = this.compute(S.day.lastSeenAt || S.createdAt, nowMs());
    if (p){ S.pendingSettlement = p; markDirty(); Save.save(); } return p; },
  claim(doubled){ const p = S.pendingSettlement; if (!p) return 0;
    if (S.offlineClaim.appliedDigests.includes(p.digest)){ S.pendingSettlement = null; markDirty(); return 0; } // 幂等：同 digest 不双发
    const amt = doubled ? p.amount * 2 : p.amount;
    if (Ledger.transact({ coin: amt, reason: 'offline' })){
      S.offlineClaim.appliedDigests.push(p.digest); S.pendingSettlement = null; markDirty(); return amt; }
    return 0; },
};

/* ---------------- 广告（本地 mock 替换点：全主动触发、绝不插屏；PENDING 未落定不发、落定幂等、按序号衰减） ---------------- */
const Ads = {
  multFor(seq){ return seq <= CONFIG.ads.fullSeq ? 1 : seq <= CONFIG.ads.halfSeq ? 0.5 : 0; },
  /* effect 为可序列化描述：{type:'coinBonus', amount, tag} / {type:'jobSpeed', jobId} / {type:'orderRefresh'} / {type:'offlineDouble'} / {type:'promoteDouble'} */
  request(point, effect){
    const k = dayKey(); if (S.ads.date !== k){ S.ads.date = k; S.ads.seq = 0; }
    if (S.ads.pending.some(e => e.state === 'watching')){ toast('上一条广告还在播放中'); return; }
    const entry = { id: 'ad_' + nowMs().toString(36) + Math.floor(Math.random() * 999), point, effect,
                    state: 'watching', createdAt: nowMs(), granted: 0 };
    S.ads.pending.push(entry); markDirty(); Save.save(); render();
    setTimeout(() => { const e = S.ads.pending.find(x => x.id === entry.id);
      if (e && e.state === 'watching'){ e.state = 'completed'; this.settle(e.id); } }, CONFIG.ads.mockWatchMs);
  },
  settle(id){ const e = S.ads.pending.find(x => x.id === id);
    if (!e || e.state !== 'completed' || S.ads.applied.includes(id)) return;      // 未落定不发、已落定不重发
    const seq = S.ads.seq + 1, mult = this.multFor(seq), eff = e.effect || {}; let due = 0, msg = '';
    if (eff.type === 'coinBonus'){ due = Math.floor((eff.amount || 0) * mult); }
    else if (eff.type === 'offlineDouble'){ const p = S.pendingSettlement;
      if (p && !p.doubled){ due = Math.floor(p.amount * mult); if (due > 0 || mult === 0) p.doubled = true; } }
    else if (eff.type === 'promoteDouble'){ const pi = S.promoteInfo;
      if (pi && !pi.doubled){ due = Math.floor(pi.reward * mult); pi.doubled = true; } }
    else if (eff.type === 'jobSpeed'){ const j = S.jobs.find(x => x.id === eff.jobId);
      if (j && j.readyAt > nowMs()){ if (mult >= 1) j.readyAt = nowMs();
        else if (mult > 0) j.readyAt = nowMs() + Math.floor((j.readyAt - nowMs()) * (1 - mult)); msg = '工单已加速'; } }
    else if (eff.type === 'orderRefresh'){ if (mult > 0){ genOrders(true); msg = '订单已刷新'; } }
    const delta = Math.max(0, due - (e.granted || 0));                            // 差量口径：只补未发部分
    if (delta > 0) Ledger.transact({ coin: delta, reason: 'ad_' + e.point });
    e.granted = due; S.ads.seq = seq; S.ads.applied.push(id);
    S.ads.pending = S.ads.pending.filter(x => x.id !== id);
    markDirty(); Save.save();
    toast(delta > 0 ? ('广告奖励到账：灵石 +' + delta + (mult < 1 ? '（第 ' + seq + ' 次，倍率 ' + mult + '）' : ''))
                    : (msg || '本次广告倍率为 0，无奖励（已达软封顶）'));
    render();
  },
  resumePending(){ // 重进时核对未落定：超时作废；在窗内且已过播放时长则补记完成并结算（差量补发）
    const t = nowMs(); let changed = false;
    for (const e of [...S.ads.pending]){
      if (e.state === 'watching'){
        if (t - e.createdAt > CONFIG.ads.pendingTtlMs){ S.ads.pending = S.ads.pending.filter(x => x.id !== e.id); changed = true; }
        else if (t - e.createdAt >= CONFIG.ads.mockWatchMs){ e.state = 'completed'; changed = true; } } }
    if (changed){ markDirty(); Save.save(); }
    for (const e of [...S.ads.pending]) if (e.state === 'completed') this.settle(e.id);
  },
  watching(){ return S.ads.pending.some(e => e.state === 'watching'); },
};

function eventById(id){ return EVENTS.find(e => e.id === id); }
function maybeEvent(){ if (S.pendingEvent) return;
  const chance = Math.min(CONFIG.patrolChanceCap, CONFIG.eventChance + CONFIG.patrolBonus * postCount('patrol'));
  if (Math.random() < chance){ const ev = pick(EVENTS); S.pendingEvent = ev.id; S.eventOpen = false; markDirty(); } }
function chooseEvent(idx){ const ev = eventById(S.pendingEvent); if (!ev) { S.pendingEvent = null; return; }
  const o = ev.opts[idx]; if (!o) return;
  if (o.cost && !Ledger.transact(Object.assign({ reason: 'event' }, txOf(o.cost, -1)))){ toast('家底不够，选不了这一项'); return; }
  if (o.gain) Ledger.transact(Object.assign({ reason: 'event' }, txOf(o.gain, 1)));
  if (o.attrBoost && S.disciples.length){ const d = pick(S.disciples);
    d.attrs[o.attrBoost.attr] = clamp((d.attrs[o.attrBoost.attr] || 0) + o.attrBoost.n, 1, 99);
    toast(d.name + ' 的' + o.attrBoost.attr + ' +' + o.attrBoost.n); }
  else if (!o.attrBoost) toast('已定：' + o.label);
  S.pendingEvent = null; S.eventOpen = false; markDirty(); Save.save(); beep(); render(); }
function txOf(eff, sign){ const tx = {};
  if (eff.coin) tx.coin = eff.coin * sign;
  if (eff.items){ tx.items = {}; for (const k in eff.items) tx.items[k] = eff.items[k] * sign; }
  return tx; }
function canAffordEff(eff){ if (!eff) return true;
  if (eff.coin && (S.balances.coin || 0) < eff.coin) return false;
  for (const k in (eff.items || {})) if ((S.inventory[k] || 0) < eff.items[k]) return false; return true; }

/* ---------------- 生产：药圃 / 工单 / 订单 ---------------- */
function plantCrop(i, cropId){ const p = S.plots[i]; if (!p || p.cropId) return;
  const crop = CONFIG.crops[cropId]; if (!crop) return;
  if (!Ledger.transact(Object.assign({ reason: 'plant' }, txOf({ items: crop.inputs }, -1)))){ toast('投入不够：需 ' + needsText(crop.inputs)); return; }
  let dur = cropDurationMs(crop);
  // 首收钩子：每档第一块灵芝田首次成熟只要 10 秒，让新玩家半分钟内尝到第一口收获（仅一次，hookFirstCrop 标记后不再触发）
  if (cropId === 'lingzhi' && !S.hookFirstCrop){ dur = 10 * 1000; S.hookFirstCrop = true; }
  p.cropId = cropId; p.plantedAt = nowMs(); p.readyAt = nowMs() + dur;
  S.stats.planted++; markDirty(); Save.save(); beep(); render(); }
function harvestPlot(i, silent){ const p = S.plots[i]; if (!p || !p.cropId || nowMs() < p.readyAt) return null;
  const crop = CONFIG.crops[p.cropId];
  Ledger.transact({ items: { [crop.itemId]: crop.yieldQty }, reason: 'harvest' });
  floatText('+' + crop.yieldQty + ' ' + crop.name); Audio8.play('harvest_store');
  p.cropId = null; p.plantedAt = 0; p.readyAt = 0; S.stats.harvested++;
  markDirty(); if (!silent){ Save.save(); beep(); render(); } return crop; }
function stationActive(stationId){ return S.jobs.filter(j => j.station === stationId).length; }
function startJob(recipeId){ const r = CONFIG.recipes.find(x => x.id === recipeId); if (!r) return;
  if (r.station === 'mine' && !S.mineUnlocked){ toast('先在宗门页开辟后山矿口'); return; }
  if (stationActive(r.station) >= CONFIG.stations[r.station].maxRunning){ toast(CONFIG.stations[r.station].name + ' 工位已满（2 条）'); return; }
  if (!Ledger.transact(Object.assign({ reason: 'job' }, txOf({ items: r.inputs }, -1)))){ toast('原料不够：需 ' + needsText(r.inputs)); return; }
  const dur = jobDurationMs(r);
  S.jobs.push({ id: 'j' + nowMs().toString(36) + Math.floor(Math.random() * 999), recipeId: r.id, station: r.station,
                startedAt: nowMs(), readyAt: nowMs() + dur });
  markDirty(); Save.save(); beep(); render(); }
function collectJob(jobId, silent){ const j = S.jobs.find(x => x.id === jobId); if (!j || nowMs() < j.readyAt) return null;
  const r = CONFIG.recipes.find(x => x.id === j.recipeId); if (!r) return null;
  Ledger.transact({ items: Object.assign({}, r.outputs), reason: 'job_done' });
  for (const k in r.outputs) floatText('+' + r.outputs[k] + ' ' + itemName(k)); Audio8.play('harvest_store');
  S.jobs = S.jobs.filter(x => x.id !== jobId); markDirty();
  if (!silent){ Save.save(); beep(); render(); } return r; }
function jobSpeed(jobId){ Ads.request('job_speedup', { type: 'jobSpeed', jobId }); }
function genOrders(force){ if (S.orders.length && !force) return;
  const pool = CONFIG.orders.pools.daily, off = (S.ordersBatch * CONFIG.orders.dailyCount) % pool.length;
  S.orders = []; for (let i = 0; i < CONFIG.orders.dailyCount; i++){ const o = pool[(off + i) % pool.length];
    S.orders.push({ uid: 'o' + S.ordersBatch + '_' + i, needs: Object.assign({}, o.needs), reward: o.reward }); }
  S.ordersBatchDone = 0; markDirty(); }
function deliverOrder(uid){ const o = S.orders.find(x => x.uid === uid); if (!o) return;
  if (!canAffordEff({ items: o.needs })){ toast('货物不够：需 ' + needsText(o.needs)); return; }
  Ledger.transact(Object.assign({ reason: 'order' }, txOf({ items: o.needs }, -1)));
  Ledger.transact({ coin: o.reward, reason: 'order' });
  S.orders = S.orders.filter(x => x.uid !== uid); S.ordersBatchDone++; S.stats.orders++;
  if (S.ordersBatchDone >= CONFIG.orders.dailyCount){ S.ordersBatch++; genOrders(true); toast('这一批订单交齐了，已刷新新单'); }
  maybeEvent(); markDirty(); Save.save(); beep(); render(); }
function orderRefreshAd(){ Ads.request('order_refresh', { type: 'orderRefresh' }); }

/* ---------------- 弟子：招募 / 派工 / 派遣 ---------------- */
function genDisciple(){ const G = CONFIG.discipleGen;
  let total = 0; for (const q of G.qualities) total += q.w;
  let roll = Math.random() * total, q = G.qualities[0];
  for (const x of G.qualities){ roll -= x.w; if (roll <= 0){ q = x; break; } }
  let name = ''; for (let t = 0; t < 12; t++){ name = pick(G.surnames) + pick(G.givenNames);
    if (!S.disciples.some(d => d.name === name)) break; }
  const attrs = {}; for (const a of G.attrNames) attrs[a] = randInt(q.min, q.max);
  const fate = pick(G.fates);
  let origin = pick(G.originOpenings) + '，' + pick(G.originBridges) + '，' + pick(G.originEndings) + '。';
  if (Math.random() < 0.08) origin += '别看此人' + pick(['身形魁梧','个子小小','嗓门洪亮','走路带风']) + '，偏偏' +
    pick(['心细如发','胆子极小','嗜睡如命','慢条斯理']) + '，全宗门都拿这事打趣。';
  const nid = 'd' + nowMs().toString(36) + Math.floor(Math.random() * 9999);
  return { id: nid, name, quality: q.name, attrs, avatarIdx: hashStr(nid) % 6,
           fate: fate.name, fateDesc: fate.desc, personality: pick(G.personalities), origin,
           robe: pick(G.robes), post: null, dispatch: null }; }
function recruit(){ const G = CONFIG.discipleGen;
  if (S.disciples.length >= G.rosterCap){ toast('名册已满（' + G.rosterCap + ' 人），先扩建弟子居舍再说'); return; }
  if (!Ledger.transact({ coin: -G.recruitCost, reason: 'recruit' })){ toast('招募需要 ' + G.recruitCost + ' 灵石，家底还不够'); return; }
  const d = genDisciple(); S.disciples.push(d);
  S.codex.qualities[d.quality] = true; S.codex.fates[d.fate] = true; S.stats.recruited++;
  toast(d.name + ' 入山门（' + d.quality + '）'); markDirty(); Save.save(); Audio8.play('success'); render(); }
function setPost(id, post){ const d = S.disciples.find(x => x.id === id); if (!d || d.dispatch) return;
  d.post = (d.post === post) ? null : post; if (d.post) S.stats.assigned++;
  markDirty(); Save.save(); beep(); render(); }
function startDispatch(id, destId){ const d = S.disciples.find(x => x.id === id); if (!d || d.dispatch) return;
  const dest = CONFIG.dispatch.dests.find(x => x.id === destId); if (!dest) return;
  d.dispatch = { destId, backAt: nowMs() + CONFIG.tiers[4].durationMs }; d.post = null;
  markDirty(); Save.save(); beep(); render(); }
function claimDispatch(id, silent){ const d = S.disciples.find(x => x.id === id);
  if (!d || !d.dispatch || nowMs() < d.dispatch.backAt) return null;
  const dest = CONFIG.dispatch.dests.find(x => x.id === d.dispatch.destId); if (!dest) return null;
  Ledger.transact({ items: { [dest.item]: dest.qty }, reason: 'dispatch' });
  floatText('+' + dest.qty + ' ' + itemName(dest.item)); Audio8.play('harvest_store');
  d.dispatch = null; S.stats.dispatches++; markDirty();
  if (!silent){ Save.save(); beep(); render(); } return dest; }

/* ---------------- 宗门：扩建 / 晋阶 / 功法 / 签到 / 过天 ---------------- */
function doUpgrade(bid){ const b = S.buildings.find(x => x.id === bid); if (!b) return;
  const cost = (CONFIG.upgrades[bid] || {})[b.level + 1]; if (!cost) { toast('已满级'); return; }
  if (!Ledger.canAfford(cost)){ toast('还差：' + costText(cost)); return; }
  Ledger.transact(Object.assign({ reason: 'upgrade' }, txOf(cost, -1)));
  b.level++; recomputeDegree(); S.stats.upgrades++;
  floatText('+10 建设度'); toast(b.name + ' 升至 ' + b.level + ' 级，建设度 ' + S.sect.buildDegree);
  markDirty(); Save.save(); Audio8.play('success'); render(); }
function unlockMine(){ const cost = CONFIG.upgrades.mineUnlock;
  if (S.mineUnlocked) return;
  if (!Ledger.canAfford(cost)){ toast('还差：' + costText(cost)); return; }
  Ledger.transact(Object.assign({ reason: 'mine_unlock' }, txOf(cost, -1)));
  S.mineUnlocked = true; recomputeDegree(); S.stats.upgrades++;
  floatText('+15 建设度'); toast('后山矿口已开辟，矿脉工位可用');
  markDirty(); Save.save(); Audio8.play('success'); render(); }
function nextRankDef(){ return CONFIG.ranks[S.sect.rank + 1] || null; }
function canPromote(){ const n = nextRankDef(); return !!n && S.sect.buildDegree >= n.need; }
function doPromote(){ if (!canPromote()){ toast('建设度还不够晋阶'); return; }
  const firstEver = S.sect.rank === 0;
  S.sect.rank++; const reward = CONFIG.promoteRewardBase * (S.sect.rank + 1); // 礼金＝50 × 新品级序（index+1）
  Ledger.transact({ coin: reward, reason: 'promote' });
  if (firstEver) Ledger.transact({ items: { mine_charm: CONFIG.openingGiftMineCharmOnPromote }, reason: 'promote_gift' });
  S.promoteInfo = { reward, doubled: false, at: nowMs() };
  toast('晋阶！' + S.sect.name + ' 已是「' + CONFIG.ranks[S.sect.rank].name + '」，礼金 ' + reward + ' 灵石' + (firstEver ? '，另赠矿引 ×1' : ''));
  markDirty(); Save.save(); Audio8.play('success'); render(); }
function promoteDoubleAd(){ if (!S.promoteInfo || S.promoteInfo.doubled){ toast('这次晋阶的双倍已用过'); return; }
  Ads.request('promote_double', { type: 'promoteDouble' }); }
function doTechnique(){ const T = CONFIG.technique, lv = S.technique.level;
  if (lv >= T.maxLevel){ toast('聚灵诀已至顶层'); return; }
  const cost = T.costs[lv];
  if (!Ledger.transact({ coin: -cost, reason: 'technique' })){ toast('参悟需要 ' + cost + ' 灵石'); return; }
  S.technique.level++; S.stats.upgrades++;
  floatText('产率 +' + Math.round(T.perLevel * 100) + '%');
  toast('聚灵诀升至 ' + S.technique.level + ' 层，全产率 ×' + techMul().toFixed(1));
  markDirty(); Save.save(); Audio8.play('success'); render(); }
function canSignIn(){ return S.routine.signIn.lastDate !== dayKey(); }
function signInReward(){ return CONFIG.routine.signInRewards[Math.min(S.routine.signIn.total, CONFIG.routine.signInRewards.length - 1)]; }
function doSignIn(silent){ if (!canSignIn()){ if (!silent) toast('今日已签到，明日再来'); return 0; }
  const r = signInReward(); Ledger.transact({ coin: r, reason: 'signin' });
  S.routine.signIn.total++; S.routine.signIn.lastDate = dayKey(); markDirty();
  if (!silent){ Save.save(); beep(); render(); } return r; }
function doSleep(){ if (!armed('sleep')){ toast('再点一次确认歇息过天'); return; }
  const report = '第 ' + S.day.index + ' 天入账 ' + S.stats.todayEarned + ' 灵石 · 在册弟子 ' + S.disciples.length + ' 人 · 建设度 ' + S.sect.buildDegree;
  S.lastReport = report; S.day.index++; S.stats.todayEarned = 0; S.stats.todayKey = dayKey();
  maybeEvent(); markDirty(); Save.save(); Audio8.play('morning_bell'); render(); }

/* ---------------- 一键全收（逐项走原领取函数与幂等，不绕过） ---------------- */
function collectSummary(){ const t = nowMs();
  return { offline: S.pendingSettlement ? S.pendingSettlement.amount : 0,
    plots: S.plots.filter(p => p.cropId && t >= p.readyAt).length,
    jobs: S.jobs.filter(j => t >= j.readyAt).length,
    dispatch: S.disciples.filter(d => d.dispatch && t >= d.dispatch.backAt).length,
    signin: canSignIn() ? signInReward() : 0 }; }
function collectCount(c){ return (c.offline ? 1 : 0) + c.plots + c.jobs + c.dispatch + (c.signin ? 1 : 0); }
function claimAll(){ const c = collectSummary(); if (!collectCount(c)){ toast('暂无可领取的'); return; }
  if (S.pendingSettlement) Offline.claim(false);                       // 待领结算：走 Offline.claim（digest 幂等）
  S.plots.forEach((p, i) => { if (p.cropId && nowMs() >= p.readyAt) harvestPlot(i, true); });
  [...S.jobs].forEach(j => { if (nowMs() >= j.readyAt) collectJob(j.id, true); });
  S.disciples.forEach(d => { if (d.dispatch && nowMs() >= d.dispatch.backAt) claimDispatch(d.id, true); });
  if (canSignIn()) doSignIn(true);                                     // 签到：走 doSignIn（自然日校验）
  markDirty(); Save.save(); beep(); toast('一键全收完成'); render(); }

function armLabel(key, label){ return (__armed[key] && nowMs() - __armed[key] < 3500) ? '确认？' : label; }
function armCls(key){ return (__armed[key] && nowMs() - __armed[key] < 3500) ? 'btn sm arm' : 'btn sm'; }
function armBtn(key, label){ return (__armed[key] && nowMs() - __armed[key] < 3500) ? 'btn arm' : 'btn'; }

  h += '<p class="small">本批已交 ' + S.ordersBatchDone + '/' + CONFIG.orders.dailyCount + '，交齐自动刷新。</p>' +

function viewSet(){ let h = '';
  h += '<div class="card"><h3>云端短码</h3>';
  if (!Vault.enabled()) h += '<p><b>云端通道开通中</b></p><p class="small">短码服务部署后自动可用；现在可先用下方长码换设备。通道未通不影响游玩与本地存档。</p>';
  else h += '<div class="btnrow"><button class="btn" onclick="vaultPut()">把当前档生成短码</button></div><div id="vaultOut" style="margin-top:6px"></div>' +
    '<label class="lb">输入短码取档（覆盖前自动存恢复槽）</label><input type="text" id="vaultCode" maxlength="14" placeholder="如 KZ-XXXXXXXX">' +
    '<div class="btnrow"><button class="btn" onclick="vaultGet()">取档并载入</button></div><div id="vaultMsg" style="margin-top:6px"></div>';
  h += '</div>';
  h += '<div class="card"><h3>存档槽</h3><p class="small">自动档：每 5 秒及关键动作自动保存，刷新不丢。手动槽存/读/删均需点两次确认。</p>' +
    slotRow(CONFIG.save.restoreKey, '恢复槽') +
    [1, 2, 3, 4, 5].map(i => slotRow(CONFIG.save.slotPrefix + i, '存档槽 ' + i)).join('') + '</div>';
  h += '<div class="card"><h3>存档长码</h3><p class="small">长码是整档文本，请自己全选复制保存；取档时粘贴回来导入（导入前自动存恢复槽）。</p>' +
    '<textarea id="longCode" placeholder="点下方生成，或把长码粘贴到这里"></textarea>' +
    '<div class="btnrow"><button class="btn" onclick="genLongCode()">生成长码</button>' +
    '<button class="' + ( __armed['import'] ? 'btn arm' : 'btn') + '" onclick="importLongCode()">' + armLabel('import', '导入长码') + '</button></div>' +
    '<div id="longMsg" style="margin-top:6px"></div></div>';
  h += '<div class="card"><h3>说明</h3><p class="small">' +
    '离线产率/小时 ＝（49 ＋ 0.2 × 建设度）× 0.6 × 聚灵诀倍率，封顶 ＝ 产率 × 7 × 0.6；离线 8 小时内回来再 ×1.3。聚灵诀倍率 ＝ 1 ＋ 0.1 × 层数。<br>' +
    '招募概率：寻常 50% · 良好 32% · 上佳 14% · 绝佳 4%。<br>' +
    'MVP 简化：订单墙只用日常池轮换（定时/急单池数据已备、后续开放）；广告为本地模拟占位（口径与正式版一致：主动触发、序号衰减、未落定不发）。<br>' +
    '素材：封面、弟子头像、图标、音乐音效均为本作旧版定版资产；无行走人物与场景图集。声音开关统管 BGM 与音效，默认开，选择会存档记住；BGM 在首次点击后开始低音量循环。</p>' +
    '<div class="row"><span>声音</span><button class="btn sm" onclick="toggleSound()">' + (S.settings.soundOn ? '已开（点关）' : '已关（点开）') + '</button></div></div>';
  h += '<div class="card"><h3>重置</h3><p class="small">删档重开：清掉文本版本地全部存档（自动档/五槽/恢复槽），回到开宗起名。行走版旧档备份不会动。</p>' +
    '<div class="btnrow"><button class="' + (__armed['wipe'] ? 'btn arm' : 'btn danger') + '" onclick="wipeAll()">' + armLabel('wipe', '删档重开') + '</button></div></div>';
  return h; }
function toggleSound(){ S.settings.soundOn = !S.settings.soundOn; markDirty(); Save.save();
  if (S.settings.soundOn){ Audio8.unlocked = true; Audio8.startBgm(); Audio8.play('success'); } else Audio8.stopBgm();
  render(); }
function slotSave(key){ if (!armed(key + 'S')){ toast('再点一次确认存入'); return; }
  if (Save.writeSlot(key)){ toast('已存入'); } else toast('存入失败（存储空间不足？）'); render(); }
function slotLoad(key){ if (!armed(key + 'L')){ toast('再点一次确认读取（当前进度会被覆盖，自动档会先备份）'); return; }
  if (Save.readSlot(key)){ toast('已读取'); go('home'); } else toast('读取失败：槽内无有效存档'); }
function slotDel(key){ if (!armed(key + 'D')){ toast('再点一次确认删除'); return; }
  try { localStorage.removeItem(key); } catch (e) {} toast('已删除'); render(); }
function slotRestore(){ if (!armed(CONFIG.save.restoreKey + 'L')){ toast('再点一次确认恢复'); return; }
  if (Save.readSlot(CONFIG.save.restoreKey)){ toast('已恢复到覆盖前的进度'); go('home'); } else toast('恢复槽是空的'); }
function genLongCode(){ Save.save();
  const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(S))));
  $('longCode').value = b64; $('longMsg').textContent = '长码已生成（' + b64.length + ' 字符），请全选复制、自行保存。'; }
function importLongCode(){ const v = ($('longCode').value || '').trim(); if (!v){ $('longMsg').textContent = '先把长码粘贴到框里。'; return; }
  if (!armed('import')){ toast('再点一次确认导入（覆盖前自动存恢复槽）'); return; }
  let parsed = null; try { parsed = JSON.parse(decodeURIComponent(escape(atob(v.replace(/\s+/g, ''))))); } catch (e) {}
  const s = parsed && normalizeState(parsed);
  if (!s){ $('longMsg').textContent = '导入失败：长码校验不通过，未覆盖当前进度。'; return; }
  Save.writeSlot(CONFIG.save.restoreKey); S = s; markDirty(); Save.save();
  toast('长码导入成功'); go('home'); }
function wipeAll(){ if (!armed('wipe')){ toast('再点一次确认删档重开'); return; }
  try { localStorage.removeItem(CONFIG.save.autoKey); localStorage.removeItem(CONFIG.save.lastGoodKey);
    localStorage.removeItem(CONFIG.save.restoreKey);
    for (let i = 1; i <= CONFIG.save.slots; i++) localStorage.removeItem(CONFIG.save.slotPrefix + i); } catch (e) {}
  S = freshState(); toast('已删档，重新开宗'); render(); }
function vaultPut(){ Vault.put($('vaultOut')); }
function vaultGet(){ Vault.get($('vaultCode'), $('vaultMsg')); }

/* ---------------- 云端短码（vault 客户端；协议：双 POST ＋ 信封 {code:0,data:{…}}，失败展示后端 message） ---------------- */
const Vault = {
  base(){ return (CONFIG.vault.apiBase || '').replace(/\/+$/, ''); },
  enabled(){ return !!this.base(); },
  /* 统一请求：AbortController 8 秒超时；HTTP 错误时优先解析后端 {code,message} 把 message 交回调用方展示 */
  async call(path, bodyObj){
    const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 8000);
    try { const res = await fetch(this.base() + path, { method: 'POST', signal: ctl.signal,
        headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(bodyObj || {}) });
      let env = null; try { env = await res.json(); } catch (e) {}
      if (!res.ok || !env || env.code !== 0)
        return { ok: false, message: (env && env.message) ? env.message : ('云端返回异常（HTTP ' + res.status + '）') };
      return { ok: true, data: env.data || {} };
    } catch (e) { return { ok: false, message: e && e.name === 'AbortError' ? '云端请求超时，请改用长码' : '网络不通，请改用长码' }; }
    finally { clearTimeout(timer); }
  },
  payloadStr(){ Save.save(); return JSON.stringify(S); },
  async put(outEl){
    if (!this.enabled()){ outEl.textContent = '云端通道开通中'; return; }
    const payload = this.payloadStr();
    const bytes = new Blob([payload]).size;
    if (bytes > 256 * 1024){ outEl.textContent = '存档已 ' + Math.ceil(bytes / 1024) + ' KB，超过短码上限 256 KB，请改用下方长码。'; return; }
    outEl.textContent = '正在生成短码…';
    const r = await this.call('/api/kzvault/put', { payload });
    if (!r.ok){ outEl.textContent = '生成失败：' + r.message; return; }
    const code = String(r.data.shortCode || '').toUpperCase();
    if (!code){ outEl.textContent = '生成失败：云端未返回短码，请改用长码'; return; }
    outEl.innerHTML = '你的云端短码：<b style="font-size:19px;letter-spacing:2px">KZ-' + esc(code) + '</b>' +
      '<br><span class="small">换设备时在设置页输入此码取档（带不带 KZ- 前缀都可以）。请自行抄好，短码不另存本机。</span>';
  },
  async get(inputEl, outEl){
    if (!this.enabled()){ outEl.textContent = '云端通道开通中'; return; }
    let code = (inputEl.value || '').trim().toUpperCase().replace(/\s+/g, '');
    if (code.indexOf('KZ-') === 0) code = code.slice(3);       // 玩家带前缀输入时先剥掉再发
    if (!code){ outEl.textContent = '先输入短码再取档。'; return; }
    outEl.textContent = '正在取档…';
    const r = await this.call('/api/kzvault/get', { code });
    if (!r.ok){ outEl.textContent = '取档失败：' + r.message + '（当前进度未动）'; return; }
    let parsed = null; try { parsed = JSON.parse(r.data.payload || ''); } catch (e) {}
    const s = parsed && normalizeState(parsed);
    if (!s){ outEl.textContent = '取档失败：云端存档校验不通过，已放弃覆盖（当前进度未动）。'; return; }
    Save.writeSlot(CONFIG.save.restoreKey);                    // 覆盖前自动把当前档存入恢复槽
    S = s; markDirty(); Save.save();
    outEl.textContent = '取档成功，已载入云端存档；覆盖前的进度已存入恢复槽，可在下方找回。';
    toast('云端存档已载入'); render();
  },
};

/* ---------------- 启动 ---------------- */
function boot(){
  const raw = Save.loadRaw(CONFIG.save.autoKey);
  const s = raw && normalizeState(raw);
  if (s) S = s; else if (raw) { const lg = Save.loadRaw(CONFIG.save.lastGoodKey); const s2 = lg && normalizeState(lg); if (s2) S = s2; }
  if (!s && !raw) Save.migrateWalking();
  if (S.sect.started){ genOrders(false); Offline.settleOnReturn(); Ads.resumePending(); }
  window.UI_READY = true;
  render();
  setInterval(() => { if (dirty) Save.save(); }, CONFIG.save.autosaveMs);
  setInterval(() => { const a = document.activeElement;
    if (a && (a.tagName === 'TEXTAREA' || a.tagName === 'INPUT' || a.tagName === 'SELECT')) return;
    if (S.sect.started) render(); }, 1000);
}
boot();
